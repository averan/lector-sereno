<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&display=swap">

<style>
/* ── Tokens: tema Claro (base) ───────────────────────────────── */
:root{
  --bg:#EDEAE4; --surface:#FCFBF8; --surface-2:#F4F1EB;
  --text:#23201C; --dim:#6B655C; --border:#DCD6CC;
  --accent:#14574E; --accent-ink:#FFFFFF; --accent-soft:#DDEBE7;
  --mark:#F7DFA6; --mark-text:#2A2318;
  --shadow:0 1px 2px rgba(35,32,28,.07), 0 10px 30px rgba(35,32,28,.10);
  --fs:20px; --lh:1.68;
}
:root[data-theme="papel"]{
  --bg:#E3D7BF; --surface:#F3E9D6; --surface-2:#EADEC6;
  --text:#37301F; --dim:#7B6C52; --border:#D5C5A5;
  --accent:#7A4A1E; --accent-ink:#FBF3E4; --accent-soft:#E4D2B2;
  --mark:#D9B96A; --mark-text:#2E2612;
  --shadow:0 1px 2px rgba(55,48,31,.08), 0 10px 30px rgba(55,48,31,.14);
}
:root[data-theme="penumbra"]{
  --bg:#2A2D30; --surface:#33373B; --surface-2:#3B4045;
  --text:#D5D1C9; --dim:#9B968D; --border:#464B50;
  --accent:#84C3B7; --accent-ink:#16211F; --accent-soft:#3E4F4C;
  --mark:#6D5A2C; --mark-text:#F6EEDC;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
}
:root[data-theme="nocturno"]{
  --bg:#0E1012; --surface:#15181B; --surface-2:#1D2125;
  --text:#C7C4BE; --dim:#8A857D; --border:#272B30;
  --accent:#6FBFB4; --accent-ink:#0C1413; --accent-soft:#1E3330;
  --mark:#4C3D18; --mark-text:#F1E7CF;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.5);
}
:root[data-theme="contraste"]{
  --bg:#000000; --surface:#000000; --surface-2:#111111;
  --text:#FFFFFF; --dim:#DDDDDD; --border:#FFFFFF;
  --accent:#FFE14D; --accent-ink:#000000; --accent-soft:#3A3200;
  --mark:#FFE14D; --mark-text:#000000;
  --shadow:0 0 0 1px #FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){
    --bg:#0E1012; --surface:#15181B; --surface-2:#1D2125;
    --text:#C7C4BE; --dim:#8A857D; --border:#272B30;
    --accent:#6FBFB4; --accent-ink:#0C1413; --accent-soft:#1E3330;
    --mark:#4C3D18; --mark-text:#F1E7CF;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.5);
  }
}

*{box-sizing:border-box}
[hidden]{display:none !important}   /* las clases con display propio no deben pisar el atributo */
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%;
}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:5px}
button{font:inherit; color:inherit; cursor:pointer}

/* ── Barra superior: mínima ──────────────────────────────────── */
.bar{
  position:sticky; top:0; z-index:30;
  background:var(--surface); border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:10px; padding:0 12px; height:46px;
}
.brand{display:flex; align-items:baseline; gap:7px; flex:none}
.brand .glyph{color:var(--accent); font-size:14px}
.brand b{font-size:14px; font-weight:700; letter-spacing:-.01em}
/* La lista de textos es el control principal de la barra */
.selBar{
  flex:1; min-width:0; font:inherit; font-size:13px; font-weight:500; color:var(--text);
  background:var(--surface-2); border:1px solid var(--border); border-radius:8px;
  padding:6px 8px; text-overflow:ellipsis;
}
.selBar:hover{border-color:var(--accent)}
.btn{
  background:var(--surface-2); border:1px solid var(--border); color:var(--text);
  border-radius:8px; padding:6px 11px; font-size:13px; font-weight:500;
  display:inline-flex; align-items:center; gap:6px; flex:none;
}
.btn:hover{border-color:var(--accent); color:var(--accent)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.primary:hover{color:var(--accent-ink); filter:brightness(1.08)}
.btn .caret{font-size:9px; opacity:.7}
#ajustesBtn[aria-expanded="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}

/* ── Panel de ajustes ────────────────────────────────────────── */
.panel{
  position:fixed; z-index:40; top:54px; right:10px;
  width:min(380px, calc(100vw - 20px));
  max-height:calc(100vh - 120px); overflow:auto;
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  box-shadow:var(--shadow); padding:4px 16px 16px;
}
.panel[hidden]{display:none}
.panel section{display:grid; gap:9px; padding:14px 0; border-top:1px solid var(--border)}
.panel section:first-of-type{border-top:0}
.lbl{
  font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
  color:var(--dim); white-space:nowrap;
}
.stats{font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums}

.stepper{display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden}
.stepper button{background:var(--surface-2); border:0; padding:7px 14px; line-height:1; font-size:15px; font-weight:600}
.stepper button:hover:not(:disabled){background:var(--accent); color:var(--accent-ink)}
.stepper button:disabled{opacity:.35; cursor:default}
.stepper .val{
  flex:1; display:grid; place-items:center; font-size:12px; font-weight:600; color:var(--dim);
  background:var(--surface); border-inline:1px solid var(--border); font-variant-numeric:tabular-nums;
}

.temas{display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
.chip{
  background:transparent; border:1px solid var(--border); border-radius:999px;
  padding:6px 8px; font-size:12px; display:flex; align-items:center; gap:6px; justify-content:center;
}
.chip .sw{width:13px; height:13px; border-radius:50%; border:1px solid rgba(128,128,128,.45); flex:none}
.chip[aria-pressed="true"]{border-color:var(--accent); color:var(--accent); font-weight:600; box-shadow:inset 0 0 0 1px var(--accent)}

.sel{
  width:100%; font:inherit; font-size:13px; color:var(--text);
  background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:8px;
}
.deslizador{display:grid; gap:5px}
.deslizador .top{display:flex; justify-content:space-between; align-items:baseline}
.deslizador .num{font-size:12px; font-weight:600; font-variant-numeric:tabular-nums}
input[type=range]{width:100%; accent-color:var(--accent); margin:0}

/* ── Aviso ───────────────────────────────────────────────────── */
.aviso{
  background:var(--accent-soft); color:var(--text); border-bottom:1px solid var(--border);
  font-size:12px; line-height:1.5; padding:9px 12px; display:flex; gap:10px; align-items:flex-start;
}
.aviso[hidden]{display:none}
.aviso p{margin:0; flex:1}
.aviso button{background:none; border:0; color:var(--dim); font-size:15px; line-height:1; padding:0 2px}

/* ── Lectura: el área grande ─────────────────────────────────── */
main{padding:30px 18px 96px}
#article{
  max-width:34em; margin:0 auto;
  font-family:"Literata",Georgia,"Times New Roman",serif;
  font-size:var(--fs); line-height:var(--lh); text-wrap:pretty;
}
#article .h{font-size:1.15em; font-weight:600; margin:0 0 1.1em; letter-spacing:-.01em; text-wrap:balance}
#article p{margin:0 0 1.05em}
.sent{border-radius:4px; transition:background .12s ease}
.sent:hover{background:var(--accent-soft); cursor:pointer}
.sent.on{
  background:var(--mark); color:var(--mark-text);
  box-decoration-break:clone; -webkit-box-decoration-break:clone;
  padding:.06em .1em; margin:0 -.1em;
}

/* ── Reproductor: una sola fila ──────────────────────────────── */
.player{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  background:var(--surface); border-top:1px solid var(--border);
  padding:7px 12px calc(7px + env(safe-area-inset-bottom));
  display:flex; align-items:center; gap:12px;
}
.transport{display:flex; align-items:center; gap:7px; flex:none}
.tbtn{
  width:34px; height:34px; border-radius:50%; border:1px solid var(--border);
  background:var(--surface-2); display:grid; place-items:center; padding:0;
}
.tbtn:hover{border-color:var(--accent); color:var(--accent)}
.tbtn svg{width:14px; height:14px; fill:currentColor}
#play{width:42px; height:42px; background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
#play:hover{color:var(--accent-ink); filter:brightness(1.08)}
#play svg{width:17px; height:17px}
.prog{flex:1; min-width:0; display:flex; flex-direction:column; gap:5px}
.prog .row{display:flex; justify-content:space-between; gap:10px; font-size:11px; color:var(--dim); font-variant-numeric:tabular-nums}
.prog .row span:first-child{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.prog .row span:last-child{flex:none}
.track{height:3px; border-radius:99px; background:var(--surface-2); border:1px solid var(--border); overflow:hidden}
.track i{display:block; height:100%; width:0; background:var(--accent); transition:width .18s linear}

@media (max-width:520px){
  .panel{right:8px; left:8px; width:auto; top:52px}
  .brand b{display:none}
  main{padding:24px 16px 92px}
  .tbtn{width:36px; height:36px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important; scroll-behavior:auto !important}
}
</style>

<header class="bar">
  <span class="brand"><span class="glyph">❧</span><b>Lector Sereno</b></span>
  <select class="selBar" id="lista" aria-label="Texto a leer"></select>
  <button class="btn" id="ajustesBtn" aria-expanded="false" aria-controls="panel">Ajustes <span class="caret">▼</span></button>
</header>

<div class="aviso" id="aviso" hidden>
  <p id="avisoTexto"></p>
  <button id="avisoCerrar" aria-label="Cerrar el aviso">×</button>
</div>

<div class="panel" id="panel" hidden>
  <section>
    <span class="lbl">Texto</span>
    <p class="stats" id="stats"></p>
  </section>

  <section>
    <span class="lbl">Tamaño de la letra</span>
    <div class="stepper">
      <button id="minus" title="Reducir (tecla −)" aria-label="Reducir el tamaño del texto">A−</button>
      <span class="val" id="fsVal">20 px</span>
      <button id="plus" title="Aumentar (tecla +)" aria-label="Aumentar el tamaño del texto">A+</button>
    </div>
  </section>

  <section>
    <span class="lbl">Tema</span>
    <div class="temas" id="temas" role="group" aria-label="Tema de lectura"></div>
  </section>

  <section>
    <span class="lbl">Voz</span>
    <select class="sel" id="voice" aria-label="Voz de lectura"></select>
    <div class="deslizador">
      <div class="top"><label class="lbl" for="rate">Velocidad</label><span class="num" id="rateVal">1.0×</span></div>
      <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">
    </div>
    <div class="deslizador">
      <div class="top"><label class="lbl" for="vol">Volumen</label><span class="num" id="volVal">100 %</span></div>
      <input type="range" id="vol" min="0" max="1" step="0.05" value="1">
    </div>
  </section>
</div>

<main><article id="article"></article></main>

<footer class="player">
  <div class="transport">
    <button class="tbtn" id="prev" title="Frase anterior" aria-label="Frase anterior"><svg viewBox="0 0 24 24"><path d="M7 5h2.5v14H7zm11 0v14l-9-7z"/></svg></button>
    <button class="tbtn" id="play" title="Leer en voz alta (espacio)" aria-label="Leer en voz alta"><svg id="playIcon" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg></button>
    <button class="tbtn" id="next" title="Frase siguiente" aria-label="Frase siguiente"><svg viewBox="0 0 24 24"><path d="M14.5 5H17v14h-2.5zM6 5l9 7-9 7z"/></svg></button>
    <button class="tbtn" id="stop" title="Detener" aria-label="Detener la lectura"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg></button>
  </div>
  <div class="prog">
    <div class="row"><span id="progText">Listo para leer</span><span id="progPct">0 %</span></div>
    <div class="track"><i id="progBar"></i></div>
  </div>
</footer>

<script>
(function(){
"use strict";

const $ = s => document.querySelector(s);
const synth = window.speechSynthesis;
const store = {
  get(k, d){ try{ const v = localStorage.getItem("lector."+k); return v===null?d:v; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("lector."+k, v); }catch(e){} }
};
function esc(t){ return String(t).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

const DEMO = `Cómo usar este lector

Este es un texto de ejemplo. Abre un archivo de texto con el botón de arriba, o arrástralo sobre esta página, y el contenido aparecerá aquí listo para leer.

Todos los ajustes viven en el panel Ajustes, para dejarle a la lectura el resto de la pantalla. Ahí eliges el tema, el tamaño de la letra, la voz, la velocidad y el volumen.

Para escuchar el texto, presiona el botón de reproducción. La frase que se está leyendo queda resaltada y la página la sigue sola. Si quieres empezar en otro punto, toca directamente la frase.

Los temas Claro y Papel descansan la vista de día; Penumbra y Nocturno sirven de noche; Contraste está pensado para quien necesita el máximo de legibilidad.

Todo ocurre dentro de tu navegador. El archivo que abres no se envía a ningún servidor.`;

const SERMON = `Lo mejor en el mejor lugar
(Nº 3002)

SERMÓN PUBLICADO EL JUEVES 23 DE AGOSTO DE 1906.

ENTREGADO POR CH SPURGEON,

EN EL TABERNÁCULO METROPOLITANO DE NEWINGTON, LA NOCHE DEL DOMINGO 31 DE OCTUBRE DE 1875.

"La ley de su Dios está en su corazón; ninguno de sus pasos resbalará." Salmo 37:31 .

Este versículo aparece en un salmo donde se traza un contraste muy vívido entre justos e impíos. Los impíos son descritos con frecuencia como ricos y prósperos, pero nadie verdaderamente sabio desearía estar en su lugar. El salmista señala con tanta claridad la brevedad de su prosperidad, la certeza de su destino final si no se regeneran y el terror de su caída, que ni por un instante sentimos envidia de ellos. En cuanto a los justos, David nos da abundantes indicios de que serán probados, perseguidos, odiados, etc., pero nos colma de dulces promesas de boca del Padre mismo, que nos sentimos plenamente satisfechos de compartir la suerte de sus hijos, por difícil que a veces sea. Si deseamos compartir la suerte de los justos, debemos ser como ellos y, entre otras cosas, este texto debe hacerse realidad en nuestra experiencia como en la de ellos. La Ley de nuestro Dios debe estar en nuestro corazón para que nuestros pasos no resbalen.

Recuerdo, cuando era niño, haber escuchado un sermón basado en un texto casi idéntico al que tenemos ante nosotros: «En mi corazón he guardado tu Palabra, para no pecar contra ti». La estructura de aquel sermón era tan excelente y se grabó tan firmemente en mi memoria que la usaré en esta ocasión, pues no puedo formular una mejor. El predicador dijo: «Aquí tenemos lo mejor: “Tu Palabra”. En el mejor lugar: “la he guardado en mi corazón”. Con el mejor propósito: “para no pecar contra ti”». Esa será la estructura de mi texto, con la siguiente modificación: lo mejor: «la Ley de su Dios». En el mejor lugar: «está en su corazón». Con el mejor resultado: «Ninguno de sus pasos resbalará».

I. Así que seré el primero en hablar, durante unos minutos, sobre LO MEJOR: "La Ley de su Dios".

En estos tiempos del Evangelio, debemos usar esta expresión en un sentido más amplio del que David pudo haber pretendido originalmente, y entenderla como algo mucho más que la Ley moral. Si somos cristianos, nos deleitamos en esa Ley, pero no estamos bajo ella como una norma de condenación y juicio, sino que nos regocijamos al obedecerla. No podríamos sugerir ninguna modificación que la mejorara. Los Diez Mandamientos son muy sencillos, pero absolutamente perfectos para el propósito para el que fueron concebidos. Añadirles uno o quitarles alguno sería desvirtuar el conjunto. Nos deleitamos en la Ley de Dios según el hombre interior. Quienes sean antinomianos, es decir, quienes están "en contra de la Ley", no debemos contarnos entre ellos, pues podemos decir con Pablo: "La Ley es santa, y los Mandamientos santos, justos y buenos". Y aunque somos carnales y a menudo nos sentimos "vendidos al pecado", no podemos encontrar ninguna falta en la Ley de Dios. Si la vida eterna pudiera haberse obtenido mediante alguna ley, habría sido mediante esa Ley; y aunque esa Ley ahora no puede hacer nada por nosotros más que condenarnos, al oír su terrible sentencia, sentimos que la Ley «es santa, justa y buena». Deseamos, pues, tener incluso la Ley moral en nuestros corazones, y que esté escrita allí, para que ninguno de nuestros pasos resbale.

Pero no podemos usar la expresión de David solo en ese sentido limitado. Ahora debe incluir todo el Libro de Dios y todas sus enseñanzas, pues a menudo se usa en ese sentido. "La Ley de su Dios está en su corazón". Tomen esta expresión como referida a toda la Escritura, y verdaderamente puedo decir que es lo mejor. Oh, hermanos y hermanas, ¿qué puede ser mejor para informar el entendimiento que la Palabra de Dios? ¿Quieren conocer a Dios? ¿Quieren conocerse a sí mismos? ¡Entonces escudriñen este Libro! ¿Quieren conocer el tiempo y cómo emplearlo? ¿Quieren conocer la eternidad y cómo prepararse para ella? ¡Entonces, escudriñen este Libro! ¿Quieren conocer el mal del pecado y cómo ser liberados de él? ¿Quieren conocer el plan de salvación y Cómo puedes participar de esto? ¡Este es el Libro que te instruirá en todos estos asuntos! No hay nada que un hombre necesite saber para los asuntos de su alma, entre este mundo y el Cielo, que este Libro no le revele. Bienaventurados los que lo leen día y noche, y especialmente bienaventurados los que lo leen con los ojos abiertos e iluminados por el Espíritu Divino. Si deseas alcanzar la salvación, elige la Palabra de Dios, y especialmente el Espíritu de Dios, como tu Maestro. No hay nada comparable a la Biblia para encender, santificar y encauzar todas las pasiones del alma.

Quizás no te basta con saber. Quieres algo o a alguien a quien amar. Hombres y mujeres de gran corazón, cuyo único deseo es tener un objeto digno en el que fijar vuestro afecto, acudid a esta Palabra de Dios, a esta Ley de Dios, a su Evangelio, y veréis allí cómo Dios mismo se convierte en el objeto del amor de sus criaturas, y cómo, en la Persona de su Hijo, tenéis el objeto más hermoso que jamás hayan contemplado ojos humanos. En Él tenéis a Alguien tan hermoso que una sola mirada suya basta para encender vuestra alma y enamoraros de Él para siempre. Vosotros, que tenéis poderosas fuentes de amor brotando en vuestra alma, venid aquí y dejad que fluyan libremente, porque aquí está Alguien digno de todas ellas. Y cuando hayáis amado a Cristo tanto como podáis, no le habréis amado ni la mitad de lo que merece ser amado. Aquí vuestras pasiones pueden arder, resplandecer y brillar con sagrado fervor, sin temor a ser idólatras, ¡y sin riesgo alguno de ser engañados!

Y si buscas algo más que la iluminación para comprender y experimentar la plenitud del amor que satisfaga tu corazón, si necesitas orientación práctica para tu vida diaria, este Libro te la brindará. En cualquier circunstancia de la vida en la que te encuentres, si este es tu mapa, no te extraviarás ni naufragarás espiritualmente. Si fueras rey, aquí podrías aprender tu deber; y si fueras mendigo o el más pobre de los pobres, aquí podrías encontrar consuelo e instrucción. Padres, aquí podrían aprender a administrar sus hogares. Hijos, aquí podrían aprender los deberes propios de su posición en sus diversas relaciones. Sirvientes, amos, esposos, esposas, enfermos, personas con buena salud, pobres y ricos: este Libro es para todos ustedes, y cuando lo consulten con la actitud correcta, ¡les hablará a todos! Cualquiera que sea su situación, este Libro los acompañará. ¡Es un Libro tan maravilloso que se adapta a todo tipo de hombres y mujeres! Susurra suavemente junto al lecho del enfermo y a menudo ha clamado con voz atronadora, como una trompeta, en medio de la furia de la tormenta. Tiene un mensaje para ti mientras aún disfrutas de la plenitud de tu juventud y una promesa para ti cuando te apoyes en tu bastón y te tambalees hacia la tumba. Es Biblos, el Libro, el libro de todos los días, lleno de sabiduría para cada día de la semana, durante todo el año. Y cuando el ciclo de la vida se complete, verás cómo el Libro se adaptó igualmente a los niños y al anciano cuya vida está llegando a su fin.

Quizás, querido amigo, digas: «Sé qué camino debo seguir. Sé a quién debo amar y confío en que se me ha instruido sobre lo que debo creer; ¡por todo esto valoro muchísimo la Biblia! Pero lo que realmente necesito es la fortaleza de mis convicciones, la fuerza de carácter que me permita seguir los caminos que sé que son correctos». Sí, entiendo lo que quieres decir. Pero ¿dónde más encontrarás verdades tan poderosas como las que resplandecen en las páginas de este bendito Libro? ¿Dónde leerás relatos tan capaces de inspirar valentía como los que contiene este Libro? Sobre todo, en Aquel que es la esencia de este Libro, a quien apuntan todas sus páginas, puedes ver un ejemplo de amor desinteresado y de perfecta consagración a Dios y al hombre, que, si el Espíritu Santo te lo concede, te dará toda la fuerza de carácter y la valentía que puedas necesitar. Si los jóvenes leyeran más la Biblia, no se desviarían tan fácilmente como ahora. Cuando un joven se mantiene firme en su postura y dice: «No puedo ni voy a mentir, ni a cometer actos deshonestos en los negocios, ni a frecuentar lugares de diversión donde no pueda ir con la conciencia tranquila», creo que ha purificado su camino al seguir la Palabra de Dios. ¡Veo aquí el tesoro del valor santo! Al leer estas páginas, comulga con Dios, comulga con Jesucristo, comulga con los santos, mártires y apóstoles, y tú mismo absorberás algo de su determinación y resolución, algo de su celo y energía por lo correcto y lo verdadero.

¡Aquí es donde se forjan los verdaderos hombres! Al leer estas páginas, los débiles se fortalecen y los enanos se convierten en gigantes. Sí, y si dices: «A menudo me siento infeliz; hay un vacío doloroso en mi espíritu, algo que me impide estar completamente satisfecho. Tengo una especie de sanguijuela en mi interior que clama: “¡Dame, dame!”, y aún no he encontrado el alimento con el que calmar su clamor». ¡Es en este Libro donde encontrarás el consuelo que tu espíritu anhela! Aquí se puede aliviar toda pena, satisfacer todo deseo justo y expulsar del espíritu todos los deseos erróneos y las malas pasiones. Cuando el Espíritu Santo aplica este Libro al alma, ¡es alimento para el hambre del hombre y medicina para su enfermedad!

Posando su mano sobre su frente febril, lo refresca hasta devolverle la salud. O, si tiene mucho frío, lo calienta hasta llenarlo de energía divina. De hecho, no hay fin a las bendiciones que este Libro otorga.

«Este es el campo donde yace oculta la perla de precio desconocido. ¡Es divinamente sabio aquel mercader que hace suya la perla!» Este es el mejor de los libros, como dice Christopher Harvey.

"Es el Libro de Dios. ¿Y si yo dijera: Dios de los Libros? Que el que mire

Enojado por esa expresión, por demasiado atrevida, sus pensamientos se ahogan en silencio hasta que encuentre a otra igual.

Cada una de sus páginas es una hoja de oro. Mejor dicho, aquí están los billetes del Cielo, listos para ser canjeados por aquellos que tengan la fe suficiente para ofrecérselos al Dios que los emitió, para que Él enriquezca sus almas con toda clase de dicha. Esto, pues, es lo mejor: «La Ley de su Dios».

II. Ahora bien, en segundo lugar, tenemos lo mejor EN EL MEJOR LUGAR: "La ley de su Dios está en su corazón". ¿Qué significa esto?

Significa, en primer lugar, que lo ama. Aquello que amamos siempre se dice que está en nuestros corazones, y la razón por la que lo ama se da en el texto: «La ley de su Dios» —no simplemente la Ley de Dios, fíjense— sino «La ley de su Dios». Los hombres no aman la Ley de Dios hasta que saben que Él es su Dios. ¡Bendita sea, en verdad, esta preciosa posesión que Dios nos da primero en Él mismo, y luego en su Palabra! ¿Acaso no les gusta leer un libro escrito por un amigo cercano y querido? Sin duda, les resultará mucho más interesante que las obras de desconocidos. Pueden pasar por delante de cien libros en un puesto o en una librería, pero si ven un libro escrito por alguien con quien jugaban, o quizás por alguien aún más cercano y querido, ¡se interesan por él al instante! Así sucede con este bendito Libro escrito por nuestro Padre Celestial, este Libro que nos habla de nuestro Hermano mayor, este Libro en el que el Espíritu Divino insufló aliento de vida y sobre el cual Él siempre brilla como el gran Iluminador. ¡Este Libro siempre debe ser indescriptiblemente querido para nosotros! ¡Cuán querida ha sido la Biblia para los santos de Dios en épocas pasadas! Incluso arriesgaron sus vidas antes que desprenderse de ella, y muchos de ellos murieron como mártires por traducirla y transmitir sus mensajes a otros. Y este Libro es igualmente querido para nosotros. Antes que renunciar a la más mínima pizca de su enseñanza inspirada, confío en que estaríamos dispuestos a ir a la hoguera como lo hicieron nuestros valientes antepasados ​​en tiempos de la cruel Reina María. ¡Preciosa Biblia, estás en nuestros corazones porque te amamos!

Pero David quería decir algo más. La Ley de su Dios estaba en su corazón para ser recordada y amada. Pronto olvidamos lo que solo aprendemos intelectualmente, por eso les decimos a nuestros hijos que aprendan las cosas "de memoria". Lo que está escrito en la mente puede borrarse, pero lo que está escrito en el corazón permanece allí. Ni la enfermedad, ni la muerte, ni el diablo mismo, pueden jamás arrebatarnos lo que está en nuestros corazones. Hemos conocido personas gravemente enfermas que sufren pérdida de memoria, y esa es una pérdida muy seria. Pero también hemos visto cómo conservan intactos sus recuerdos de las cosas espirituales incluso cuando han olvidado a sus propios esposos o esposas, tan extrañamente la mente o el corazón se aferran con mayor firmeza a aquello que está grabado más profundamente en ellos. Si tienes la Palabra de Dios en tu corazón, no importará quién intente arrebatártela. ¡Ni todos los jesuitas, dentro o fuera del infierno, podrían arrancarle a un hombre el Evangelio que está escrito en su corazón! Podrían fácilmente apartar a algunas personas de su credo, pues no es más que un credo, vagamente arraigado en sus mentes. Pero la Verdad que realmente ha penetrado en el corazón de un hombre, ¡ni Satanás ni todas sus huestes podrían arrebatársela jamás! Asegúrate, pues, de que la Ley de tu Dios esté en tu corazón, afectándote y motivándote con tal fuerza, que permanezca tan tenazmente en tu memoria que jamás puedas abandonarla.

La frase «La Ley de su Dios está en su corazón» tiene un tercer significado: obedecerla, pues el corazón es el órgano más influyente del cuerpo. Lo que se hace en el corazón afecta a cada parte del ser humano. Una enfermedad en el corazón impide que el ser humano, en su totalidad, esté bien. Si los afectos del corazón están puestos en Dios, todo está bien, pues la intención, el motivo, guía al ser humano. «Como piensa en su corazón, así es él». Si los ojos de tu corazón son puros, todo tu cuerpo estará lleno de luz. Pero si los ojos de tu corazón son malvados, todo tu cuerpo estará lleno de oscuridad. Si la Ley de Dios está en el corazón, entonces cada latido de ese órgano cerebral afectará al ser humano en su totalidad. Si el ser humano ha llevado una vida malvada, será transformado por completo. Y si, por la gracia de Dios, ha sido mejor que otros, la Ley de su Dios obrará en su corazón y en su vida, y hará por él todo lo que bien podría desear al obedecerla.

Tener la Ley de Dios en el corazón significa, de hecho, vivir conforme a ella; tener el Evangelio como alimento del alma y a Cristo, el del Evangelio, como esperanza para la eternidad. El corazón es aquello por lo que vivimos; por lo tanto, si la Ley de Dios está en nuestro corazón, viviremos conforme a ella y obtendremos de ella nuestro consuelo y sustento. Que cada uno juzgue hasta qué punto esto es cierto en su caso. No somos perfectos, pero deseamos serlo, y esto demuestra que la Ley de nuestro Dios está en nuestro corazón. Pecamos, pero nos afligimos por pecar, y esto demuestra que hay en nosotros un anhelo de santidad perfecta. Decimos, con el apóstol Pablo: «El querer está en mí, pero no el hacer el bien... Cuando quiero hacer el bien, el mal está presente en mí». Sin embargo, ese querer y ese querer demuestran que nuestro corazón lleva la Ley de Dios dentro. Dios los mira, queridos amigos, muy de acuerdo con lo que desean ser. Y si en tu alma hay fuertes anhelos de lo perfecto, Él acepta esos deseos y te bendice por medio de Cristo Jesús, su Hijo. John Bunyan solía expresarlo en una de sus sencillas alegorías de esta manera: «Necesitas que un hombre traiga un médico y le pides que se dé prisa. Entonces monta su caballo, pero es un animal cojo y débil, que no puede ir rápido. Sin embargo, ves que tu hombre volaría si pudiera, pues lo azota y espolea con todas sus fuerzas para intentar que avance. Así que», dice Bunyan, «el Señor a menudo ve que el espíritu está dispuesto a esforzarse, pero la carne es débil, como el caballo cojo. Él ve lo que sus siervos desearían ser y los acepta como si ya lo fueran». ¡Qué suerte tenemos de tener un Maestro tan misericordioso que ve con tan buenos ojos nuestro servicio imperfecto! Hermanos y hermanas, tengan la Ley de Dios en sus corazones, y aunque hoy sean insensatos, mañana vencerán algunas de esas insensateces. Y, por la gracia de Dios, seguirán venciendo cada vez más, hasta que la Ley, escrita en sus corazones, esté también escrita en todos sus miembros, y sean presentados sin mancha ni defecto ante el Trono de Dios.

III. Ahora debo pasar al último punto, a saber, EL MEJOR RESULTADO: "Ninguno de sus pasos resbalará".

Aquí tenemos a un hombre que lleva la Palabra de Dios en su corazón, y se nota que cuida cada paso. Un paso es algo insignificante. Debemos dar cientos de pasos para caminar una milla, pero los hombres de bien se fijan en los pequeños detalles. El hombre que lleva la Ley de Dios en su corazón es escrupuloso y concienzudo con sus pensamientos e imaginaciones, así como con sus palabras y acciones. Por lo tanto, la promesa del texto le viene como anillo al dedo, pues es una promesa sobre las pequeñas cosas: «Ninguno de sus pasos resbalará». Recuerdo —o mejor dicho, espero que aún me pase— que justo después de mi conversión, casi temía poner un pie delante del otro por miedo a equivocarme. Y a menudo me detenía al hablar, por temor a no decir la palabra adecuada. Esa santa cautela es muy loable en todos los que la poseen. Ojalá muchos más la tuvieran. ¡Qué vida tan ajetreada para algunos! No solo no piensan antes de actuar, ¡sino que ni siquiera parecen pensar después de haber actuado! Se lanzan a ciegas y sin pensar, presumiendo donde deberían estar orando y confiados en sí mismos donde deberían, con profundo arrepentimiento, humillarse ante Dios. Nuestro viejo proverbio dice: «Cuida los centavos, y las libras se cuidarán solas». Y la misma regla se aplica a nuestras acciones. Si somos cuidadosos con nuestras pequeñas acciones, las grandes seguramente serán correctas. ¡Ojalá fuéramos todos muy cuidadosos con nuestra forma de actuar en casa! ¡Ojalá fuéramos cuidadosos con lo que decimos al sentarnos a la mesa del té! Algo tan pequeño como eso puede causar un daño casi infinito. Creo que los peores males del mundo surgen de pequeñas cosas. Se dice que la semilla del mal es tan pequeña como un huevo de mosquito, y así es. Entonces, cuidemos bien esos huevos de mosquito, no sea que eclosionen males mucho mayores.

Creo también que, cuando los cristianos se equivocan, suele ser en algo de lo que se creían completamente seguros, como los hijos de Israel con los gabaonitas. Estas personas llegaron a Gilgal vestidas con ropas viejas, zapatos viejos y ropas desgastadas, y llevando pan seco y mohoso. ¿Qué necesidad había de pedir consejo a Dios? Era tan evidente como el sol al mediodía que venían de muy lejos, deseando formar una alianza con los israelitas por las maravillas que Dios había obrado para su pueblo. Así que ni siquiera Josué oró al respecto, y fue engañado, pues estos gabaonitas eran vecinos cercanos y habían engañado a los israelitas para que formaran una alianza que siempre les suponía un obstáculo en su campaña. Siempre desconfía donde no tienes sospecha y teme donde no tienes miedo; teme especialmente a quien te dice que no tienes por qué temerle. Un hombre le dijo a un amigo mío: «Necesito un préstamo de tanto dinero. Sabes que soy una buena persona. Llevo muchos años perteneciendo a una iglesia cristiana. No soy como Fulano y Mengano, que últimamente han fracasado. Puedes confiar en mí, lo sabes».

—No —dijo mi amigo—, no le confiaría ni media corona a un hombre cualquiera. Y tenía razón, ¡porque quienes confiaron en él lo perdieron todo! Hay que tener mucho cuidado en casos así. Si se trata de gente conocida por ser sinvergüenza, no hace falta estar alerta, pero si se trata de sinvergüenzas que se hacen pasar por hombres honrados, hay que estar muy atento o seguro que te engañarán. Han ocultado su naturaleza de lobo con piel de cordero, ¡así que más vale que veas qué se esconde debajo!

Cuando David dice: «La ley de su Dios está en su corazón; ninguno de sus pasos resbalará», ¿qué quiere decir con esa última frase? Quiere decir que Dios lo guiará. Como tiene la Ley de Dios en su corazón, ¡tendrá la guía de Dios para sus pasos! En el versículo 23, David dice: «Los pasos del hombre bueno son ordenados por el Señor, y él se deleita en su camino». Cuando un hombre realmente lleva la Ley de Dios en su corazón, Dios cuidará de que no la lleve a ningún lugar malo, porque, como David continúa diciendo, «el Señor lo sostiene con su mano». A todo hombre, sea quien sea, le sobrevendrán repentinos ataques de tentación; pero si la Ley de su Dios está en su corazón, estará prevenido y preparado para ellos. También vendrán largos asedios de tentación, y muchos han caído poco a poco. Pero si la Ley de su Dios está en su corazón, estará a salvo incluso de ellas. A veces, surgirá la tentación que produce la soledad, cuando Satanás lo incitará a hacer el mal. Como nadie lo observa, ¿acaso no podría obrar mal? Pero, con la Ley de su Dios en su corazón, no hará nada malo, aunque jamás lo descubran; ¡esa Ley en su corazón es un freno suficiente para apartarlo del mal! A veces se sentirá perplejo. Me pregunto si todo hombre de negocios aquí no se encuentra, en algún momento, desconcertado sobre qué debe hacer. Anhela hacer lo correcto, pero no sabe cuál de dos caminos es el adecuado. Pues bien, ese es el momento de dejar que la Ley de tu Dios, que está en tu corazón, sea como una brújula para ti, y de invocar esta promesa y decir: «Oh Señor, has dicho que, como tu Ley está en mi corazón, ninguno de mis pasos resbalará. Cumple tu palabra para con tu siervo, en la cual me has hecho poner mi esperanza».

Que tus pasos se desvíen sería deshonrar tu reputación. ¡Cuántos hombres que se han mantenido firmes durante un tiempo, ya sea en la Iglesia cristiana o en los negocios, se han desviado de esta manera! Recuerdo haber leído, hace algunos años, cuando se produjeron tristes fracasos de este tipo, que «ni las corbatas blancas de Exeter Hall ni los abrigos grises de Lombard Street pudieron impedir que algunos hombres se convirtieran en grandes sinvergüenzas». Y, a veces, ha habido demasiadas razones para decirlo. Pero la Ley de Dios en el corazón es mejor que una corbata blanca al cuello o un abrigo gris a la espalda, pues mantiene los pasos de los hombres para que no deshonren a su Dios. Las pruebas pueden llegar a quienes viven más cerca de Dios —posiblemente llegarán aún más por haber vivido cerca de Él—, pero no habrá mancha en el carácter ni caída de la integridad que causa tanta tristeza. ¡Un verdadero cristiano preferiría morir antes que permitir que esto sucediera! Y podrá consolarse con la seguridad de que si la Ley de su Dios está en su corazón, "ninguno de sus pasos resbalará".

Ni caerá en la desesperación. Puede temblar, puede tambalearse, puede estar a punto de caer, pero como tiene la Ley de su Dios en su corazón, se pondrá de pie de nuevo y seguirá adelante. Espero que todos los que tenéis que librar la buena batalla de la fe y peregrinar al Cielo, encuentren en este texto todo el consuelo posible. Habéis pedido tener la Ley de vuestro Dios en vuestro corazón, y allí está. ¡Pues bien, seréis sostenidos! Vas a vivir, joven, donde no hay otros cristianos, pero tus pasos no resbalarán, porque la Ley de tu Dios está en tu corazón. Vas a ocupar, hermano mío, un puesto donde tendrás a tu cargo a un gran número de personas, y apenas sabes cómo las gestionarás. Pero con la Ley de tu Dios en tu corazón, ninguno de tus pasos resbalará. Mi joven hermana, vas a vivir con parientes impíos donde apenas tendrás oportunidad de orar en privado; sin embargo, con la Ley de tu Dios en tu corazón, ¡ninguno de tus pasos resbalará! Mi joven hermano, estás a punto de convertirte en pastor de una gran iglesia y tiemblas por miedo a cometer un grave error y deshonrar a Dios. Pero si Su Ley está en tu corazón, ninguno de tus pasos resbalará. ¡No tienes por qué preocuparte por lo resbaladizo del camino si la Ley de tu Dios está en tu corazón! Muchos resbalan cuando el camino no está resbaladizo, y muchos hombres, por la Gracia de Dios, se mantienen firmes donde parece un milagro que se mantengan en pie. Los hombres no están en peligro en proporción a su posición, sino que están en peligro o a salvo según la medida de su Gracia. Si la Ley de tu Dios está en tu corazón, ¡podrás enfrentarte a un mundo armado sin temor! Si Dios te convirtiera en el líder de mil escuadrones de los ejércitos del Cielo sobre sus caballos blancos, serías capaz de comandarlos a todos si tuvieras Su Ley en tu corazón y te entregaras completamente a Él.

Tenga en cuenta también que si lleva la Ley de su Dios en su corazón, esto implica que también lleva allí al Legislador, pues no puede separar al Legislador Divino de su Ley. ¿Lo ama? ¿Confía en Él? ¿Le resulta agradable su nombre? ¿Es como ungüento que endulza su espíritu? Si ama a quien le da la Ley, debe amar la Ley que Él le da. Estamos bajo la Ley —la Ley de la Gracia— de Jesucristo. Su yugo es fácil y su carga ligera para quienes confían en Él y lo aman. Si confía en Él y lo ama, eso demuestra que lleva su Ley en su corazón.

Si llevas la Ley de tu Dios en tu corazón, también llevas allí al gran Maestro de la Ley, el Espíritu Santo. Eres consciente de sus consuelos, a veces de sus reprensiones y a menudo de sus ánimos. ¿Cómo te va en este sentido? ¿Sabes algo acerca de la obra del Espíritu Santo en tu corazón? Lamentablemente, hay muchos que no saben que existe el Espíritu Santo, pues nunca han sentido su poder. Pero la Ley de Dios nunca está en el corazón hasta que el Espíritu Santo la deposita allí; y donde Él deposita esa Ley, permanece con ella, para abrir nuestro entendimiento para que podamos recibir las Escrituras y para abrir las Escrituras para que nuestro entendimiento las reciba. ¿Qué sabes acerca de Dios Hijo? ¿Es Él tu Salvador?

¿Qué sabes del Espíritu Santo? ¿Es Él tu Vivificador y Consolador? Si lo es, ten buen ánimo, pues ninguno de tus pasos resbalará. Pero si no lo es, y si rechazas esta Ley de Dios, recuerda aquel solemne texto: «Sus pies resbalarán a su debido tiempo». Se yerguen en su prosperidad. Son grandes, famosos, felices, rebosantes de alegría, y solemos envidiarlos al verlos en sus altos cargos. ¡Pero cuidado! ¡Están parados sobre un Alpes de hielo! El camino que recorren es muy estrecho y, en un instante, cuando menos lo esperan, sus pies resbalarán y caerán en el abismo sin fondo. Caen, perdidos, perdidos, ¡PERDIDOS! Los altos cargos que una vez ocuparon solo aumentan la profundidad de su caída. Pasan de sus copas de vino rebosantes a anhelar una gota de agua para refrescar sus lenguas resecas. ¡Pasan de los manjares de la mesa de Dives a las más extremas desgracias del infierno! Lázaro una vez les pidió migajas, ¡y ahora ellos con gusto se convertirían en mendigos y le pedirían la bendición del mismísimo Lázaro! Su día se ha convertido en noche, su gloria en vergüenza, sus banquetes en miserias, sus honores en vergüenza y desprecio eternos. Sean sabios, hombres y mujeres, y busquen a su Salvador ahora, no sea que, como un sueño al despertar, la belleza de su presente vida mortal se desvanezca y no quede más que la espantosa forma de una existencia desperdiciada, castigada para siempre con los golpes de la terrible ira de Jehová.

«¡Pecadores, busquen su gracia, cuya ira no pueden soportar! ¡Refugiense en su cruz y encuentren allí la salvación! Así se quitará la maldición por la cual el Salvador derramó su sangre, y el último y terrible día derramará sus bendiciones sobre ustedes.» ¡Que Dios los bendiga a todos, por amor de Jesucristo! Amén.

EXPOSICIÓN DE CH SPURGEON:

SALMO 37.

Este es uno de los Salmos de David que a menudo han animado a los santos de Dios cuando se han sentido perplejos por la prosperidad de los impíos y sus propios problemas.

Versículos 1, 2. No te inquietes por los malhechores, ni tengas envidia de los que obran iniquidad. Porque pronto serán cortados como la hierba y se marchitarán como la hierba verde. ¿Y si su suerte es dulce? Pero considera cuán breve es. Ningún hombre sabio envidia al toro que está siendo engordado, pues sabe que es engordado para el matadero. Nadie envidiará los placeres de los impíos cuando recuerden cuán transitorios deben ser. Déjalos que los tengan, y exhorto a todos los cristianos a que hagan todo lo posible por hacer felices a los impíos. Este es el único tiempo feliz que podrán tener a menos que se arrepientan y se vuelvan al Señor. Así que no los hagas infelices, sino contribuye con todo lo que puedas a la poca dicha que conocerán, porque pronto terminará. Ciertamente, si eres hijo de Dios, no tienes motivo para envidiarlos.

3, 4. Confía en el SEÑOR y haz el bien; así habitarás en la tierra y ciertamente serás alimentado. Deléitate asimismo en el SEÑOR, y Él te concederá los deseos de tu corazón. He aquí un deber que es tanto un placer como un deber; no, es incluso más un placer que un deber: «Deléitate asimismo en el Señor». He aquí un mandamiento para ser feliz de la manera más segura imaginable. De todos los deleites, el más delicioso es el deleite en Dios, y a esto se nos ordena. Pero qué privilegio es lo que se le añade: «Él te concederá los deseos de tu corazón». ¿Por qué? Porque, cuando te deleitas en Dios, tus deseos serán aquellos que Él puede conceder con seguridad. Al deleitarte en Él, solo desearás aquello que es para su gloria y entonces, sin ninguna restricción, Él podrá prometerte y concederte los deseos de tu corazón.

5. Encomienda tu camino al SEÑOR. Con fe, pero sin temor, pon tu mano en la suya y síguelo adondequiera que te lleve.

5-7. Confía también en Él, y Él lo hará. Él hará resplandecer tu justicia como la luz, y tu derecho como el mediodía. Descansa en el SEÑOR. ¡Oh, qué dulces preceptos son estos! —más fáciles de leer y oír que de practicar—, sin embargo, si se nos concede la gracia, los encontraremos benditamente fáciles de practicar. Ciertamente, si es fácil descansar en cualquier lugar, debe ser fácil «descansar en el Señor». No hay otro lugar de descanso como aquel donde la Omnipotencia y el amor eterno se unen dulcemente: «Descansa en el Señor».

7-9. Y esperad pacientemente en Él; no os inquietéis por el que prospera en su camino, por el hombre que lleva a cabo planes malvados. Dejad la ira y abandonad el enojo; no os inquietéis para hacer el mal, porque los malhechores serán exterminados, pero los que esperan en Jehová heredarán la tierra. Creo que, en cierto sentido, el hijo de Dios obtiene lo mejor de ambos mundos. Puede que en este mundo no obtenga lo que los impíos consideran lo mejor. Y en cuanto al bien mundano, a menudo obtiene lo peor, pero Dios hace que su comida de hierbas sea más dulce para él que el buey muerto para el impío. Si supiera que moriría como un perro, aun así desearía ser cristiano. Si no hubiera más allá, ni mundo venidero, e incluso si mi suerte, juzgada según los hombres, fuera la más miserable de todas, aun así, tener a Dios como mi amigo aquí habría convertido incluso esa miseria en felicidad.

«¡Oh Dios de Amor, cuán dichosos son aquellos que se deleitan en Tus caminos! ¡Tu presencia los guía todo el día y los alegra toda la noche!»

10. Dentro de poco, el impío ya no existirá; buscarás su lugar, pero no lo encontrarás. ¡Cuántas veces incluso el lugar donde vivía —su casa— se convierte en ruinas! ¡El mismo palacio donde habitaba el tirano es incendiado o destruido de alguna otra manera! ¡Parece que la decadencia se deleita en obrar con el paso del tiempo sobre los palacios de los déspotas!

11. Pero los mansos heredarán la tierra y se deleitarán en la abundancia de paz. Esta profecía se cumplirá plenamente en los últimos días, pero ya se está cumpliendo. ¿Quién no ve que el hombre que realmente disfruta de la vida y del mundo es, después de todo, el cristiano manso y humilde? Aquel pastor de Salisbury Plain, del que leíamos en nuestra infancia, cuando le preguntaron qué pensaba del clima, respondió que era buen tiempo, pues Dios lo había enviado; y cualquier clima le agradaba si agradaba a Dios. Cualquiera puede ver que un hombre así goza de buena salud y que hereda la tierra y posee mucho más de lo que vale la pena tener —a saber, tranquilidad y paz interior— que el dueño de vastas extensiones de tierra que no tiene verdadero descanso en el Señor.

12-19. El impío trama contra el justo, y rechina los dientes contra él. El Señor se reirá de él, porque ve que le llega su día. Los impíos han desenvainado la espada y tensado el arco para derribar al pobre y al necesitado, y para matar a los de conducta recta. Su espada les atravesará el corazón, y sus arcos se quebrarán. Lo poco que tiene el justo es mejor que las riquezas de muchos impíos. Porque los brazos de los impíos serán quebrados, pero el Señor sostiene a los justos. El Señor conoce los días de los rectos, y su herencia será para siempre. No serán avergonzados en el tiempo malo, y en los días de hambre serán saciados. Permítanme leer de nuevo el versículo 19, para que cualquier hijo de Dios aquí, que se encuentre en grandes dificultades, pueda aferrarse a él: «No serán avergonzados en el tiempo malo, y en los días de hambre serán saciados».

20-25. Pero los impíos perecerán, y los enemigos del SEÑOR serán como la grasa de los corderos: se consumirán, se convertirán en humo. El impío pide prestado y no paga; pero el justo tiene misericordia y da. Porque los que son bendecidos por Él heredarán la tierra, y los que son malditos por Él serán cortados. Los pasos de un buen

El hombre es ordenado por el SEÑOR, y Él se complace en su camino. Aunque caiga, no quedará completamente derribado, porque el SEÑOR lo sostiene con su mano. Fui joven, y ahora soy viejo; pero no he visto al justo desamparado, ni a su descendencia mendigando pan. Hemos comentado a menudo aquí que nosotros también, aunque no somos viejos, nunca hemos visto al justo desamparado, y no creemos que el hombre o la mujer más ancianos de aquí lo hayan visto jamás. David dice que no había visto a la descendencia del justo mendigando pan. Bueno, era rey, así que no era probable que viera a muchos pobres, pero nosotros sí hemos visto varias veces a la descendencia del justo mendigando pan. No es algo común, pero lo hemos visto; y cuando la descendencia del justo se porta mal, cuando deshonra el nombre de su padre, tendrá que mendigar pan igual que los hijos de los demás. Caerán en la pobreza por la ociosidad y la bebida, igual que los demás. Y he tenido la desgracia, dentro de estas mismas paredes, de tener que brindar auxilio a los hijos indignos y depravados de pastores cristianos de cuya piedad no podía dudar, y algunos de los cuales ahora están en el Cielo. Los hijos de estos hombres buenos han andado en contra de Dios, ¡y Dios ha andado en contra de ellos! ¡A menudo he esperado que la pobreza que veía pudiera ser el medio para llevarlos a buscar al Dios de sus padres!

Tú que temes al Señor puedes confiar en esto: si el Señor te ayuda a educar bien a tus hijos, Él cuidará de ellos. Si son verdaderamente descendientes de justos, practicando la justicia, tus hijos no mendigarán pan, pues el Señor proveerá para ellos. Verás que Dios siempre cuida de los hijos de quienes le sirven con fidelidad. Parece decirles: «Ocúpate de mis asuntos, y yo me ocuparé de los tuyos. Si cuidas de mis hijos, yo cuidaré de los tuyos». Si servimos al Señor con todo nuestro corazón, podemos estar seguros de que el Dios de los padres será también el Dios de los hijos.

26-40. Él es siempre misericordioso, y presta, y su descendencia es bendita. Apártate del mal, y haz el bien, y morarás para siempre. Porque el Señor ama la justicia, y no abandona a sus santos; ellos son preservados para siempre; pero la descendencia de los impíos será cortada. Los justos heredarán la tierra, y morarán en ella para siempre. La boca del justo habla sabiduría, y su lengua habla de justicia. La ley de su Dios está en su corazón; ninguno de sus pasos resbalará. El impío vigila al justo, y busca matarlo. El SEÑOR no lo dejará en su mano, ni lo condenará cuando sea juzgado. Espera en el Señor, y guarda su camino, y él te exaltará para heredar la tierra; cuando los impíos sean cortados, lo verás. He visto al impío en gran poder, y extendiéndose como un laurel verde. Pero pasó, y he aquí, no estaba; sí, lo busqué, pero no lo pude hallar. Fíjense en el hombre íntegro y observen al recto, porque el fin de ese hombre es la paz. Pero los transgresores serán destruidos juntos; el fin de los impíos será exterminado. Pero la salvación de los justos viene del Señor; Él es su fortaleza en el tiempo de angustia. Y el Señor los ayudará y los librará; los librará de los impíos y los salvará, porque en Él confían.`;

Salmos 37:4
15 de junio de 1862

«Deléitate asimismo en Jehová, y él te concederá los deseos de tu corazón.»
— Salmo 37:4

En nuestro texto hay dos enseñanzas que deben resultar muy sorprendentes para quienes son ajenos a la verdadera piedad; para los creyentes sinceros, estas maravillas son hechos reconocidos, pero para el mundo exterior parecerán sumamente extrañas. En primer lugar, se describe la vida del creyente como un deleite en Dios; y así se nos confirma la gran verdad de que la verdadera religión rebosa de felicidad y gozo. Las personas impías y los meros profesantes nunca ven la religión como algo gozoso; para ellos es servicio, deber o necesidad, pero nunca placer ni deleite. ¿Por qué suben a la casa de Dios? ¿No es acaso por costumbre, una costumbre que desearían evitar si se atrevieran? ¿Por qué asisten a las ordenanzas de la Iglesia? ¿No es acaso por la esperanza farisaica de obtener mérito, o por un temor supersticioso? ¿Cuántos ven las formas de la religión como amuletos para evitar el mal, o como males menores con los que escapan del temido juicio? ¿Qué es su servicio sino trabajo arduo, y su culto sino cansancio? Preguntad a los mundanos qué piensan de la religión, — e incluso cuando practican sus ritos externos la desprecian como algo aburrido y tedioso. “¡Qué cansancio es!” La aman tanto como el asno ama el trabajo, o el caballo el látigo, o el prisionero la cinta de correr. Claman por sermones cortos; de hecho, ninguno les convendría más. Con qué alegría recortarían las horas del domingo; de hecho, si los sábados solo vinieran una vez al mes, lo preferirían. La pesada necesidad de las costumbres piadosas les pesa como tributo a una provincia conquistada. Rinden a la religión una observancia del carácter de un impuesto o peaje que exige la costumbre; pero las ofrendas libres no conocen, y el disfrute amoroso de la santa comunión no pueden entender. Sirven a Dios como lo hizo Caín, quien trajo su ofrenda, es cierto, pero la trajo tarde; la trajo porque era la costumbre familiar, y no quería ser superado por su hermano; Lo trajeron del fruto común de la tierra, y con un corazón hosco y sin amor. Estos cainitas traen lo que se ven obligados a traer, y no mezclan la fe en la sangre de Jesús con sus ofrendas; llegan a la casa de Dios con talones de plomo, y se van como si tuvieran plumas en los pies; sirven a Dios, pero es para obtener algún beneficio, o porque no se atreven a hacer otra cosa. La idea del deleite en la religión es tan extraña para la mayoría de los hombres, que no hay dos palabras en su idioma más distantes que «santidad» y «deleite». Ah, pero los creyentes que conocen a Cristo, entienden que el deleite y la fe están tan benditamente unidos, que las puertas del infierno no pueden separarlos. Quienes aman a Dios con todo su corazón, encuentran que sus caminos son caminos de deleite, y todas sus sendas son de paz. Tal gozo, tales deleites rebosantes, tal dicha desbordante, descubren los santos en su Señor, que lejos de servirle por costumbre, le seguirían aunque todo el mundo rechazara su nombre como malo.No tememos a Dios por obligación alguna; nuestra fe no es una atadura, nuestra profesión no es una prisión; no nos vemos obligados a la santidad ni forzados al deber. No, señores, nuestra religión es nuestro esparcimiento, nuestra esperanza nuestra felicidad, nuestro deber nuestro gozo.

Sé que siempre será una calumnia contra la religión de Cristo que cause desgracias a los hombres; pero jamás una mayor incomprensión, ni una mentira más vil, ha afligido al mundo. Porque no podemos jugar con tanta necedad, ni pecar con tanta audacia, ni jactarnos con tanta lujuria como los siervos del pecado, ¡por eso nos creéis miserables! Ah, señores, bien está escrito: «Nadie extraño se entromete en nuestra alegría». El secreto del Señor está con los que le temen, y nadie les quita su alegría. Recordémosles, sin embargo, que las aguas tranquilas son las más profundas. El arroyo que murmura sobre las piedras se seca en verano; pero el río caudaloso sigue su curso, haga calor o haya sequía, y aun así se desliza silenciosamente por los prados. No hablamos tan alto de nuestras alegrías como vosotros de las vuestras, porque no tenemos necesidad de hacerlo; las nuestras se conocen tanto en silencio como en compañía animada. No necesitamos vuestra compañía para alegrarnos, mucho menos los variados acompañamientos que sustentan vuestra dicha; no necesitamos ni cuenco, ni banquete, ni viola, ni danza, para alegrarnos: ni siquiera el buey estancado, ni el vino reventando para enriquecernos. Nuestra felicidad no reside en las criaturas pasajeras, sino en el Creador eterno e inmutable. Sé que, a pesar de todo lo que digamos, esta calumnia sobrevivirá de generación en generación: que el pueblo de Dios es un pueblo miserable. Pero, al menos, limpiemos nuestra conciencia de vosotros, y dejémosos sin excusa si volvéis a creerlo. Tenemos alegría; tenemos deleites, tales que no nos desprenderíamos de una gota de la nuestra por toneladas de la vuestra; ni gotas de nuestra alegría por ríos de vuestros deleites. Los nuestros no son oropeles ni alegrías pintadas, sino realidades sólidas; Las nuestras son alegrías que podemos llevar con nosotros a nuestra cama en el polvo silencioso; alegrías que dormirán con nosotros en la tumba y que despertarán con nosotros en la eternidad; alegrías que podemos recordar y así revivirlas en retrospectiva; alegrías que podemos anticipar y así conocer tanto aquí como en el más allá. Las nuestras no son burbujas que brillan solo para estallar; las nuestras no son manzanas de Sodoma que se convierten en cenizas en nuestra mano; ¡nuestros deleites son sustanciales, reales, verdaderos, sólidos, duraderos, eternos! ¿Qué más puedo decir? Desechen este error. El deleite y la verdadera religión están tan unidos como la raíz y la flor, tan indivisibles como la verdad y la certeza; son, de hecho, dos preciosas joyas engastadas una junto a la otra en el mismo engaste de oro.

Pero hay otra maravilla en nuestro texto para los hombres mundanos, aunque es una maravilla bien comprendida por los cristianos. El texto dice: «Él te concederá los deseos de tu corazón». «¿Por qué?», dice el hombre mundano, «yo pensaba que la religión era solo abnegación; nunca imaginé que al amar a Dios pudiéramos tener nuestros deseos; pensaba que la piedad consistía en matar, destruir y reprimir nuestros deseos». ¿Acaso la religión de la mayoría de los hombres no consiste en una abstinencia manifiesta de los pecados que secretamente aman? La piedad negativa es muy común en esta época. La mayoría supone que nuestra religión consiste en cosas que no debemos hacer, en lugar de placeres que podemos disfrutar. No debemos ir al teatro; no debemos cantar, comerciar los domingos, usar malas palabras, etc.; no debemos hacer esto, y no debemos hacer aquello. Y suponen que somos una raza de personas amargadas y miserables que, sin duda, compensan con alguna indulgencia privada el negarnos a nosotros mismos en público. Ahora bien, es cierto que la religión implica abnegación; igualmente cierto es que no la implica. Los cristianos tienen dos yoes: el yo viejo, en el que niegan la carne con sus afectos y deseos; pero hay un yo nuevo, un espíritu renacido, el hombre nuevo en Cristo Jesús; y, hermanos, nuestra religión no consiste en la abnegación de este. Al contrario, que se desate con toda su plenitud; pues todo lo que anhela, todo lo que desea, todo lo que ansía disfrutar, puede obtenerlo con total seguridad. Cuando oigo decir: «Bueno, ya sabes que mi religión consiste en algunas cosas que debo hacer y en algunas que no debo hacer», respondo: «La mía consiste en hacer lo que me gusta y en evitar lo que odio y que despreciaría». No siento ninguna atadura en mi religión, pues soy libre, y nadie es más libre que nadie. Quien teme a Dios y es completamente su siervo, no tiene ataduras. Puede vivir como desee, pues anhela vivir como debe. Puede ver cumplidos todos sus deseos, pues sus deseos son santos, celestiales y divinos. Puede alcanzar la plenitud de sus anhelos y deseos, y tener todo lo que anhela, pues Dios le ha hecho la promesa y le dará su cumplimiento.

Pero no se vayan con la idea de que siempre tenemos miedo de poner un pie delante del otro porque hay algo que no debemos hacer; y que no vamos a tal o cual lado porque no nos atrevemos. Oh, señores, no lo haríamos aunque pudiéramos; no lo haríamos aunque la ley cambiara, no tendríamos sus placeres aunque pudiéramos. Si pudiéramos ir al cielo y vivir como viven los pecadores, no elegiríamos su camino ni su conducta. Sería un infierno para nosotros ser obligados a pecar, incluso si el pecado quedara impune. Si pudiéramos tener su embriaguez, si pudiéramos tener sus lujurias —oh, ustedes, impíos— si pudiéramos tener su alegría y su gozo, no las tendríamos. No nos negamos a nosotros mismos cuando renunciamos a ellas. Despreciamos su alegría, la abominamos y la pisoteamos. «No puedo entender», dijo una vez un pájaro a un pez, «cómo es que siempre vives en el elemento frío; yo no podría vivir allí. Debe ser una gran abnegación para ti no volar a los árboles. Mira cómo puedo remontar el vuelo». «Ah», dijo el pez, «para mí no es ninguna abnegación vivir aquí, es mi elemento; jamás aspiro a volar, pues no me convendría. Si me sacaran de mi elemento, moriría a menos que me devolvieran a él muy pronto, y cuanto antes, mejor». Así, el creyente siente que Dios es su elemento natural. No se aleja de su Dios, ni de la voluntad y el servicio de su Maestro; y si por un tiempo se le sacara de él, cuanto antes pudiera regresar, mejor. Si se encuentra en mala compañía, es miserable y desdichado hasta que se libra de ella. ¿Acaso la paloma se priva de comer cuando no come carroña? No, en verdad la paloma no podría deleitarse con la sangre, no se alimentaría de ella aunque pudiera. Cuando un hombre ve una bandada de cerdos bajo la encina, deleitándose con sus bellotas y gruñendo de satisfacción, ¿acaso se priva de nada al pasar junto a ellos sin compartir su festín? No, en verdad, tiene mejor pan en casa del que puede comer, y la carne de cerdo no le resulta un manjar. Así sucede con el creyente; su religión es motivo de gozo, de satisfacción; y aquello que evita y rechaza representa muy poco sacrificio para él. Sus gustos cambian, sus deseos se transforman. Se deleita en su Dios y recibe con alegría el anhelo de su corazón.

Esto a modo de prefacio. Ahora pasemos al texto en sí. Hay dos cosas muy claras en el texto. La primera es un precepto escrito en joyas resplandecientes: «Deléitate en el Señor». La segunda es una promesa de valor incalculable, más valiosa que los rubíes: «Él te concederá los deseos de tu corazón».

I. El primero es UN PRECEPTO ESCRITO EN JOYAS RESPLANDECIENTES. He añadido esas últimas palabras porque la ley de los diez mandamientos estaba escrita en piedra, quizás en granito duro, en el que los hombres podían encontrar poco placer. Pero esta ley de un solo mandamiento, «Deléitate en el Señor», no es una ley de piedra escrita en tablas de granito, sino que contiene un precepto de brillo resplandeciente, digno de ser escrito en amatistas y perlas. «Deléitate en el Señor». Hermanos, cuando el deleite se convierte en un deber, entonces ciertamente el deber es un deleite. Cuando se convierte en mi deber ser feliz, cuando tengo un mandato expreso de estar alegre, entonces ciertamente debo ser un pecador si rechazo mis propias alegrías y me aparto de mi propia dicha. ¡Oh, qué Dios tenemos, que ha hecho de la felicidad nuestro deber! ¡Qué Dios tan misericordioso, que considera que ninguna obediencia es tan digna de su aceptación como la obediencia gozosa ofrecida por un corazón alegre! «Deléitate en el Señor».

1. Ahora bien, primero, ¿qué es este deleite? He estado pensando en la palabra «deleite», y no puedo explicarla. Sabes que es una palabra en sí misma. Una palabra deliciosa; no puedo usar otra cosa que ella misma para describirla. Si la miras, está destellando con luz, brilla como una estrella, no, como una brillante constelación, radiante con dulces influencias como las Pléyades. Es alegría, pero es más, es alegría desbordante; es descanso, pero un descanso que permite la máxima actividad de cada pasión del alma. ¡Deleite! Es regocijo sin su espuma. ¡Deleite! Es paz, pero es más que eso: es paz celebrada con festividad, con todas las guirnaldas colgando en las calles y toda la música sonando en el alma. ¡Deleite! ¿Con qué la compararé? Es una palabra errante que pertenece al lenguaje del Paraíso, y cuando las santas palabras del Edén volaron al cielo con la caída, esta, enredada en las sedosas redes de la primera promesa, se conservó en la tierra para cantar en los oídos de los creyentes. ¿Dónde encontraré metáforas para expresarla? El hombre me falla, permítanme recurrir a las criaturas inocentes de Dios. Vayan a la orilla del mar cuando la marea esté bajando, y en algunas partes de la costa verán una pequeña franja justo en el borde de la ola. Parece una niebla, pero si la observan con atención, encontrarán millones de camarones diminutos, saltando en toda clase de posturas y formas desde la ola que retrocede, con exuberancia de alegría y regocijo.

O mira en una tarde de verano a los mosquitos mientras danzan incansablemente, ¡apenas saben cómo disfrutar lo suficiente! O mira a los corderos en el campo, ¡cómo saltan y brincan! Escucha el canto matutino de los pájaros del cielo, y vuelve a oír sus deliciosas notas al atardecer; mira a los peces mientras saltan del arroyo, y oye a los insectos mientras zumban en el aire, estos pueden dar débiles destellos de la luz del deleite. Alza el vuelo al cielo si quieres saber lo que significa el deleite. ¡Mira a los espíritus allí, mientras sus dedos rozan las cuerdas doradas! Escucha sus voces, como con repiques de alegría desconocidos para los oídos humanos, cantan a aquel que los ha amado y los ha lavado de sus pecados con su sangre. Obsérvalos mientras guardan el sábado eterno en el gran templo del Dios viviente, y contemplan su trono, y contemplan, y contemplan, y vuelven a contemplar, absortos en la gloria, beatificados en Jesús, llenos del cielo, rebosantes de gozo inmenso. ¡Esto es deleite! Sé que mi descripción falla. Debes tomar la palabra y deletrearla letra por letra; y luego debes orar a Dios para que ponga tu corazón en un estado de ánimo dulce, compuesto por los siguientes ingredientes: un descanso perfecto de toda preocupación terrenal; una entrega total a las manos de Dios; una profunda confianza en su amor; un amor divino hacia él, de tal manera que sientas que serías o harías cualquier cosa por él; luego, a todo esto, se debe añadir un gozo en él; y cuando tengas todo esto, debe estar en ebullición, y entonces tendrás deleite en el Señor tu Dios. Matthew Henry dice: «El deseo es amor en acción, como un pájaro en vuelo; el deleite es amor en reposo, como un pájaro en su nido». Tal es el significado de la palabra, y tal es el deber prescrito. «Deléitate también en el Señor».

2. En segundo lugar, ¿de dónde proviene este gozo? El texto nos dice: «Deléitate en el Señor». Deléitate en Jehová, en su misma existencia. El hecho de que exista un Dios basta para hacer feliz al hombre más miserable si cree. Las naciones se derrumban, las dinastías caen, los reinos se tambalean, ¿qué importa?, porque hay un Dios. El padre ha ido a la tumba, la madre duerme en el polvo, la esposa nos ha abandonado, los hijos nos han sido arrebatados, pero hay un Dios. Esto, por sí solo, basta para ser una fuente inagotable de gozo para siempre para todos los verdaderos creyentes. Deléitate también en su dominio. «El Señor reina, regocíjese la tierra». ¡Jehová es Rey! Pase lo que pase, él se sienta en el trono y gobierna todas las cosas con justicia. El Señor ha preparado su trono en los cielos, y su reino gobierna sobre todo. De pie en el carro de la providencia, sostiene las riendas y guía a los veloces corceles según su voluntad. Dios es exaltado sobre las montañas y sobre las colinas; tiene dominio sobre todas las cosas, tanto sobre las magníficas como sobre las minúsculas. Alégrate, oh hija de Sión, porque el Señor es Rey por los siglos de los siglos, aleluya, aleluya. Cada atributo de Dios debería ser un rayo de luz en este sol de gozo. Que sea sabio debería alegrarnos a quienes conocemos nuestra necedad. Que sea poderoso debería hacernos regocijar a quienes temblamos ante nuestra propia debilidad. Que sea eterno debería ser siempre un tema para nuestra música, cuando sabemos que somos como la hierba y nos marchitamos como la hierba verde. Que sea inmutable debería darnos siempre un cántico, ya que cambiamos a cada hora y nunca somos los mismos por mucho tiempo. Que él está lleno de gracia, que rebosa de ella, y que esta gracia en el pacto que nos ha dado, que es nuestra, nuestra para limpiarnos, nuestra para guardarnos, nuestra para santificarnos, nuestra para perfeccionarnos, nuestra para llevarnos a la gloria, todo esto debería tender a hacernos deleitarnos en él. ¡Oh, creyentes! Hoy estáis junto a un río profundo; tal vez os hayáis adentrado en él hasta los tobillos y conozcáis algo de sus corrientes claras, dulces y celestiales, pero más adelante la profundidad es mayor y la corriente aún más deliciosa. ¡Venid, sumergíos en él! ¡Ahora, sumergíos en el mar más profundo de la Divinidad! Piérdete en su inmensidad; deja que sus atributos cubran toda tu debilidad y toda tu necedad, y todo lo demás que pueda hacerte gemir y desesperar. ¡Regocíjate en él, aunque no puedas regocijarte en ti mismo! Triunfa en el Dios de Israel, aunque en ti mismo tengas motivos suficientes para la desesperación.

El cristiano también siente que puede deleitarse en todo lo que Dios ha hecho en el pasado. Aquellos salmos que terminan con «su misericordia es eterna», donde encontramos divisiones como estas: «Og, rey de Basán, porque su misericordia es eterna». «Sehón, rey de los amorreos, porque su misericordia es eterna», todo esto nos muestra que el pueblo de Dios en tiempos antiguos solía reflexionar mucho sobre las acciones de Dios, de modo que no las reunían todas juntas en un solo versículo, sino que las dividían para tener un cántico sobre cada una. ¡Que el pueblo de Dios ensaye, pues, las obras del Señor! Que cuenten sus poderosos actos. Que canten: «Tu diestra, oh Señor, ha hecho pedazos a tu enemigo»; «El Señor es un guerrero, el Señor es su nombre»; «Cantad al Señor, porque ha triunfado gloriosamente». Que sigan repasando sus obras, hasta que alcancen las obras de gracia en sus propios corazones; y que canten con más dulzura que nunca. Que no dejen de cantar, pues cada día les llegan nuevas misericordias, que día tras día proclamen sus alabanzas, y noche tras noche den testimonio de su gracia. «Deléitate en el Señor».

Si lo que ya he mencionado no fuera suficiente, podríamos deleitarnos en todo lo que Dios ha de hacer: en todos los espléndidos triunfos que aún ha logrado; en todas las glorias de los últimos días; en todos los esplendores de su trono, cuando todas las huestes de Dios se reúnan al fin; en su triunfo sobre la muerte y el infierno, y en su victoria final sobre el pecado, cuando hará que toda la tierra se llene de su alabanza. ¡Oh, hermanos!, el tiempo nos fallaría, la eternidad podría fallarnos, de hecho, para catalogar todos los diferentes puntos de santo deleite que los creyentes, cuando están en un estado mental espiritual, pueden encontrar en el Señor su Dios. Deberíais deleitaros en Dios Padre, en su amor eterno hacia vosotros cuando no había nada en vosotros que amar; en su elección de vuestras almas, en su justificación de vosotros en Cristo, en la entrega de su Hijo unigénito para redimiros del infierno. Deberíais deleitaros en Jesús, deberíais

“¡Contad lo que su brazo ha hecho,
qué botín de la muerte ha obtenido;
cantad solo su nombre,
digno del Cordero!”

Debéis deleitaros en Dios el Espíritu Santo, en sus obras vivificantes, en sus iluminaciones, en sus consuelos, en la fuerza que os da, en la sabiduría que os imparte, en la fidelidad con que os atiende y en la certeza de que finalmente os perfeccionará, para que seáis dignos de participar de la herencia de los santos en la luz. Y aquí podríamos ramificarnos en mil temas. Deleitaos en Dios como vuestro padre, como vuestro amigo, como vuestro ayudador. Deleitaos en Jesucristo como vuestro hermano, como vuestro esposo, como vuestro pastor, como vuestro todo en todo. Deleitaos en Cristo en todos sus oficios, como profeta, sacerdote y rey. Triunfad en él, en todas sus vestiduras, porque todas huelen a mirra, áloe y casia. Deleitaos en Cristo, en su gloria y en su humillación, en su cruz y en su corona, en su pesebre y en su triunfo eterno, en el cual llevó cautiva la cautividad. Deléitense en el Espíritu Santo, en todas sus diversas maneras de influir en la mente de los hombres. Deléitense en Pentecostés y en los Pentecostés que aún están por venir. Y... pero con esto concluimos. ¿Qué más podríamos decir? Sin duda, podríamos hablar eternamente. Deléitense en Jehová, ese tema grandioso, ilimitado y gozoso, y deléitense en él para siempre.

3. Ahora surge otra pregunta. ¿Cuándo se debe practicar este deleite? «Deléitate en el Señor». Los preceptos sin límite de tiempo deben observarse perpetuamente. Mi texto no dice: «Deléitate en el Señor ocasionalmente, y de vez en cuando», sino en todo momento. Hay dos ocasiones en las que es difícil deleitarse en Dios, y por lo tanto las mencionaré. Es difícil deleitarse en Dios cuando todo nos va bien. «Oh», te ​​oigo decir, «no puedo entenderlo; ese es el momento en que más me deleito en Dios». Hermano, me temo que es el momento en que menos te deleitas en Dios. «Bueno, pero cuando tengo consuelo a mi alrededor, cuando la providencia me sonríe, entonces puedo deleitarme en Dios». ¡Alto! ¿Estás seguro de eso? ¿No es probable que a menudo te deleites en sus misericordias en lugar de en Él? ¿Te deleitas en la criatura en lugar del Creador? Me temo, hermanos, que son nuestros días soleados los momentos de mayor tentación. Bien podemos orar: “En todo tiempo de nuestra riqueza, líbranos”. Somos algo como una esposa insensata que, cuando su marido le da joyas y anillos, se vuelve más propensa a amar las joyas que a su marido. Muchos creyentes que hemos conocido que han tenido gracias y misericordias, y han tenido grandes privilegios, y han llegado a enorgullecerse más de las misericordias y los privilegios que de su Dios. Es difícil cuando el lagar está lleno amar a Dios más que a la viña; es difícil cuando hay una buena cosecha pensar más en Dios que en las gavillas; es difícil cuando uno se está enriqueciendo aún decir “este no es mi tesoro”. Los tesoros de la tierra mancharán nuestras vestiduras a menos que veamos bien a nuestros corazones: nuestra alma se aferra al polvo, y el polvo no es ayuda para la devoción Oh, ten cuidado, rico creyente, de que te deleites en Dios; no en tus parques y tus céspedes, tus jardines y tus casas, tus tierras y tus propiedades; Porque si te complaces en estas cosas, tu oro y tu plata se pudren, la polilla está en tu vestidura y la plaga pronto llegará a tu herencia. Di: «Esta no es mi porción». «Dios es mi porción, dice mi alma».

Otro momento en que resulta difícil deleitarse en Dios —aunque no tanto como en el primero— es cuando todo nos va mal. Entonces solemos decir, como el viejo Jacob: «Todo esto está en mi contra». ¡Qué noble oportunidad perdió Job cuando, siervo tras siervo, venían a decirle que todo estaba perdido, cuando se sentaba en el muladar y se raspaba con un trozo de cerámica! Si hubiera podido mantenerse erguido y decir: «Ahora me alegraré en el Señor y triunfaré en el Dios de mi salvación», ¡qué triunfo de fe habría logrado! Si hubiera podido comportarse así como un hombre de Dios, Job habría sido el personaje más espléndido que encontramos en las Sagradas Escrituras. Fue muy lejos cuando dijo: «Aunque me mate, en él confiaré». Habló un hombre a quien Dios había hecho poderoso. Pero si hubiera podido deleitarse aún más en Dios cuando tenía llagas y le reventaban las ampollas, eso habría sido casi sobrehumano. Creo que podría decir que habría sido tanto como la gracia misma podría obrar en el hombre. Sin embargo, ¡cuántas veces he notado que los creyentes se regocijan en Dios mucho más fácilmente en sus aflicciones que en sus prosperidades! He visto el hisopo crecer en el Líbano, y he visto el cedro crecer en el muro. He visto grandes santos donde había poca misericordia; y he visto santos divagadores donde había grandes bendiciones providenciales. Los pájaros de Dios cantan mejor en jaulas, y la alabanza a Dios brota mejor de la boca del horno de la aflicción que incluso de la cima de la montaña de la comunión. Estamos constituidos de tal manera, me parece, que a menos que Dios sacuda las cuerdas de nuestro corazón con el dolor y la aflicción, nunca le ofrecemos mucha dulce música. Sin embargo, ¿es difícil, muy difícil, para un hombre, cuando todo apoyo terrenal se derrumba, decir que la higuera no florece, que los terneros mueren en el establo, que la cosecha se ha enmohecido, que la oruga devora toda la producción? Pero aún así, mi deleite está en Dios, y mi triunfo está en el Dios de mi salvación. Sin embargo, por gracia, en todo momento debemos deleitarnos en Dios.

Pero oigo una voz que dice: "¿Pero cuándo debe el cristiano ser miserable?" ¡Nunca, hermano, nunca! "¿Pero no a veces?" No; no si cumple con su deber. "¿Pero no debería un santo ser abatido a veces?" Los santos son abatidos, pero no deberían serlo. "Bueno, pero muchos de los santos de Dios están llenos de dudas y temores." Lo sé, y más lástima. "Pero algunos hijos del Señor se pasan la vida lamentándose." Es culpa suya, su Señor no les ha ordenado hacerlo. Las Escrituras nos enseñan: "Alegraos siempre en el Señor, y de nuevo", dice el Apóstol, "os digo, alegraos." "¿Pero no hay momentos en que podemos ceder a la melancolía y cultivar la tristeza?" Bueno, si lo haces, pronto verás que crece. Dios a menudo sirve a sus hijos como he visto a padres servir a los suyos; si sus hijos oran por aflicciones, las tendrán hasta que empiecen a orar diez veces más fervientemente para que se las quiten. Si el pueblo de Dios clama por nada, pronto tendrá por qué clamar. Si se hacen desgraciados, pronto se les sumarán desgracias a las que ya tienen. Pero en lo que respecta a la promesa y al precepto, es deber y tarea diaria, constante y a cada hora del verdadero creyente deleitarse en el Señor su Dios.

4. Pero antes de terminar, responderé a otra pregunta. ¿Por qué es tan raro este gozo en Dios? ¿Por qué se ven tantos cristianos abatidos? ¿Tantos cristianos que dudan? ¿Por qué se ven tantos cuya religión les parece un yugo, un yugo muy pesado? Me temo que es porque hay muy poca religión genuina, por un lado, y muy poca religión profunda, por otro, donde lo poco que hay sea auténtico. Pues bien, no me extraña que el hombre que tiene una religión que no le nace del corazón sea desdichado. A veces se ve a un hombre con un perro de una raza a la que no le gusta el agua, y lo echa dentro; ¡qué rápido sale! Pero hay otros, de otra raza, que nadan durante horas y disfrutan haciéndolo. Así pues, hay algunos profesores que son conocidos por ser hipócritas porque su religión va en contra de su voluntad. Los has metido en ella, y pronto la abandonan. Pero el verdadero cristiano abraza su religión por gracia con fervor y alegría. La ama, se deleita en ella. Esta es una de las mejores pruebas para discernir entre un hipócrita y un verdadero cristiano. Job dice del hipócrita: "¿Se deleitará en Dios?". No; el hipócrita pondrá cara de tristeza; el hipócrita se verá miserable; el hipócrita se hará tan miserable como cualquiera pueda serlo cuando llegue el momento; pero nunca se ha deleitado, ni puede ni podrá deleitarse en Dios por regla general. Puede que tenga cierta alegría en los medios externos, pues incluso Herodes escuchó a Juan con agrado. Pero eso es solo un espasmo. Solo el verdadero creyente puede tener una satisfacción y un deleite constantes y duraderos en el servicio y el amor a Dios. Esta es una evidencia tan segura e infalible que, si alguno de ustedes se deleita en Dios, concluyo, sin dudarlo, que es un alma salva. Pero si alguno de ustedes, por otro lado, nunca se deleita en Dios de ninguna manera, dudo que alguna vez haya conocido a Dios, pues si lo ha conocido, en cierta medida habrá encontrado deleite en él. «¿Pero de qué sirve este deleite?», dice uno. «¿Por qué los cristianos han de ser tan felices?». Pues bien, es bueno en todos los sentidos. Es bueno para nuestro Dios; le da honor entre los hijos de los hombres cuando nos alegramos. Es bueno para nosotros; nos fortalece. «El gozo del Señor es vuestra fortaleza». Es bueno para los impíos; pues cuando ven a los cristianos alegres, anhelan ser creyentes. Es bueno para nuestros hermanos en la fe; los consuela y los anima. En cambio, si nos mostramos sombríos, propagaremos la tristeza, y otros también serán desdichados y sombríos. Por todas estas razones, y por muchas más que se pueden mencionar, es bueno y agradable que un creyente se deleite en Dios.
