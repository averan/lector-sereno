Digan lo que digan los demás, para nosotros basta saber que esta es la espada reglamentaria. Al soldado no se le permite escoger su propio equipo: debe llevar las armas que su soberano disponga. Esta es la espada reglamentaria en el ejército de Cristo. La espada del Espíritu, que es la Palabra de Dios, es la que se os ordena tomar; y, si obstinadamente decidís cambiarla por otra, cometéis un acto de rebelión y hacéis el cambio por vuestra cuenta y riesgo. Venid, pues: tomemos cada uno la Palabra de Dios y llevémosla más cerca del corazón que nunca, porque esta es la orden: «Tomad la espada del Espíritu, que es la Palabra de Dios».

Ahora, ved qué se nos manda hacer. Necesitamos una espada; necesitamos esta espada; debemos tomar esta espada. Observad que no se nos dice que podamos dejarla: el mandato de tomar la espada es continuo, y no hay indicio alguno de que quede suspendido. Hay, por supuesto, un momento en que el soldado de Su Majestad puede quitarse la espada del costado y despojarse del uniforme, pero para el cristiano nunca existe ese momento. Por lo que hemos visto últimamente, uno habría podido pensar que del cuartel general había llegado la orden de que los soldados dejaran la espada del Espíritu, la Palabra de Dios, y adoptaran armas más ligeras. ¡Ahora se utilizan entretenimientos, diversiones, farsas y canturreos para hacer lo que el evangelio no ha logrado! ¿No es tristemente así? Pues bien, si algunos quieren probar estos juguetes necios, solo puedo decir que no tienen ningún mandato de su Señor que autorice su proceder. Tomad todas esas cosas y ved qué pueden hacer; pero la prueba la hacéis por vuestra cuenta y riesgo, y sobre vuestras propias cabezas caerán las consecuencias del fracaso.

Las órdenes permanentes son tomar la espada del Espíritu, y el gran Capitán de la salvación jamás ha emitido un nuevo reglamento. Desde los días de Pablo hasta ahora, permanece el mandato: «Tomad la espada del Espíritu». Todas las demás cosas fracasarán con certeza; de ahí que el único mandamiento que permanece sea: «Tomad la espada del Espíritu». No se nos dice que colguemos esta espada para exhibirla. Algunas personas tienen una Biblia magníficamente encuadernada sobre la mesa de su mejor habitación, y es un hermoso adorno. Una Biblia familiar es un tesoro. Pero os ruego que no permitáis que vuestro amor por la Biblia termine ahí. Para un soldado en guerra, la espada no está destinada a quedar colgada en la tienda ni siquiera a ser agitada en el aire: se le entrega para usarla. Tampoco debemos meter esta espada en una vaina, como hacen muchos que toman la Biblia y le añaden tanta crítica o tantas opiniones propias que ya no se siente su filo. Muchos utilizan su pobre concepto de la inspiración como una vaina en la que hunden la Biblia. Su vasto conocimiento constituye una hermosa vaina, y hacen entrar la espada diciendo: «¡Quédate quieta ahí! ¡Oh espada del Señor, descansa y permanece en silencio!». Después de que hemos predicado con toda el alma y los hombres han sentido su poder, hacen un esfuerzo desesperado por aprisionar la Palabra en su teoría incrédula o en su mundanalidad. Toda la semana mantienen la Palabra sujeta con mano firme, por temor a que su filo o su punta los hiera. Es la vaina de la cultura, de la filosofía o del progreso; en ella encierran la Palabra viva de Dios como en un ataúd.

No debemos sepultar la Palabra bajo otros asuntos, sino tomarla como una espada. Según lo entiendo, esto significa, en primer lugar, creerla. Creed cada parte de ella; creedla con una fe verdadera y real, no con una mera fe de credo que diga: «Esto es lo ortodoxo». Creedla como una realidad para cada día, que afecta vuestra vida. Creedla. Y cuando la hayáis creído, estudiadla. ¡Oh, si hubiera un estudio más atento de la Palabra de Dios! ¿No hay entre vosotros algunos que ni siquiera han oído o leído todo lo que el Señor ha dicho? ¿No hay pasajes de la Biblia que nunca habéis leído? Es un hecho lamentable que exista siquiera una línea de las Sagradas Escrituras sobre la cual vuestros ojos no se hayan posado ni una sola vez. Leed de verdad la Biblia entera, desde el principio hasta el fin. Comenzad mañana; no, comenzad hoy, y recorred de manera constante la totalidad de los libros sagrados, con oración y meditación. No consintáis en pensar que Dios ha dejado registradas verdades en su Palabra que vosotros no habéis leído ni una sola vez. Estudiad la Palabra y desentrañad su significado. Penetrad hondamente en el espíritu de la inspiración. Quien más profundo cava en esta mina es quien más oro obtiene. Se decía de ciertas minas de Cornualles que, cuanto más se descendía, más rico era el mineral. Así sucede, sin duda, con las minas de la Escritura inspirada. Cuanto más profundicéis bajo la dirección del Espíritu, mayor será la recompensa de vuestro trabajo. Tomad la espada con la firmeza de una fe sincera; sujetadla con un conocimiento más pleno y, después, ejercitaos diariamente en su uso. La espada ha de tomarse para combatir en serio. En un mundo como este, no pasará mucho tiempo antes de que se presente la ocasión. Tendréis que desviar golpes con ella, atravesar con ella, cortar con ella y matar con ella. «¿Por dónde empezaré?», pregunta alguno. Empieza en casa, y durante muchos días tendrás las manos ocupadas. Cuando hayas dado muerte a todos los rebeldes de dentro, y mucho antes de eso, podrás ocuparte también de los que te rodean en el mundo y en la iglesia profesante. Dentro de tu propio corazón encontrarás una banda de bandidos que debe ser exterminada. Siempre será necesario mantener la espada en acción dentro de tu propio territorio. Termina esta guerra civil antes de ir a tierras extranjeras. Cuando la guerra dentro de la ciudad del Alma Humana se haya llevado a término victoriosamente, sitia el corazón de tu amigo, de tu hijo, de tu vecino. ¡Mirad, el mundo yace bajo el maligno! Abundan los errores, y todavía se alzan sistemas colosales de falsedad. Los hombres siguen siendo arrastrados a la ruina por el gran engañador. Sin duda, sentimos que nuestras espadas saltan de sus vainas cuando pensamos en los millones que están siendo arruinados por el pecado y el error. ¡Oh, si se lanzara un poderoso ataque contra las potestades de las tinieblas!

Una vez más: debemos tomar esta espada con un propósito. Hemos de usarla para poder mantenernos firmes y resistir. Si quieres permanecer firme, desenvaina la espada y golpea tus dudas. ¡Con qué ferocidad ataca la incredulidad! Aquí viene una duda acerca de tu elección. Atraviésala con la Palabra. Pronto llega una duda acerca de la preciosa sangre. Pártela de la cabeza a los pies con la certeza que da la Palabra de que la sangre de Jesús nos limpia de todo pecado. Aquí viene otra duda, y luego otra más. Tan deprisa como pueda moverse el brazo, atraviesa con textos de la Escritura cada nueva falacia y cada nueva negación de la verdad, y ensártalas a todas en el estoque de la Palabra. Te hará bien dar muerte definitiva a estas dudas. No juegues con ellas: combátelas con toda seriedad. Descubrirás que también las tentaciones llegan en tropel. Enfréntalas con los preceptos de la Sagrada Escritura y, mediante la aplicación que el Espíritu hace de la Santa Palabra, mata incluso el deseo del mal. El lavamiento del agua por la Palabra es un glorioso medio de limpieza. Los desalientos se levantarán como las nieblas de la mañana. ¡Que la Palabra de Dios los disipe con los rayos de sus promesas! Tus aflicciones se multiplican, y jamás podrás vencer la impaciencia y la desconfianza sino mediante la Palabra infalible de Dios. Puedes soportar la prueba, y soportarla con paciencia, si utilizas esta arma para matar la ansiedad. Permanecerás «firme en el día malo» y, después de haberlo hecho todo, seguirás en pie, si esta espada está en tu mano.

No solo debéis manteneros firmes vosotros mismos: también debéis ganar almas para Cristo. No intentéis vencer el pecado en otros ni conquistar un corazón para Jesús sino con la espada del Espíritu. ¡Cómo se ríe el diablo cuando intentamos hacer conversos prescindiendo de la Sagrada Escritura y del Espíritu Santo! Se ríe, digo, porque se burla de nuestra necedad. ¿Qué podéis hacer vosotros, niños que jugáis con vuestras espaditas de madera? ¿Qué podéis hacer contra hombres cubiertos de la cabeza a los pies con la armadura de acero del hábito del pecado? Maestros de escuela dominical, enseñad a vuestros niños, cada vez más, la pura Palabra de Dios. Y vosotros, predicadores, no intentéis ser originales: contentaos con tomar de las cosas de Cristo y mostrárselas al pueblo, porque eso es lo que hace el propio Espíritu Santo, y seréis sabios si utilizáis su método y su espada. Ningún pecador a vuestro alrededor será salvo sino por el conocimiento de las grandes verdades contenidas en la Palabra de Dios. Ningún hombre será llevado jamás al arrepentimiento, a la fe y a la vida en Cristo aparte de la aplicación constante de la verdad por medio del Espíritu. Oigo grandes gritos y mucho ruido por todas partes acerca de grandes cosas que se van a hacer: veámoslas. Según dicen, el mundo entero será acogido dentro de la iglesia. Me temo que el mundo no mejorará mucho por quedar incluido en una iglesia así. Los grandes fanfarrones deberían prestar atención a la palabra del sabio: «No se jacte tanto el que se ciñe la armadura como el que se la quita». Si el campeón sale con cualquier otra espada que no sea la Palabra de Dios, mejor será que no se jacte en absoluto, porque volverá con la espada rota, el escudo abandonado y él mismo manchado de deshonra. La derrota espera al hombre que abandona la Palabra del Señor.

Terminaré después de pediros que recordéis que el texto está en tiempo presente: tomad la espada del Espíritu ahora mismo. ¡Qué variedad de personas hay aquí esta mañana! Han venido creyentes expuestos a toda clase de peligros: que cada uno tome la espada del Espíritu, y vencerán a todos sus enemigos. Aquí también hay personas que buscan, que desean ser cristianas, pero no logran serlo. ¿Cuál es el problema esta mañana? «Oh», dice uno, «he adquirido el hábito de pecar, y ese hábito tiene mucha fuerza sobre mí». Combate los hábitos pecaminosos con la Palabra de Dios como espada del Espíritu: solo así vencerás a tu propio yo malvado. Busca un texto de la Escritura que parta tu pecado hasta la columna vertebral o lo atraviese en el corazón. «¡Ay! Satanás me tienta horriblemente», clama otro. «Últimamente he sido atacado de muchas maneras». ¿Es así? No eres el primero. Nuestro divino Señor fue tentado por el diablo en el desierto. Podría haber combatido a Satanás con mil armas, pero escogió derrotarlo únicamente con esta. Dijo: «Escrito está; escrito está; escrito está». Hirió tan dolorosamente al enemigo con esta punta afilada que el gran adversario pensó en probar la misma espada, y también comenzó a decir: «Escrito está». Pero se cortó a sí mismo con esta espada, porque no citó correctamente los pasajes ni los dio completos, y el Maestro pronto encontró la manera de desviar su espada y herirlo todavía más. Seguid el ejemplo de vuestro Señor. «Oh, pero», dice alguien, «estoy tan decaído de ánimo». Muy bien: combate el abatimiento con la Palabra de Dios. «El médico me recomendó», dice uno, «tomar un poco de licor para levantar el ánimo». Siempre se les está atribuyendo este pecado a los médicos. No estoy tan seguro de que no se los calumnie con frecuencia. Te gusta la dosis, y por eso la tomas. Prueba la Palabra de Dios para el abatimiento, y habrás encontrado un remedio seguro. Descubro que, si puedo poner una promesa debajo de mi lengua, como una pastilla dulce, y conservarla en mi boca o en mi mente durante todo el día, soy suficientemente feliz. Si no logro encontrar un pasaje de la Escritura que me consuele, entonces mis aflicciones interiores se multiplican. Combate el desaliento y la desesperación con la espada del Espíritu. No puedo saber cuál es tu dificultad particular en este momento, pero te doy esta instrucción para toda guerra santa: «Toma la espada del Espíritu, que es la Palabra de Dios». Debes vencer a todo enemigo, y esta arma es todo lo que necesitas. Si tú, que me escuchas, quieres vencer el pecado y conquistar la incredulidad, toma una palabra como esta: «Mirad a mí y sed salvos, todos los confines de la tierra». Mientras mires, serás salvo, la duda morirá y el pecado será ejecutado. ¡Que Dios te conceda la ayuda de su Espíritu, por amor de Cristo! Amén.

“Sobre todo, tomen el escudo de la fe, con el cual podrán apagar todos los dardos de fuego del maligno.” — Efesios 6:16

Como los espartanos, todo cristiano nace guerrero. Su destino es ser atacado; su deber es atacar. Parte de su vida estará dedicada a la defensa. Tendrá que defender con ahínco la fe entregada a los santos; tendrá que resistir al diablo; tendrá que oponerse a todas sus artimañas; y, después de todo, mantenerse firme. Sin embargo, será un cristiano mediocre si solo actúa a la defensiva. Debe ser alguien que se enfrente a sus enemigos, así como que se mantenga firme para recibir su ataque. Debe poder decir con David: «Vengo contra ti en el nombre del Señor de los ejércitos, el Dios de los ejércitos de Israel, a quien has desafiado». Debe luchar no contra carne y sangre, sino contra principados y potestades. Debe tener armas para su lucha, no carnales, sino «poderosas en Dios para la destrucción de fortalezas». No debe, digo, contentarse con vivir en la fortaleza, aunque esté bien protegido y su morada cuente con municiones de tremenda potencia; sino que debe salir a atacar los castillos del enemigo y derribarlos, a expulsar a los cananeos de la tierra. Ahora bien, hay muchas maneras en que el cristiano puede olvidar en gran medida su carácter de mariscal. ¡Y ay! No son pocos los que, si son cristianos, ciertamente saben muy poco de esa guerra diaria a la que el Capitán de nuestra salvación llama a sus discípulos. Quienes más se apegan al rey David sabrán más de luchar; quienes están dispuestos no solo a estar con él cuando está en la corte de Saúl con sus dedos entre las cuerdas del arpa, entrando y saliendo ante el pueblo y comportándose discretamente, de modo que “todo Israel y Judá amaban a David porque salía y entraba ante ellos, sino hombres que están dispuestos a ir con David a la cueva de Adulam cuando es proscrito, cuando su carácter se ha convertido en un hedor en las narices de todo hipócrita orgulloso, y cuando Saúl el rey —en su día el representante de esa religión mundana que no es de Dios, sino que se sostiene en la fuerza del hombre— cuando persigue a David para buscar su vida. Así, los hombres que están dispuestos a seguir a Cristo en medio de una generación impía y perversa, a salir de ella y ser apartados; su vida tendrá que ser como la vida de los hombres de Neftalí, que arriesgaron sus vidas hasta la muerte en los lugares altos del campo. Recordarás que Jonatán, uno de los personajes más dulces de la Palabra de Dios, es uno de los que Después de todo, poco hay que decir. Su vida fue ignominiosa desde el momento en que abandonó a David, y su muerte se contó entre los muertos de los filisteos en las montañas sin rocío de Gilboa. ¡Ay, pobre Jonatán! Podía darle a David su arco, pero no podía tensarlo por él; podía darle a David sus vestiduras, incluso su armadura, pero no podía ponérsela. La atracción de la corte de su padre era demasiado fuerte para él, y allí se quedó. En ese Libro de las Crónicas,Donde el Espíritu Santo registró los nombres de los valientes que acompañaron a David en Adulam, no encontramos el nombre de Jonatán. Encontramos los nombres de quienes abrieron paso entre los filisteos para darle a David de beber del agua del pozo de Belén; encontramos el nombre del hombre que descendió al abismo en invierno y venció al león; pero Jonatán no tiene el honor de figurar en la lista del gran ejército, semejante al ejército de Dios. Y hoy en día existen cristianos de esa clase. Tienen una religión débil, una religión que rehúye la oposición, una religión frágil que se doblega ante cualquier adversidad, a diferencia del cedro de la piedad que se yergue en medio de la tormenta y agita sus ramas en el huracán con júbilo y triunfo, aunque la tierra esté en pie de guerra. Tales hombres, como los que rechazaron a David en Adulam, carecen de la fe que comparte la gloria. Aunque salvados, sus nombres no figurarán entre los valientes que, por amor a nuestro Gran Comandante, están dispuestos a perderlo todo y a marcharse sin que el campamento lleve su oprobio. Aquellos cristianos que, habiendo salido del mundo, se dedican diligentemente a edificar la Iglesia, tendrán que luchar más que aquellos que se dedican a edificar en lugar de construir. Recordad, en tiempos de Nehemías, cómo trabajaban los judíos en la construcción de las murallas de Jerusalén. Con una mano sostenían la paleta y con la otra un arma. «Los constructores, cada uno con su espada ceñida al costado, construían así». Además, había maestros albañiles a lo largo de la muralla, y los obreros estaban todos trabajando activamente; sin embargo, aquí y allá se podía ver a un centinela listo para tocar la trompeta para que los obreros demostraran su valentía, se lanzaran a la batalla y ahuyentaran a sus enemigos. Sed muy diligentes en hacer el bien a la Iglesia de Cristo, y pronto tendréis motivos para defender vuestra causa. Si sirves a tu Maestro con celo y diligencia, y dejas que la bendición del Señor repose sobre tus labores, la bendición del Señor conllevará la maldición de Satanás, y la sonrisa de Dios necesariamente provocará el ceño fruncido de los hombres. Según tu inconformismo con el mundo, tu audacia para ser singular —cuando ser singular es tener razón—, según tu diligencia en la construcción de las murallas de Jerusalén, te verás obligado a reconocer tu carácter de soldado. Para ti, el texto tendrá mayor énfasis que para las almas más cobardes. «Sobre todo, tomad el escudo de la fe, con el cual podréis apagar todos los dardos de fuego del maligno».Encontramos los nombres de aquellos que rompieron las defensas de los filisteos para darle a David de beber del agua del pozo de Belén; encontramos el nombre del hombre que descendió al abismo en invierno y venció al león; pero Jonatán no tiene el honor de figurar en la lista del gran ejército, semejante al ejército de Dios. Y hoy en día existen cristianos de esa clase. Tales hombres, como aquellos que rechazaron a David en Adulam, carecen de la fe que comparte la gloria. Aunque salvados, sus nombres no figurarán entre los de los valientes que, por amor a nues Habiendo analizado el carácter de quienes más necesitarán el escudo que se ofrece en el texto, procedamos de inmediato a examinar las palabras que tenemos ante nosotros. Lo haremos así: primero, expliquemos la comparación; segundo, reforcemos la exhortación; y tercero, presentémosla como una palabra de consuelo para los pecadores temblorosos que ahora son atacados especialmente por los dardos de fuego de los malvados.

I. Primero, pues, EXPLIQUEMOS LA METÁFORA. Aquí la fe se compara con un escudo. Hay cuatro o cinco aspectos en los que podemos comparar la fe con un escudo. La idea natural que subyace a la superficie misma de la comparación es que la fe, como un escudo, nos protege de los ataques. Los antiguos usaban diferentes tipos de escudos, pero en nuestro texto se hace referencia especial al gran escudo que a veces se empleaba. Creo que la palabra que se traduce como «escudo» a veces significa puerta, porque sus escudos eran tan grandes como una puerta. Cubrían al hombre por completo. Recordarán ese versículo de los Salmos que expresa exactamente la idea: «Tú, Señor, bendecirás al justo; con tu favor lo rodearás como con un escudo». Así como el escudo envolvía al hombre por completo, así también pensamos que la fe lo envuelve por completo y lo protege de todos los proyectiles, dondequiera que vayan dirigidos contra él. Recordarán el grito de la madre espartana a su hijo cuando salió a la batalla. Ella dijo: «Ten cuidado de regresar con tu escudo, o sobre él». Ahora bien, como ella quería decir que podía regresar muerto sobre su escudo, esto demuestra que a menudo usaban escudos lo suficientemente grandes como para servir de féretro, y por consiguiente, lo suficientemente grandes como para cubrir el cuerpo de un hombre vivo. A ese escudo se refiere el texto. Esa es la ilustración que tenemos ante nosotros. La fe protege al hombre en su totalidad. Que el ataque de Satanás sea contra la cabeza, que intente engañarnos con ideas teológicas inestables, que nos tiente a dudar de aquello que verdaderamente hemos recibido; una fe plena en Cristo nos preserva contra herejías peligrosas y nos permite aferrarnos a aquello que hemos recibido, que nos ha sido enseñado, que hemos aprendido y que hemos hecho nuestro por experiencia. La inestabilidad de ideas generalmente surge de una debilidad de fe. Un hombre que tiene una fe fuerte en Cristo, tiene una mano que se aferra de tal manera a las doctrinas de la gracia que no podrías soltarla, hagas lo que hagas. Él sabe lo que ha creído. Entiende lo que ha recibido. No podría ni querría renunciar a lo que sabe que es la verdad de Dios, aunque todos los planes que los hombres idean lo ataquen con su arte más traicionero. Mientras la fe protegerá la cabeza, también protegerá el corazón. Cuando llega la tentación de amar al mundo, entonces la fe sostiene pensamientos del futuro y confianza en la recompensa que espera al pueblo de Dios, y capacita al cristiano para estimar el oprobio de Cristo como mayores riquezas que todos los tesoros de Egipto, y así el corazón está protegido. Entonces, cuando el enemigo hace su corte en el brazo de la espada de un cristiano, para incapacitarlo, si es posible, del servicio futuro, la fe protege el brazo como un escudo, y es capaz de hacer hazañas para su Maestro, y salir, aún venciendo, y para vencer, en el nombre de aquel que nos ha amado. Supongamos que la flecha apunta a sus pies,Y el enemigo intenta hacerlo tropezar en su vida diaria, procurando desviarlo de la rectitud en su caminar y conversación. La fe protege sus pies, y se mantiene firme en lugares resbaladizos. Ni su pie resbala, ni el enemigo puede triunfar sobre él. O supongamos que la flecha apunta a la rodilla, y Satanás busca debilitarlo en la oración, diciéndole que Dios rechazará su clamor y jamás escuchará la voz de su súplica; entonces la fe lo protege, y en el poder de la fe, con confianza, tiene acceso a Dios y se acerca a su trono de misericordia. O supongamos que la flecha apunta a su conciencia, y que está alada por el recuerdo de algún pecado reciente; aun así, la fe protege la conciencia, pues su plena seguridad de expiación apaga los dardos de fuego con ese texto maravilloso: «La sangre de Jesucristo su Hijo nos limpia de todo pecado». Así, no hay parte del hombre que no esté segura. Aunque Satanás sin duda lo atacará desde todas las direcciones, que venga adonde quiera.

“El que ha hecho de Dios su refugio,
hallará morada segura.”

La fe no solo protege al hombre en su totalidad, sino que, si reflexionas un momento, verás que el apóstol sugiere que también protege su armadura. Tras enumerar varias piezas, dice: «Sobre todo». El hombre de Dios debe vestirse con el cinturón y la coraza, calzarse y usar el casco. Pero aunque todo esto constituye una armadura, la fe es una armadura para su armadura; no solo es una defensa para él, sino también para sus defensas. Así, la fe no solo protege al hombre, sino también sus virtudes. Puedes comprender fácilmente cómo funciona esto. Satanás a veces ataca nuestra sinceridad; intenta cortar el cinturón de la verdad que nos rodea. Pero la fe nos capacita para ser completamente sinceros, como Moisés, que abandonó Egipto sin temer la ira del rey y se negó a ser llamado hijo de la hija del faraón. Entonces, el enemigo a menudo atacará nuestra rectitud e intentará dañar nuestra coraza. Sin embargo, la fe entra y nos capacita, como a José, para exclamar: «¿Cómo puedo cometer esta gran maldad y pecar contra Dios?». O como Job, clamamos: «Hasta que muera, no renunciaré a mi integridad». O como David, podemos clamar, incluso en medio de las peores calumnias: «Tú, Señor, que me libraste de las fauces del león y de las garras del oso, me librarás también de la mano de este filisteo». Como ves, la fe protege la coraza y resguarda el cinturón. Todas nuestras virtudes son incapaces de subsistir por sí mismas; necesitan la gracia para conservarlas, y esa gracia se nos concede mediante la fe. ¿Eres manso? ​​Cubre tu mansedumbre con fe, o de lo contrario cederás a la impulsividad. ¿Estás lleno de decisiones? Deja que tu decisión esté protegida por la confianza en Dios, o de lo contrario tu decisión vacilará y tu firmeza flaqueará. ¿Tienes espíritu de amor y mansedumbre? Asegúrate de tener el escudo de la fe, o tu mansedumbre se convertirá en ira y tu amor en amargura. Debemos proteger con fe nuestras virtudes, así como la naturaleza que adornan. No se trata solo de la cabeza, sino del casco; no solo de los pies, sino de los zapatos; no de la cintura, sino del cinturón; todo debe estar protegido y a salvo por este escudo de la fe que todo lo cubre, todo lo protege y todo lo triunfa.

En segundo lugar, permítanme sugerir que la fe, como un escudo, recibe los golpes que están destinados al hombre mismo. Algunos cristianos piensan que la fe les permitiría escapar de los golpes, que si tuvieran fe todo estaría tranquilo, todo sería paz y calma. Sé cómo se lo imaginan los jóvenes cristianos. Piensan que tan pronto como superen sus primeras convicciones de su propia pecaminosidad y encuentren al Salvador, ¡oh!, ahora cabalgarán suavemente hacia el cielo, cantando todo el camino. ¿Para qué se pusieron la armadura si no habría batallas? ¿Para qué pusieron la mano en el arado si no van a arar hasta el final del surco y a secarse el sudor de la cara con frecuencia por su duro trabajo? ¿Para qué alistarse, jóvenes, si no se les necesita para luchar? ¿De qué sirve un soldado de época, uno que se queda en casa para alimentarse a expensas del erario público? ¡No! Que el soldado esté preparado cuando llegue la guerra; que espere el conflicto como parte y consecuencia necesaria de su profesión. Pero estad armados de fe, ella recibe los golpes. El pobre escudo es golpeado, aporreado y maltratado como un ático expuesto en medio de una tormenta; golpe tras golpe resuena sobre él, y aunque aparta a la muerte, el escudo se ve obligado a soportar el corte y la estocada. Así debe ser nuestra fe: debe ser herida, debe soportar los golpes. Algunos, en lugar de usar el escudo de la fe para soportar el golpe, se esconden como cobardes. Avergonzados de Cristo, no profesan su fe, o habiéndola profesado, avergonzados de la profesión, se ocultan abandonando sus colores, conformándose al mundo. Quizás incluso estén llamados a predicar el evangelio, pero lo hacen de una manera tan silenciosa y suave, como hombres que visten ropas delicadas y deberían estar en casas de reyes. A diferencia de Juan el Bautista, son «cañas mecidas por el viento». De ellos nadie dice nada malo, porque no han hecho daño al reino de Satanás. Contra ellos Satanás jamás ruge; ¿por qué habría de hacerlo? No les teme; por lo tanto, no necesita enfrentarse a ellos. «Déjenlos en paz», dice, «miles como estos jamás sacudirán mi reino». Pero esto no es usar el escudo de la fe; esto, lo repito, es usar los escondites de una cobardía vil. Otros usan el escudo de la presunción; creen que tienen razón cuando no la tienen, pero así se protegen, no de los ataques de Satanás, sino de las armas de nuestra guerra espiritual. Marcados en su conciencia como con un hierro candente, no temen las reprensiones de la ley de Dios. Insensibles incluso a la voz del amor, no se inclinan ante las invitaciones de Cristo; siguen su camino sin preocuparse por nada de eso; la presunción los ha hecho sentir seguros. Tales personas no tienen golpes que sufrir. Su escudo les permite transitar por el mundo tranquilamente, diciendo: «Paz, paz, donde no hay paz». Pero solo alzad el escudo de la fe, que lleva el escudo rojo sangre de la cruz,Y hay muchos caballeros del infierno listos para derribarte. ¡Adelante, campeón, adelante! En el nombre de aquel que está contigo. Ninguna lanza puede atravesar ese escudo; ninguna espada jamás podrá cortarlo; te protegerá en toda batalla y en toda contienda; tú mismo lo traerás a casa, gracias a él serás más que vencedor. La fe, entonces, es como un escudo, porque tiene que soportar los golpes.

En tercer lugar, la fe es como un escudo, pues necesita ser fuerte. Un hombre con un escudo de cartón puede alzarlo contra su enemigo, pero la espada lo atravesará y alcanzará su corazón. O tal vez, en el momento en que la lanza está en reposo y su enemigo se abalanza sobre él, piensa que su escudo lo protegerá, pero este se hace añicos, la sangre brota a borbotones y muere. Quien use un escudo debe asegurarse de que sea un escudo a prueba de balas. Quien tiene verdadera fe, la fe de los elegidos de Dios, posee un escudo tan fuerte que verá las cimitarras de sus enemigos resquebrajarse mil veces al golpearlo. Y en cuanto a sus lanzas, si tan solo entran en contacto con este escudo, se romperán en mil astillas o se doblarán como cañas al ser presionadas contra la pared; no podrán perforarlo, sino que se apagarán o se harán pedazos. Te preguntarás: ¿cómo sabremos entonces si nuestra fe es la correcta y nuestro escudo es fuerte? Una prueba es que debe ser de una sola pieza. Un escudo hecho de tres o cuatro piezas, en este caso, no servirá de nada. Así pues, tu fe debe ser de una sola pieza; debe ser fe en la obra consumada de Cristo; no debes confiar en ti mismo ni en ningún hombre, sino descansar total y completamente en Cristo, de lo contrario tu escudo no te servirá de nada. Entonces, tu fe debe ser forjada por el cielo, o tu escudo ciertamente te fallará; debes tener la fe de los elegidos de Dios, que es obra del Espíritu Santo que la obra en el alma del hombre. Entonces, debes asegurarte de que tu fe se base únicamente en la verdad, porque si hay algún error o idea falsa en su formación, esa será una grieta que la lanza podrá traspasar. Debes asegurarte de que tu fe sea conforme a la Palabra de Dios, que dependas de promesas verdaderas y reales, de la palabra segura del testimonio y no de las ficciones, fantasías y sueños de los hombres. Y sobre todo, debes tener presente que tu fe esté fija en la persona de Cristo, pues solo una fe en la persona divina de Cristo como «Dios sobre todas las cosas, bendito por siempre», y en su humanidad propia cuando, como el Cordero de la Pascua de Dios, fue sacrificado por nosotros, ninguna otra fe podrá resistir los tremendos golpes y los innumerables ataques que debes recibir en la gran batalla de la vida espiritual. Mira tu escudo, hombre. No tan rápido con ese Dios pintado. No tan rápido con ese orgulloso símbolo heráldico que no tiene fuerza. Mira tu escudo. Mira si es como los escudos de Salomón que se llevaban delante del rey, cada uno hecho de oro. O al menos que sean como los escudos de Roboam, todos ellos de bronce de la mejor calidad, para que no encuentres en tu mano ningún escudo de madera que pueda hacerse pedazos cuando más lo necesites.

Pero continuando —pues no debemos detenernos mucho en ningún punto en particular— la fe es como un escudo, porque no sirve de nada si no se maneja bien. Un escudo necesita ser manejado, y lo mismo ocurre con la fe. Era un soldado insensato que, al ir a la batalla, decía que tenía un escudo, pero lo había dejado en casa. Así también hay algunos creyentes insensatos que tienen fe, pero no la tienen consigo cuando la necesitan. La tienen cuando no hay enemigos. Cuando todo les va bien, pueden creer; pero justo cuando llega la crisis, su fe flaquea. Ahora bien, hay un arte sagrado en saber manejar el escudo de la fe. Permítanme explicarles cómo. Lo manejarán bien si son capaces de citar las promesas de Dios contra los ataques de su enemigo. El diablo dijo: «Un día serás pobre y morirás de hambre». —No —dijo el creyente, manejando bien su escudo—, él ha dicho: «Nunca te dejaré, ni te abandonaré; se te dará pan, y tu agua estará asegurada». —Sí —dijo Satanás—, pero un día caerás por la mano del enemigo. —No —dijo la fe—, porque estoy persuadido de que el que comenzó en mí la buena obra la perfeccionará hasta el día de Jesucristo. —Sí —dijo Satanás—, pero la calumnia del enemigo te derribará. —No —dijo la fe—, él hace que la ira del hombre lo alabe; el resto de la ira lo refrena. —Sí —dijo Satanás, mientras disparaba otra flecha—, eres débil. —Sí —dijo la fe, manejando su escudo—, pero «mi poder se perfecciona en la debilidad». Por tanto, con mucho gusto me gloriaré más bien en mis debilidades, para que el poder de Cristo repose sobre mí. —Sí —dijo Satanás—, pero tu pecado es grande. «Sí», dijo la fe, manejando la promesa, «pero él es capaz de salvar completamente a los que por medio de él se acercan a Dios». «Pero», dijo de nuevo el enemigo, desenvainando su espada y asestando una estocada tremenda, «Dios te ha desechado». «No», dijo la fe, «él odia desechar; no desecha a su pueblo, ni abandona su heredad». «Pero te quiero, después de todo», dijo Satanás. «No», dijo la fe, aplastando las garras en las fauces del enemigo, «Él ha dicho: “Yo doy a mis ovejas vida eterna, y no perecerán jamás, ni nadie las arrebatará de mi mano”». A esto le llamo manejar el escudo. Pero hay otra manera de manejarlo, no solo con las promesas, sino también con las doctrinas. «¡Ah!», dice Satanás, «¿qué hay en ti para que seas salvo? ¡Eres pobre, débil, mezquino y necio!». Se levantó la fe manejando el escudo doctrinalmente, esta vez, y dijo: «Dios ha escogido lo vil de este mundo, y lo despreciado ha escogido Dios, sí, y lo que no es, para anular lo que es»; porque «no muchos sabios según la carne, no muchos poderosos, no muchos nobles son llamados». «¿No ha escogido Dios a los pobres de este mundo, ricos en fe y herederos del reino que ha prometido a los que le aman?» «Sí», dijo, «si Dios os hubiera escogido,¡Pero después de todo, ciertamente perecerás! Y entonces, Christian, manejando nuevamente su escudo de la fe doctrinalmente, dijo: «No, creo en la perseverancia final de los santos, porque ¿no está escrito: “El justo perseverará en su camino, y el que tiene manos limpias se fortalecerá”?» «Los que me diste, los he guardado, y ninguno de ellos se ha perdido», y así sucesivamente. Así, al comprender bien las doctrinas de la gracia, no hay una sola doctrina que no pueda, a su manera, servir de defensa contra los dardos de fuego de los impíos. Entonces, el soldado cristiano debe saber cómo manejar el escudo de la fe según las reglas de observación. «Sí», dice el enemigo, «tu confianza es vana, y tu esperanza pronto se verá truncada». «No», dice la fe, «fui joven y ahora soy viejo, ¿acaso no he visto al justo desamparado?» «Sí, pero has caído en pecado, y Dios te abandonará». «No», dice la fe, «porque vi a David, y tropezó, pero el Señor ciertamente lo sacó del pozo horrible, y del lodo cenagoso». Usar este escudo en el camino de la observación es muy provechoso cuando se observa cómo Dios ha tratado al resto de su pueblo; porque como trata a uno, así tratará al resto, y puedes usar esto en contra de tu enemigo. «Recuerdo los caminos de Dios. Recuerdo sus obras de antaño. Digo: ¿Acaso ha desechado Dios a su pueblo? ¿Acaso ha abandonado a uno de sus escogidos? Y puesto que jamás lo ha hecho, levanto mi escudo con gran valentía y digo que jamás lo hará; él no cambia; así como no ha abandonado a nadie, tampoco me abandonará a mí».¿Acaso ha abandonado a alguno de sus elegidos? Y puesto que jamás lo ha hecho, levanto mi escudo con gran valentía y digo que jamás lo hará; él no cambia; así como no ha abandonado a nadie, tampoco me abandonará a mí.

Luego está otra bendita manera de manejar este escudo, y es experimentalmente. Cuando puedes mirar atrás, como el salmista, a la tierra del Jordán y de los hermonitas, desde el monte Mizar, cuando puedes regresar a aquellos días de antaño, y recordar tu canto en la noche, cuando tu espíritu puede decir: «¿Por qué te abates, alma mía, por qué te turbas dentro de mí? Espera en Dios, pues aún lo alabaré». Porque, hermanos, algunos de nosotros podemos hablar de tantas liberaciones, que no sabemos dónde terminar, apenas sabemos dónde empezar. ¡Oh! ¡Qué maravillas ha hecho Dios por nosotros como Iglesia y pueblo! Nos ha llevado a través del fuego y del agua. Los hombres cabalgaron sobre nuestras cabezas, pero hasta ahora todo ha obrado para nuestro bien. Su gloria se ha manifestado en medio de todas las vilezas y calumnias de los hombres a las que hemos estado expuestos. Manejemos nuestro escudo, pues, según las reglas de la experiencia pasada, y cuando Satanás nos diga que Dios nos fallará al final, respondamos: «Mientes, y te lo digo a la cara, porque lo que nuestro Dios fue en el pasado, lo será en el presente, en el futuro y así sucesivamente hasta el fin». Jóvenes soldados de Cristo, aprendan bien el arte de manejar su escudo.

Por último, en cuanto a la figura. El escudo en la antigüedad era un emblema del honor del guerrero, y más aún en tiempos posteriores a los de Pablo. En la época de la caballería, el guerrero llevaba su escudo de armas sobre él. Ahora bien, la fe es como un escudo, porque lleva la gloria del cristiano, su escudo de armas, su blasón. ¿Y cuál es el escudo de armas del cristiano? Bueno, el buen Joseph Irons solía decir que era una cruz y una corona, con las palabras «Sin cruz, no hay corona», un escudo de armas muy bendito también. Pero me parece que el mejor escudo de armas del cristiano es la cruz de su Salvador: esa cruz roja como la sangre; siempre manchada, pero nunca manchada; siempre teñida de sangre, pero siempre resplandeciente con brillo rubí; siempre pisoteada, pero siempre triunfante; siempre despreciada, pero siempre glorificada; siempre atacada, pero siempre sin resistencia, saliendo más que vencedora. Algunos de los antiguos reformadores solían tener un yunque como escudo de armas, y uno significativo, además, con este lema: "El yunque ha roto muchos martillos". Con lo cual querían decir que se quedaban quietos y dejaban que los hombres los golpearan hasta que sus martillos se rompieran solos. Otro antiguo escudo de armas de algunos reformadores solía ser una vela con muchos enemigos soplando para apagarla, y aunque todos soplaban con todas sus fuerzas, la vela solo ardía con más intensidad. De la oscuridad surgió la luz, y de todos sus ataques, la luz se hizo más fuerte. Esta mañana pon tu escudo de armas sobre tu escudo y levántalo. Que esa cruz roja como la sangre sea tu elección; entonces, cuando tu batalla haya terminado, colgarán tu escudo en el cielo; Y cuando los antiguos escudos de armas hayan desaparecido, y los leones, tigres, grifos y toda clase de criaturas extrañas se hayan desvanecido de la memoria, esa cruz y tu antiguo escudo, marcados por muchos golpes, serán honrados con muchos triunfos ante el trono de Dios. Por encima de todo, pues, toma el escudo de la fe.

II. Ahora dejo de lado la explicación de la figura y paso a REFORZAR LA EXHORTACIÓN. “Sobre todo, tomen el escudo de la fe”.

Si enviaras a un sirviente a hacer un recado y le dijeras: «Consigue esto, aquello y lo otro, pero sobre todo, encárgate de esto y aquello», no entendería que debe descuidar nada, sino que percibiría que una parte de su misión tiene una importancia especial. Así sea con nosotros. No debemos descuidar nuestra sinceridad, nuestra rectitud ni nuestra paz, sino que, sobre todo, y como lo más importante, debemos asegurarnos de que nuestra fe sea correcta, que sea verdadera y que proteja toda nuestra virtud de cualquier ataque. La necesidad de la verdadera fe se explica claramente en el texto. Aquí se dice que la fe tiene un poder extinguible. Los antiguos solían usar flechas pequeñas, quizás flechas ligeras de caña, impregnadas de veneno. Se las llamaba dardos de fuego, porque apenas tocaban la carne o incluso rozaban la piel, dejaban un veneno ardiente en las venas. A veces también empleaban dardos con puntas de estopa empapadas en algún alcohol inflamable, que ardían al volar por el aire para incendiar las tiendas de sus adversarios o quemar las casas en las ciudades sitiadas. Ahora bien, la fe tiene un poder purificador; ve la tentación, la blasfemia o la insinuación que se le presenta con veneno y fuego para arrebatarle la vida o consumir sus consuelos. La fe atrapa el dardo, no solo lo recibe, sino que le quita el aguijón y apaga su fuego. ¡Oh, es maravilloso cómo Dios a veces permite a su pueblo vivir en medio de tentaciones y tribulaciones como si no las tuviera! Creo que algunos mártires, al arder en el fuego, apenas sufrieron dolor, porque la alegría y la paz que Dios les dio los libraron del intenso calor. Esto lo sé. Hay momentos en que todos hablan bien de algunos de nosotros, y nos sentimos miserables a causa de los halagos del mundo. No queremos que nos llamen «hijo de la hija del faraón». Y, sin embargo, hay otros momentos en que, aunque todos hablen mal de nosotros, nuestra paz es como un río, y nuestra rectitud como las olas del mar. En verdad, en esos momentos podemos decir: «Ahora estoy en mi lugar; aquí es donde debo estar: fuera del campamento, soportando el oprobio de Cristo». La alabanza del hombre es mortal y condenable; su censura es buena y divina. Que venga; no puede deshonrar, sino ennoblecer. Así sucede a menudo que la fe apaga el fuego del ataque, es más, convierte el ataque mismo en consuelo, extrae miel de la ortiga y dulces gozos de ajenjo y hiel. «Sobre todo, tomen el escudo de la fe».

Otro elogio que ofrece el texto es este: que solo la fe, de entre todas las piezas de la armadura, es capaz de apagar todos los dardos. El casco solo puede proteger de los que van dirigidos a la cabeza. El pie es el único protegido por las sandalias, el pecho solo está protegido por la coraza, pero la fe protege de todos los ataques. Tened todas las demás virtudes, pero sobre todo tened fe, porque la fe es la Catholica, es la panacea, es el remedio universal, es buena no solo para el calor de la fiebre, sino también para los escalofríos. Es buena para todo: buena para los tímidos para fortalecerlos, buena para los temerarios para hacerlos sabios; buena para los desanimados para darles valor, y buena para los demasiado osados ​​para hacerlos discretos. No hay nada en lo que la fe no nos sea útil; por lo tanto, sea lo que sea que dejéis de lado, cuidad de vuestra fe; si olvidáis todo lo demás, tened cuidado sobre todo de tomar el escudo de la fe.

Y luego, de nuevo, se nos dice sobre todo que tomemos el escudo de la fe, porque la fe nos protege de toda clase de enemigos. ¡Los dardos de fuego de los impíos! ¿Se refiere a Satanás? La fe le responde. ¿Se refiere a los hombres malvados? La fe los resiste. ¿Se refiere a la propia maldad? La fe puede vencerla. ¿Se refiere al mundo entero? «Esta es la victoria que vence al mundo: nuestra fe». No importa quién sea el enemigo; aunque la tierra esté en armas, esta fe puede apagar todos los dardos de fuego de los impíos. Sobre todo, pues, tomen el escudo de la fe. Sé que hay algunos ministros que parecen enseñar a dudar como un deber. Yo no puedo; no me atrevo. Sobre todo, tomen el escudo de la fe. Saben que en las antiguas contiendas griegas, el objetivo del enemigo era acercarse lo suficiente para apartar el escudo y luego apuñalar bajo la armadura. Y eso es lo que Satanás quiere hacer. Si puede apartar el escudo y meterse debajo, entonces puede apuñalarnos mortalmente. Cuiden su escudo. No vivas en la incredulidad perpetua. No te dejes abatir constantemente. Ora a tu Dios hasta que puedas decir: «Sé en quién he creído, y estoy seguro de que él es poderoso para guardar lo que le he encomendado». ¡Oh! Los antiguos santos no siempre dudaban. «Mi amado es mío, y yo soy suyo», dijo Salomón. David dijo: «Di a mi alma: Yo soy tu salvación». «El Señor es mi salvación». «El Señor es mi pastor». Job también podía decir: «Sé que mi Redentor vive». Pablo podía hablar con gran confianza en muchos pasajes. ¿Y por qué deberíamos conformarnos con decir: «Espero, confío», cuando ellos decían que sabían y estaban convencidos de que todo estaba bien entre Dios y sus almas? Que así sea también con nosotros. La incredulidad nos deshonra, nos debilita, destruye nuestras comodidades, impide nuestra utilidad. La fe nos hará felices, nos hará útiles y, lo mejor de todo, nos permitirá honrar a Dios en la tierra y disfrutar de su presencia mientras aún nos encontramos en los humildes mundos de este mundo.

III. Por último, tengo unas palabras que decir a modo de conclusión a algún POBRE PECADOR QUE SE ACERCA A CRISTO, PERO QUE ESTÁ MUY ATRISTE POR LOS DARDOS DE FUEGO DEL MALVADO.

¿Recuerdas cómo John Bunyan, en su obra El progreso del peregrino, describe a Christiana, Mercy y los niños que llaman a la puerta? Al llamar, el enemigo, que vivía en un castillo cercano, envió un perro grande que les ladró con tal fuerza que Mercy se desmayó. Christiana solo se atrevió a llamar de nuevo, y cuando finalmente logró entrar, estaba temblando. Al mismo tiempo, en el castillo cercano, había hombres que lanzaban dardos de fuego a todo aquel que intentara entrar; y la pobre Mercy estaba sumamente asustada por los dardos y el perro. Ahora bien, suele suceder que cuando un alma se acerca a Cristo, el diablo la persigue. Tan seguro como que siente su necesidad de un Salvador y está dispuesto a confiar en Cristo, le ocurrirá lo mismo que al pobre niño endemoniado: al acercarse, el diablo lo derribó y lo destrozó. Ahora bien, pobre pecador tentado, no hay nada que pueda traer alegría y paz a tu corazón sino la fe. Oh, que tengas la gracia esta mañana de empezar a usar este escudo. “Ah, señor, dice usted, he estado mirando en mi interior y no veo nada bueno; he estado mirando mis experiencias y me temo que nunca me he sentido como Fulano se sintió”. Esa es la manera de arruinarse. ¿Alguna vez oyó hablar de un hombre que en el frío invierno se calentaba rodando sobre el hielo y decía: “No siento ningún calor como algunas personas”? No, porque está buscando el calor en el lugar equivocado. Si esperas obtener algo en ti mismo, esperas más de lo que Pablo jamás obtuvo, pues dijo después de haber conocido mucho tiempo a su Maestro: “Sé que en mí — (es decir, en mi carne) — no habita nada bueno”. “Oh, señor”, responde usted de nuevo, “descubro que estoy dispuesto a hacer muchas cosas, pero no puedo; y cuando quisiera ser lo que debería ser, encuentro una resistencia en algún lugar dentro de mi propio pecho”. Bueno, ¿y qué de eso? Así lo dijo el apóstol: «Cuando quiero hacer el bien, el mal está presente conmigo». La verdad es que no tienes por qué mirar ahí. Estas cosas no son escudos contra Satanás. ¿Qué le importan tus experiencias? Aunque nunca fueran tan buenas, seguiría rugiendo contra ti. Lo que teme es tu fe. Deshazte, pues, de estas cosas que solo te estorban y te exponen, expón tu pecho a sus ataques y toma el escudo de la fe. ¿Qué te ha dicho Satanás? «Eres un pecador demasiado grande para ser salvo». Pues bien, cita este texto: «Al que a mí viene, no lo echaré fuera». Esta semana tuve una lección en el caso de un buen cristiano que, por debilidad mental, cayó finalmente en la más profunda desesperación. Nunca conocí a una persona tan desesperada como él, y no te imaginas lo desconcertado que me sentí al intentar consolarlo; de hecho, fracasé después de todo. Dijo: «Soy un pecador demasiado grande para ser salvo». Entonces dije: “Pero la sangre de Jesucristo su Hijo nos limpia de todo pecado”. “Sí”, dijo él, “pero debes recordar el contexto, que dice: “Si andamos en la luz como él está en la luz, tenemos comunión unos con otros,y la sangre de Jesucristo su Hijo nos limpia de todo pecado.” Ahora bien, yo no ando en la luz —dijo él—; ando en la oscuridad, y no tengo comunión con el pueblo de Dios ahora, y por lo tanto no se aplica a mí. —Bien —dije—, pero él es capaz de salvar completamente a los que por medio de él se acercan a Dios. —Ese es el único texto —dijo— que nunca puedo superar, porque dice «hasta lo extremo», y sé que no puedo haber ido más allá de eso, y aun así no me consuela. —Dije—, pero Dios no te pide nada más que creas en él; y sabes que si tienes una fe tan débil eres como un niño: la débil mano de un niño puede recibir; si tan solo recibes con tu mano, eso es suficiente. —Ay —dijo él—, no tengo la mano; no tengo la mano de la fe. —Muy bien —dije—, tienes la boca del deseo; puedes pedir, si no puedes recibir con la mano. —No —dijo—, no tengo; no oro, no puedo orar; no tengo boca de deseo. —Entonces —dije—, lo único que se necesita es un lugar vacío, un vacío, para que Dios pueda llenarlo. —¡Ah, señor! —dijo—, ¡me ha pillado! Tengo un gran vacío; tengo un vacío doloroso, un vacío. Si alguna vez hubo un pecador vacío en este mundo, soy yo. —Bueno —dije—, Cristo llenará ese vacío; hay un Cristo completo para los pecadores vacíos. Permítanme ahora decirles lo mismo que le dije a aquel pobre hombre. Todo lo que Dios quiere es un vacío. Ustedes tienen un vacío. Esto no es mucho; simplemente estar vacío, estar seco, no tener nada en absoluto. Pero entonces, «él colma de bienes a los hambrientos, y a los ricos los despide con las manos vacías». Lo único que se requiere es estar allí abajo, en el suelo. No es un trabajo duro. No se trata de sentarse, ni de ponerse de pie, ni de arrodillarse, sino de yacer allí a sus pies; y cuando vea el alma postrada ante él, tendrá misericordia de ella.Tengo un gran vacío; tengo un vacío doloroso, un vacío. Si alguna vez hubo un pecador vacío en este mundo, soy yo. Todo lo que Dios quiere es un vacío. Ustedes tienen un vacío. Todo lo que se necesita es estar allí abajo, en el suelo. No es un trabajo duro. Si alguna vez hubo un pecador vacío en este mundo, soy yo. Todo lo que Dios quiere es un vacío. Ustedes tienen un vacío. Todo lo que se necesita es estar allí abajo, en el suelo. No es un trabajo duro. No se trata de sentarse, ni de ponerse de pie, ni de arrodillarse, sino de yacer allí a sus pies; y cuando vea el alma postrada ante él, tendrá misericordia de ella.

Ahora, alma, por ese escudo de fe. Dile a Satanás: «En el nombre de Dios me atrevo a creer». «Eres un gran pecador», dice él. «Sí, pero creo que es un gran Salvador». «Pero has pecado más allá de toda esperanza». «No, en él hay perdón, para que se le tema». Pero él dice: «Estás excluido». «No», dices, «aunque me mate, aun así confiaré en él». «Pero tu enfermedad es de larga data». Sí, pero dices: «Si tan solo toco el borde de su manto, seré limpio». Pero Satanás dice de nuevo: «¿Cómo te atreves? ¿Te atreves a tener tal descaro?». «Bien», dices, «si perezco, confiaré en Cristo, y solo allí pereceré». Ten firmemente grabado en tu alma que, a pesar de todo, confiarás en Cristo, que seas pecador o no, aun así confiarás en Cristo, que sean ciertas o falsas las acusaciones de Satanás, que te propongas no responderlas y simplemente confiar en Cristo. ¡Ah, alma, entonces tendrás tal gozo y paz que nada se le comparará! ¡Ojalá creyeras en Jesús ahora! Deja tus sentimientos, deja tus acciones y tus deseos, y confía en Cristo. «No me atrevo», dice uno. ¡Atrévete, hombre, atrévete! No puedes hacer el mal porque él te lo ordena. Este es el mandamiento: que creáis en Jesucristo, a quien él ha enviado. «Oh, pero puedo perderme incluso si lo hago». Te perderás si no lo haces, porque «el que no cree será condenado». «Pero tengo miedo de ser condenado si creyera». «El que no cree ya está condenado». Eres como los pobres leprosos en la puerta; estás muriendo y dices: «Caigamos en manos de los sirios: si nos matan, moriremos; y si nos salvan la vida, viviremos». Di, como Ben-adad dijo acerca del rey Acab: «Hemos oído que los reyes de Israel son reyes misericordiosos, pero pongámonos cuerdas en la cabeza y salgamos a ver al rey de Israel; tal vez él te salve la vida». Así que dile a Dios: «He oído que eres misericordioso; si hay un miserable del infierno que merece estar en él, yo soy ese pecador; si hay uno que ahora siente que la tierra se enfurece contra él, y la tierra dice: ¡Trágatelo!; y el cielo se enfurece contra él, y clama: ¡Que el relámpago lo destruya!; y el mar dice: ¡Ahógalo!; y las estrellas dicen: ¡Castígalo con peste!; y el sol dice: ¡Que lo abrase!; y la luna dice: ¡Que sea aniquilado!; y el moho dice: ¡Devoraré sus cosechas!; y la fiebre dice: ¡Cortaré el hilo de su vida!; si hay tal miserable del infierno, yo soy él; sin embargo, dile a Dios: «Creo en tu misericordia, creo en tu promesa, creo en tu Hijo Jesús, creo en su preciosa sangre, y aquí estoy; haz conmigo lo que bien te parezca», di solo esto y tendrás Misericordia, perdón y paz. Queridos oyentes, ¿acaso digo esto por mí y no por ustedes? No, sino que Dios les conceda a muchos de ustedes esta mañana confiar en aquel que dijo: «Los que confían en mí jamás serán avergonzados».`;

/* ── Partir el texto en frases ───────────────────────────────── */
const MAX = 170;
const ABBR = /^(sr|sra|srta|dr|dra|lic|ing|prof|ud|uds|etc|ej|p|pág|pag|núm|num|fig|vol|av|aprox|máx|mín|min|max|ss|art|cap|ed|tel|dept|depto)\.$/i;
/* Un punto solo cierra la frase si le sigue un espacio y no viene de una abreviatura. */
function cortes(p){
  const out = []; let start = 0;
  for(let i = 0; i < p.length; i++){
    if(".!?…".indexOf(p[i]) < 0) continue;
    let j = i;
    while(j+1 < p.length && ".!?…\"'”’»)]".indexOf(p[j+1]) >= 0) j++;
    const next = p[j+1];
    if(next !== undefined && !/\s/.test(next)){ i = j; continue; }        /* .txt, 3.14, ejemplo.com */
    const piece = p.slice(start, j+1);
    const last = piece.trim().split(/\s+/).pop() || "";
    if(p[j] === "." && (ABBR.test(last) || /^[\wÁÉÍÓÚÑ]\.$/.test(last))){ i = j; continue; }
    const t = piece.trim(); if(t) out.push(t);
    start = j+1; i = j;
  }
  const tail = p.slice(start).trim();
  if(tail) out.push(tail);
  return out.length ? out : [p];
}
function frases(p){
  const out = [];
  cortes(p).forEach(raw => {
    const s = raw.trim();
    if(!s) return;
    if(s.length < 26 && out.length){ out[out.length-1] += " " + s; return; }
    if(s.length <= MAX){ out.push(s); return; }
    let rest = s;
    while(rest.length > MAX){
      let cut = rest.lastIndexOf(",", MAX);
      if(cut < MAX*0.5) cut = rest.lastIndexOf(" ", MAX);
      if(cut < MAX*0.4) cut = MAX;
      out.push(rest.slice(0, cut+1).trim());
      rest = rest.slice(cut+1).trim();
    }
    if(rest) out.push(rest);
  });
  return out.length ? out : [p];
}

/* ── Pintar el texto ─────────────────────────────────────────── */
const LARGO_COMODO = 1100;   /* a partir de aquí un párrafo se vuelve un muro */
const LARGO_BLOQUE = 520;    /* tamaño al que se reparte, siempre en límite de frase */
function repartir(fs, objetivo){
  const out = []; let bloque = [], n = 0;
  fs.forEach(f => {
    bloque.push(f); n += f.length;
    if(n >= objetivo){ out.push(bloque); bloque = []; n = 0; }
  });
  if(bloque.length) out.push(bloque);
  return out;
}
const article = $("#article");
function render(raw){
  stop();
  S.i = 0;                       /* cada texto empieza por su primera frase */
  const limpio = String(raw).replace(/\r\n?/g, "\n").replace(/ /g, " ").trim();
  let parrafos = limpio.split(/\n{2,}/).map(t => t.trim()).filter(Boolean);
  if(parrafos.length < 2) parrafos = limpio.split(/\n/).map(t => t.trim()).filter(Boolean);

  S.chunks = [];
  article.textContent = "";
  parrafos.forEach((p, pi) => {
    const esTitulo = pi === 0 && p.length < 90 && !/[.!?]$/.test(p);
    const fs = frases(p.replace(/\n/g, " "));
    /* Un muro de texto cansa la vista y desorienta al escuchar: los párrafos muy
       largos se reparten en bloques. Las palabras y su orden no cambian. */
    const bloques = p.length > LARGO_COMODO ? repartir(fs, LARGO_BLOQUE) : [fs];
    bloques.forEach(bloque => {
      const el = document.createElement("p");
      if(esTitulo) el.className = "h";
      bloque.forEach(f => {
        const sp = document.createElement("span");
        sp.className = "sent"; sp.textContent = f;
        sp.dataset.i = S.chunks.length; sp.title = "Leer desde aquí";
        el.append(sp, document.createTextNode(" "));
        S.chunks.push({ text:f, el:sp });
      });
      article.appendChild(el);
    });
  });

  S.words = (limpio.match(/[\wÀ-ÿ'’-]+/g) || []).length;
  stats(); progress();
  window.scrollTo({ top:0, behavior:"auto" });
}
function stats(){
  const wpm = 165 * Number($("#rate").value);
  const min = Math.max(1, Math.round(S.words / wpm));
  $("#stats").textContent =
    S.words.toLocaleString("es") + " palabras · " + S.chunks.length.toLocaleString("es") +
    " frases · ≈ " + min + " min en voz a " + Number($("#rate").value).toFixed(1) + "×";
}

const PREF = ["es-MX","es-US","es-419","es-CO","es-AR","es-CL","es-PE","es-VE","es-EC","es-GT","es-CR","es-PA","es-DO","es-BO","es-UY","es-PY","es-HN","es-NI","es-SV","es-PR","es-CU"];
/* Equivalentes más cercanos a Paulina en cada plataforma, de mejor a peor. */
const BUENAS = [
  "paulina", "angélica", "angelica", "dalia", "sabina",
  "google español de estados unidos", "jorge", "raúl", "raul",
  "juan", "francisca", "diego", "google español"
];
/* Voces de fantasía que traen macOS e iOS: sirven para jugar, no para leer. */
const NOVEDAD = ["eddy","flo","grandma","grandpa","reed","rocko","sandy","shelley","superstar",
  "bells","boing","bubbles","jester","organ","trinoids","whisper","wobble","zarvox","albert","cellos"];
const voiceSel = $("#voice");
let voices = [], voice = null;

function novedad(v){ return NOVEDAD.indexOf((v.name || "").toLowerCase().split(" (")[0].trim()) >= 0; }
function esLatina(v){ return PREF.indexOf((v.lang || "").replace("_", "-")) >= 0; }
function conocida(v){
  const n = (v.name || "").toLowerCase();
  return BUENAS.findIndex(b => n.indexOf(b) >= 0);
}
function rank(v){
  const lang = (v.lang || "").replace("_", "-");
  const c = conocida(v), lat = PREF.indexOf(lang);
  if(novedad(v)) return 700 + (lat >= 0 ? 0 : 10);
  if(c >= 0 && lat >= 0) return c;
  if(lat >= 0) return 50 + lat;
  if(c >= 0) return 250;
  if(/^es-ES/i.test(lang)) return 320;
  if(/^es/i.test(lang)) return 300;
  return 900;
}
const GRUPOS = [
  ["Recomendadas · español latino", r => r < 50],
  ["Otras voces en español latino", r => r >= 50 && r < 250],
  ["Voces en español de España",    r => r >= 250 && r < 700],
  ["Voces de fantasía del sistema", r => r >= 700 && r < 900],
  ["Otras voces",                   r => r >= 900]
];
function loadVoices(definitivo){
  if(!synth) return;
  const todas = synth.getVoices() || [];
  if(!todas.length && !definitivo) return;      /* la lista todavía no llega */
  const es = todas.filter(v => /^es/i.test(v.lang || ""));
  voices = (es.length ? es : todas).sort((a,b) => rank(a)-rank(b) || a.name.localeCompare(b.name));

  voiceSel.textContent = "";
  GRUPOS.forEach(g => {
    const lista = voices.map((v, i) => [v, i]).filter(par => g[1](rank(par[0])));
    if(!lista.length) return;
    const og = document.createElement("optgroup");
    og.label = g[0];
    lista.forEach(par => {
      const o = document.createElement("option");
      o.value = par[1];
      o.textContent = (par[1] === 0 ? "★ " : "") + par[0].name + " · " + par[0].lang;
      og.appendChild(o);
    });
    voiceSel.appendChild(og);
  });

  const guardada = store.get("voz", "");
  let idx = -1;
  if(guardada){
    idx = voices.findIndex(v => v.name + "|" + v.lang === guardada);
    if(idx < 0){
      const nom = guardada.split("|")[0].toLowerCase();
      idx = voices.findIndex(v => v.name.toLowerCase() === nom);
    }
  }
  if(idx < 0) idx = voices.length ? 0 : -1;
  if(idx >= 0){ voiceSel.value = idx; voice = voices[idx]; }

  if(!voices.length){
    if(definitivo) aviso("Tu navegador no tiene voces instaladas para leer en voz alta. En Windows y Android puedes agregar una voz en español desde los ajustes del sistema.");
  }else if(!es.length){
    aviso("No hay voces en español instaladas en este equipo; se usará la voz disponible. Puedes agregar una voz en español desde los ajustes del sistema.");
  }else if(conocida(voices[idx]) < 0 || !esLatina(voices[idx])){
    aviso("En este equipo no está Paulina ni otra voz latina de las recomendadas. Se eligió <b>" + esc(voices[idx].name) + "</b>, la mejor disponible aquí; puedes cambiarla en Ajustes.");
  }
}
voiceSel.addEventListener("change", () => {
  voice = voices[voiceSel.value] || null;
  if(voice){ store.set("voz", voice.name + "|" + voice.lang); aviso(""); }
  if(S.playing) restart();
});
if(synth){
  loadVoices();
  const alCambiar = () => loadVoices();
  synth.addEventListener ? synth.addEventListener("voiceschanged", alCambiar) : (synth.onvoiceschanged = alCambiar);
  setTimeout(alCambiar, 400);
  setTimeout(() => loadVoices(true), 1600);     /* recién aquí damos por cerrada la lista */

/* ── Lectura en voz alta ─────────────────────────────────────── */
const isChromium = /Chrome|Chromium|Edg|OPR/.test(navigator.userAgent) && !/CriOS|FxiOS/.test(navigator.userAgent);
let keepAlive = null;
function rate(){ return Number($("#rate").value); }
function volume(){ return Number($("#vol").value); }

function speakCurrent(){
  if(!synth || !S.chunks[S.i]) return;
  const u = new SpeechSynthesisUtterance(S.chunks[S.i].text);
  const g = ++S.gen;
  if(voice) u.voice = voice;
  u.lang = (voice && voice.lang) || "es-MX";
  u.rate = rate(); u.volume = volume(); u.pitch = 1;
  u.onend = () => {
    if(g !== S.gen || !S.playing) return;
    if(S.i < S.chunks.length - 1){ S.i++; highlight(); speakCurrent(); }
    else { stop(); $("#progText").textContent = "Lectura terminada"; }
  };
  u.onerror = ev => {
    if(g !== S.gen) return;
    if(ev.error === "interrupted" || ev.error === "canceled") return;
    stop(); aviso("La lectura se interrumpió. Presiona reproducir para continuar.");
  };
  highlight();
  synth.speak(u);
  guard();
}
/* Chrome corta las frases largas pasados ~15 s: lo evitamos con un pulso. */
function guard(){
  clearInterval(keepAlive);
  if(!isChromium || rate() >= 1) return;
  keepAlive = setInterval(() => {
    if(S.playing && !S.paused && synth.speaking && !synth.paused){ synth.pause(); synth.resume(); }
  }, 9000);
}
function playFrom(i){
  if(!synth || !S.chunks.length) return;
  synth.cancel(); S.gen++;
  S.i = Math.max(0, Math.min(S.chunks.length-1, i));
  S.playing = true; S.paused = false; icon();
  setTimeout(() => { if(S.playing) speakCurrent(); }, 80);
}
function restart(){ if(S.playing) playFrom(S.i); }
function toggle(){
  if(!synth || !S.chunks.length) return;
  if(!S.playing){ playFrom(S.i); return; }
  if(S.paused){
    synth.resume();
    if(!synth.speaking) speakCurrent();   /* algunos navegadores olvidan la frase */
    S.paused = false;
  }else{
    synth.pause(); S.paused = true;
  }
  icon(); progress();
}
function stop(){
  S.playing = false; S.paused = false; S.gen++;
  clearInterval(keepAlive);
  if(synth) synth.cancel();
  icon(); progress();
}
function step(d){
  const n = Math.max(0, Math.min(S.chunks.length-1, S.i + d));
  if(S.playing) playFrom(n);
  else { S.i = n; highlight(); progress(); }
}
function highlight(){
  S.chunks.forEach((c, n) => c.el.classList.toggle("on", n === S.i));
  const el = S.chunks[S.i] && S.chunks[S.i].el;
  if(el){
    const r = el.getBoundingClientRect();
    if(r.top < 80 || r.bottom > window.innerHeight - 90){
      const suave = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      el.scrollIntoView({ block:"center", behavior: suave ? "smooth" : "auto" });
    }
  }
  progress();
}
function icon(){
  $("#playIcon").innerHTML = (S.playing && !S.paused)
    ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>'
    : '<path d="M7 4l13 8-13 8z"/>';
  $("#play").title = (S.playing && !S.paused) ? "Pausar (espacio)" : "Leer en voz alta (espacio)";
}
function progress(){
  const total = S.chunks.length || 1;
  const pct = S.playing || S.i > 0 ? Math.round((S.i + (S.playing ? 1 : 0)) / total * 100) : 0;
  $("#progBar").style.width = pct + "%";
  $("#progPct").textContent = pct + " %";
  $("#progText").textContent = S.playing
    ? (S.paused ? "En pausa · frase " : "Leyendo · frase ") + (S.i+1) + " de " + total
    : (S.i > 0 ? "Detenido en la frase " + (S.i+1) : "Listo para leer");
}

$("#play").addEventListener("click", toggle);
$("#stop").addEventListener("click", () => { stop(); S.i = 0; highlight(); });
$("#prev").addEventListener("click", () => step(-1));
$("#next").addEventListener("click", () => step(1));
article.addEventListener("click", e => {
  const s = e.target.closest(".sent");
  if(s) playFrom(Number(s.dataset.i));
});

$("#rate").addEventListener("input", () => { $("#rateVal").textContent = rate().toFixed(1) + "×"; stats(); });
$("#rate").addEventListener("change", () => { store.set("vel", rate()); restart(); });
$("#vol").addEventListener("input", () => { $("#volVal").textContent = Math.round(volume()*100) + " %"; });
$("#vol").addEventListener("change", () => { store.set("vol", volume()); restart(); });

document.addEventListener("keydown", e => {
  const t = e.target;
  if(e.key === "Escape" && !panel.hidden){ abrirPanel(false); return; }
  if(t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT" || t.tagName === "SELECT")) return;
  if(e.key === " "){ e.preventDefault(); toggle(); }
  else if(e.key === "ArrowRight"){ e.preventDefault(); step(1); }
  else if(e.key === "ArrowLeft"){ e.preventDefault(); step(-1); }
  else if(e.key === "+" || e.key === "="){ setTamano(ti+1); }
  else if(e.key === "-" || e.key === "_"){ setTamano(ti-1); }
});
window.addEventListener("beforeunload", () => { if(synth) synth.cancel(); });

/* ── Arranque ────────────────────────────────────────────────── */
$("#rate").value = store.get("vel","1");
$("#vol").value = store.get("vol","1");
$("#rateVal").textContent = rate().toFixed(1) + "×";
$("#volVal").textContent = Math.round(volume()*100) + " %";
seleccionar(store.get("sel", "guia"));
})();
</script>
