II. Ahora paso brevemente al segundo punto del tema: «Él te concederá los deseos de tu corazón». Esta es una promesa de valor incalculable. ¿Qué relación existe entre la primera parte del texto y la segunda: «Deléitate en el Señor» y «Él te concederá los deseos de tu corazón»? Existe esta relación: quienes se deleitan en Dios están capacitados para que se cumpla la promesa. Están capacitados, en primer lugar, en cuanto a sus deseos. No sería prudente que Dios concediera a cada uno de ustedes el deseo de su corazón; sería su perdición. Una de las mejores cosas que el Señor hace por algunos hombres es frenarlos y frustrarlos. Hay muchos hombres que han ido al cielo por no haber tenido sus deseos, quienes habrían ido al infierno si los hubieran tenido. Los hombres impíos tienen deseos que los llevarían al abismo, y cuando Dios se niega a concederles sus deseos, es como si hubiera puesto cadenas, postes y barreras en el camino para impedirles ir precipitadamente a su propia destrucción. El hombre impío no está capacitado para recibir la promesa, porque desearía algo que no glorificaría a Dios ni le reportaría ningún beneficio. Pero cuando el deleite de un hombre está en Dios, entonces sus deseos son de tal naturaleza que Dios puede ser glorificado al concederlos, y el hombre mismo se beneficia al recibirlos. Además, deleitarse en Dios capacita al creyente no solo para desear correctamente, sino también para gastar correctamente: porque algunos hombres, si tenían el deseo de su corazón, y era un buen deseo, sin embargo harían un mal uso de él, y así les sucedería lo mismo que le sucedió al antiguo Israel, mientras aún tenían la comida en la boca, la maldición de Dios vendría sobre ellos; Pero aquel que se deleita en Dios, sea lo que sea que reciba, sabe usarlo bien. La gente dice que el uso es una segunda naturaleza. Hermanos, el abuso es la primera naturaleza. Abusar de las misericordias es mucho más propio de la naturaleza humana que usarlas adecuadamente, pero cuando el creyente se deleita en Dios, todo lo que recibe de Él lo gasta correctamente: no lo convierte en un sacrificio para sí mismo, mucho menos para un Dios ante quien postrarse y adorar; sino que lo convierte en un medio para servir mejor a Dios y deleitarse aún más en el Maestro. Los ríos de los hombres mundanos se alejan del mar; pero los ríos que tienen los cristianos desembocan en el mar. Si un hombre mundano navega por la corriente de sus misericordias, se aleja cada vez más de Dios y se convierte cada vez más en idólatra. Pero cuando el cristiano recibe misericordias, navega cada vez más cerca de su Dios; y así sus misericordias se convierten en caminos hacia el trono del mismo Dios.

«Aun así», dice uno, «¿cuáles son esos deseos que con seguridad recibiremos?». Ahora bien, hermanos, debemos distinguir a aquellos que se deleitan en Dios, y creo que la variedad de sus deseos se encontrará en un ámbito muy reducido. Si esta mañana tuviera mi deseo de Dios, no sería mucho decir que no tengo nada terrenal que desear, «porque lo tengo todo y abundo». Pero si el apóstol Pablo estuviera aquí, que no tenía nada, que a menudo estaba desnudo, pobre y miserable, estoy convencido de que si tuviera un deseo, diría: «No tengo nada que desear, nada en la tierra, porque he aprendido a contentarme con lo que tengo». Pero si tuviera que tener un deseo, hermanos, sé lo que desearía. Desearía ser perfecto, estar libre de todo pecado, de toda imperfección, de todo egoísmo, de toda tentación, de todo amor al mundo, de toda preocupación por todo lo que sea contrario a la Palabra de Dios. ¿No es ese vuestro deseo, vosotros que os deleitáis en Dios? ¿No dirías ahora mismo, si un ángel se presentara ante ti en la puerta del banco: «Si me lo permites, que me libere completamente del nombre, la naturaleza, la culpa y el poder del pecado»? Se te concederá tu deseo; el Señor te dará el deseo de tu corazón. Pero oigo a otro decir: «Si pudiera tener mi deseo, sería vivir más cerca de Cristo; tener comunión constante con él hasta conocerlo y experimentar el poder de su resurrección, siendo hecho semejante a su muerte». Hermano, comparto ese deseo contigo. Estoy seguro de que si te ofrecieran diez reinos en una mano y esta comunión con Cristo en la otra, no expresaría el deseo de tu corazón cuando digo que preferirías tener comunión con Cristo antes que esos reinos. Pues bien, el Señor te dará el deseo de tu corazón. Deléitate en el Señor. «Pues bien», dice otro, «si pudiera tener mi deseo, tendría todas estas cosas, pero desearía ser útil siempre». ¡Ah, ser útil! ¡Cuántos hombres viven como el sapo de Belzoni en las pirámides de Egipto, que llevaba allí dos mil años; y lo único que hacía era dormir y despertar a ratos durante todo ese tiempo! Y así, algunos viven sin hacer nada. «Pero si pudiera pedir lo que quisiera», creo oír decir a muchos de ustedes, «me gustaría ser útil; ganar coronas para Cristo, salvar almas para él, traer de vuelta a sus ovejas perdidas». Hermano, deléitate en el Señor, y tu deseo se cumplirá. Quizás no exactamente como te gustaría expresarlo. Puede que no seas útil en el ámbito al que aspiras, pero serás útil como Dios quiere que seas útil a su manera y en su medida.

Debo decir una cosa. Tengo un deseo que, si pudiera expresarlo ahora sabiendo que me sería concedido, sería este: deseo verlos a todos convertidos. Madres y padres, ¿acaso no pueden decir: «El deseo de mi corazón es que mis hijos sean salvos, pues no tengo mayor gozo que el de que mis hijos caminen en la verdad»? Y yo, como ministro, digo que mi más ferviente deseo, el más elevado que conozco, aquello que mi alma siente con mayor intensidad cuando más anhela y aspira con mayor intensidad a algo grande y grandioso, es poder presentar a cada uno de ustedes perfecto ante Dios al final; para no solo estar libre de su sangre, lo cual es algo grandioso, sino para tenerlos conmigo cuando diga: «Aquí estoy, Señor, y los hijos que me has dado para Cristo». Oh, ustedes que son miembros de esta Iglesia, ¿oran para que su ministro se deleite en Dios, para que tenga este deseo de su corazón? ¿Y vosotros también os deleitaréis en Dios, de modo que cuando os acerquéis a Él en oración y oréis por esta congregación, podáis estar seguros de que os concederá el deseo de vuestro corazón, porque os habéis deleitado en Él? Decían de Martín Lutero mientras caminaba por las calles: «Ahí viene un hombre que puede tener de Dios todo lo que quiera». Preguntáis la razón. Porque Lutero se deleitaba en su Dios. Dadnos algunos hombres así en esta congregación y en esta Iglesia que amen al Señor y se regocijen en Él, ¡qué efecto tendrán sus oraciones! Estos son los hombres que tienen las llaves del cielo, de la muerte y del infierno. Estos son los hombres que pueden abrir el cielo o cerrarlo, que llueva o no llueva. La Iglesia de Roma pretende tener las llaves; pero la Iglesia de Cristo tiene las llaves sin pretender tenerlas, y estas llaves penden de los cinturones de los hombres que se deleitan en Dios. Con vuestras oraciones podéis hacer descender tales lluvias del Espíritu sobre la Iglesia Cristiana, que el desierto se regocijará y florecerá como la rosa; Y si dejáis de deleitaros en Dios, podéis cerrar el cielo mismo, de modo que no descienda la lluvia, y toda la Iglesia vuelva a ser estéril e infructífera.

Ahora, para concluir. Fíjense bien: esto es lo único que puede deleitar a un hombre y satisfacer sus deseos. Hay quienes se deleitan con el dinero, pero no consiguen lo que anhelan. Obtienen su dinero, pero nunca la satisfacción que esperaban. Leímos en los periódicos hace poco sobre alguien que tuvo un éxito extraordinario en su profesión, pero que recientemente intentó suicidarse ante la idea de perderlo todo en la guerra de Vietnam. Recordamos en esta gran ciudad a uno de los comerciantes más importantes, que murió con una fortuna de más de tres millones de dólares, pues creo que su propiedad estaba jurada por esa cantidad. Durante la última etapa de su vida, solía cobrar el mismo salario que su jardinero y creía que moriría en un asilo. Había adquirido vastas propiedades y una fortuna incalculable, pero no la satisfacción de su corazón. Se deleitaba con su oro, pero no con lo que deseaba. Así, hemos conocido hombres que se deleitaron con la fama, y ​​una vez que la obtuvieron, desearon con ansias deshacerse de ella. Fueron grandes estadistas o poderosos guerreros, y gozaron de gran renombre; pero cuando alcanzaron la fama y se situaron en la cima, no encontraron en ella lo que esperaban, y dijeron: «Ojalá hubiera vivido en el anonimato, pues entonces habría conocido la satisfacción». Y miren a muchos de ustedes. Cuando eran aprendices, su mayor anhelo era ser oficiales. Pues bien, una vez que se convirtieron en oficiales, ¿qué hicieron entonces? Querían ser maestros y establecerse en un negocio propio. Y lo hicieron, y les fue bastante bien. ¿Han cumplido su deseo? Oh, no; eso ha ido un poco más allá. Ahora, esperan a haber criado a su numerosa familia, y luego, cuando sus hijos ya son adultos, buscan una villa en las afueras donde puedan retirarse y pasar el resto de sus días. Algunos de ustedes tienen una villa en el campo y han resuelto sus asuntos comerciales. ¿Ya han alcanzado el anhelo de su corazón? Bueno, todavía no. Aún hay algo más que desean. Ah, sí, conseguir el anhelo del corazón de un hombre es como perseguir un fantasma. Está aquí, allá y en todas partes; ahora en la colina, ahora en el valle; uno salta sobre él, y vuelve a desaparecer en la siguiente colina, y luego en la siguiente, y uno descubre que su búsqueda es infructuosa. La satisfacción en este mundo es como el diamante que el necio ve al pie del arcoíris. Así que corre tras él, y mientras corre, el arcoíris siempre está lejos, y nunca puede encontrar lo que esperaba. Pero si desean alcanzar el anhelo de su corazón, deléitense en su Dios, entréguenle su amor; entréguenle su corazón. Sumérjanse en esta corriente, y tendrán todo lo que puedan desear; el anhelo de su corazón se cumplirá plenamente.

¿Acaso no hay hoy en esta casa quienes no pueden deleitarse en Dios? —¿no pueden? —¿no pueden? —¿no pueden? —¿Cómo —dices— puedo deleitarme en Dios? Él está enojado conmigo. Tienes razón, no puedes. ¿Cómo puede deleitarse en Dios aquel cuyos pecados no han sido perdonados, sobre quien permanece siempre la ira de Dios? ¿Puede un hombre deleitarse en un león rugiente, o en una osa despojada de sus cachorros? ¿Puede un hombre deleitarse en un fuego consumidor? ¿Puede un hombre deleitarse en una espada desnuda que busca alcanzar su mismo corazón? Sin embargo, Dios es así para ti mientras estés fuera de la gracia. ¿Cómo, entonces, puedes deleitarte en Dios? Hay un paso necesario: cree en el Señor Jesucristo, y entonces te deleitarás en el Señor. Es decir, confía en ti mismo para ser salvo por Cristo. Ve y ponte en manos de Cristo para que todos tus pecados sean borrados, y cuando hayas confiado en Cristo sabrás que tu pecado es perdonado, que estás reconciliado con Dios por la muerte de su Hijo, y podrás seguir tu camino y deleitarte en Dios, porque esta es la promesa: tu deseo te será concedido.`;

const TESORO = `Tesoro de David Por
Charles H. Spurgeon

Salmo 37

TÍTULO. Tesoros De David. Solo esta palabra indica la autoría; no se especifica si se trata de un canto o una meditación. Fue escrito por David en su vejez (Salmo 37:25), y su valor reside aún mayor por ser el testimonio de una experiencia tan diversa.
ASUNTO. El gran enigma de la prosperidad de los impíos y la aflicción de los justos, que ha desconcertado a tantos, se aborda aquí a la luz del futuro; y la inquietud y la queja quedan severamente prohibidas. Es un salmo en el que el Señor apacigua con dulzura las quejas, demasiado comunes, de su pueblo, y calma sus mentes respecto a su trato actual con su rebaño escogido y los lobos que los rodean. Contiene ocho grandes preceptos, se ilustra dos veces con relatos autobiográficos y abunda en contrastes notables.

DIVISIÓN. El Salmo difícilmente puede dividirse en secciones considerables. Se asemeja a un capítulo del libro de Proverbios, ya que la mayoría de los versículos son completos en sí mismos. Es un Salmo alfabético: en un orden algo irregular, las primeras letras de los versículos siguen el alfabeto hebreo. Esto pudo haber sido no solo una invención poética, sino también una ayuda para la memoria. Se ruega al lector que lea el Salmo completo sin comentarios antes de pasar a nuestra exposición.

EXPOSICIÓN
Versículo 1. El Salmo comienza con el primer precepto. ¡Ay!, es demasiado común que los creyentes, en sus horas de adversidad, se sientan tratados con dureza cuando ven a personas completamente desprovistas de religión y honestidad, regocijándose en abundante prosperidad. Muy necesario es el mandato: No te inquietes por los malhechores. Inquietarse es preocuparse, tener acidez, enfurecerse, enojarse. La naturaleza es muy propensa a encender un fuego de celos cuando ve a transgresores de la ley cabalgando y a súbditos obedientes caminando en el lodo: es una lección que solo se aprende en la escuela de la gracia, cuando uno llega a contemplar las providencias más paradójicas con la devota complacencia de quien está seguro de que el Señor es justo en todos sus actos. Parece difícil para los juicios carnales que la mejor carne vaya a parar a los perros, mientras los niños amados languidecen por falta de ella. Ni tengas envidia de los que hacen iniquidad. El mismo consejo bajo otra forma. Cuando uno es pobre, despreciado y atraviesa una profunda prueba, nuestro viejo Adán, naturalmente, siente envidia de los ricos y poderosos; y cuando somos conscientes de haber sido más justos que ellos, el diablo seguramente estará presente con argumentos blasfemos. La adversidad puede corromper incluso a la flor y nata de la humanidad. A los hombres malvados, en lugar de envidiarlos, debemos mirarlos con horror y aversión; sin embargo, sus mesas repletas y sus lujos ostentosos son demasiado propensos a fascinar nuestros pobres ojos entreabiertos. ¿Quién envidia al toro gordo las cintas y guirnaldas que lo adornan mientras lo llevan al matadero? Sin embargo, el caso es similar; pues los ricos impíos no son más que bestias engordadas para el sacrificio.

Versículo 2. Porque pronto serán cortados como la hierba. La guadaña de la muerte se afila. Verde crece la hierba, pero rápido viene la guadaña. La destrucción de los impíos será rápida, repentina, segura, abrumadora, irrecuperable. La hierba no puede resistir ni escapar del segador. Y se marchitará como la hierba verde. La belleza de la hierba se seca al instante con el calor del sol, y así toda la gloria de los impíos desaparecerá a la hora de la muerte. La muerte mata al impío como a la hierba, y la ira lo marchita como al heno; muere, y su nombre se pudre. ¡Qué final tan completo se le da al hombre cuyas jactancias no tenían fin! ¿Vale la pena desperdiciarnos preocupándonos por el insecto de una hora, un efímero que en el mismo día nace y muere? Dentro de los creyentes hay una semilla viva e incorruptible que vive y permanece para siempre; ¿Por qué habrían de envidiar la mera carne y su gloria, que no son sino como la hierba y su flor?

Versículo 3. Confía en el Señor. Este es el segundo precepto, apropiado para la ocasión. La fe cura la inquietud. La vista es bizca y solo ve las cosas como parecen, de ahí su envidia; la fe tiene una visión más clara para contemplar las cosas como realmente son, de ahí su paz. Y haz el bien. La verdadera fe es activamente obediente. Hacer el bien es un excelente remedio para la inquietud. Hay un gozo en la actividad santa que ahuyenta el óxido del descontento. Así habitarás en la tierra. En "la tierra" que mana leche y miel; el Canaán del pacto. No vagarás por el desierto de la murmuración, sino que morarás en la tierra prometida de contentamiento y descanso. "Nosotros, los que hemos creído, entramos en el descanso". Mucho de lo externo depende de lo interno: donde hay cielo en el corazón, habrá cielo en la casa. Y ciertamente serás alimentado, o pastoreado. A la integridad y la fe se les garantizan las necesidades. El buen pastor ejercerá su cuidado pastoral sobre todos los creyentes. En verdad serán alimentados, y alimentados con la verdad. La promesa de Dios será su banquete perpetuo; no les faltará ni lo espiritual ni lo temporal. Algunos interpretan esto como una exhortación: «Aliméntense de la verdad». Ciertamente, esto es un buen consuelo y destierra para siempre la envidia que consume el corazón.

Versículo 4. Hay un ascenso en este tercer precepto. A quien primero se le ordenó no inquietarse, luego se le mandó confiar activamente, y ahora se le dice con santo deseo que se deleite en Dios. Deléitate también en el Señor. Haz de Jehová el gozo y la alegría de tu espíritu. Los hombres malvados se deleitan en objetos carnales; no los envidies si se les permite saciarse con tales ídolos vanos; busca tú tu mejor deleite y llénate por completo con tu porción más sublime. En cierto sentido, imita a los malvados; ellos se deleitan en su porción; procura deleitarte en la tuya, y así, lejos de envidiarlos, los compadecerás. No hay lugar para la inquietud si recordamos que Dios es nuestro, sino que hay todo incentivo para el gozo sagrado del tipo más elevado y extático. Cada nombre, atributo, palabra u obra de Jehová debe deleitarnos, y al meditar en ello, nuestra alma debe regocijarse como el epicúreo que se alimenta con delicadeza y profundo gusto por sus manjares. Y él te concederá los deseos de tu corazón. Un deber placentero se ve recompensado aquí con otro placer. Quienes se deleitan en Dios no desean ni piden nada más que lo que agrada a Dios; por lo tanto, es seguro darles carta blanca. Su voluntad está sometida a la voluntad de Dios, y ahora pueden tener lo que deseen. Aquí se refiere a nuestros deseos más íntimos, no a nuestros anhelos casuales; hay muchas cosas que la naturaleza podría desear que la gracia jamás nos permitiría pedir; estos deseos profundos, de oración y súplica , son aquellos a los que se hace la promesa.

Versículo 5. Encomienda tu camino al Señor. Deposita toda la carga de tu vida en el Señor. Deja en manos de Jehová no solo tu inquietud presente, sino todas tus preocupaciones; de hecho, somete a él todo el rumbo de tu vida. Desecha la ansiedad, renuncia a tu voluntad, somete tu juicio, déjalo todo en manos del Dios de todos. ¡Qué remedio tan eficaz es este para expulsar la envidia! ¡Qué gran logro indica este cuarto precepto! ¡Cuán bienaventurado debe ser aquel que vive cada día en obediencia a él! Confía también en él, y él lo hará realidad. Nuestro destino se cumplirá con gozo si confiamos plenamente en nuestro Señor. Podemos cantar con serenidad:

"Tu camino, no el mío, oh Señor,
por oscuro que sea;
guíame con tu diestra,
escoge para mí el camino."

"Suave o áspero,
seguirá siendo lo mejor;
sinuoso o recto, no importa,
me lleva a tu descanso."

"No me atrevo a elegir mi destino,
ni lo haría aunque pudiera;
pero elígeme tú por mí, oh Dios mío,
y así caminaré por el camino recto."

"Toma mi copa y llénala
con alegría o tristeza; elige lo bueno y lo malo
según te parezca mejor ."

El labrador siembra y ara, y luego deja la cosecha en manos de Dios. ¿Qué más puede hacer? No puede cubrir los cielos con nubes, ni ordenar la lluvia, ni hacer brotar el sol, ni crear el rocío. Hace bien en dejarlo todo en manos de Dios; y así, para todos nosotros, la mayor sabiduría, habiendo confiado obedientemente en Dios, es dejar los resultados en sus manos y esperar un fruto bendito.

Versículo 6. Y él hará resplandecer tu justicia como la luz. En materia de reputación personal, podemos contentarnos especialmente con guardar silencio y dejar nuestra vindicación en manos del Juez de toda la tierra. Cuanto más nos preocupemos en este caso, peor para nosotros. Nuestra fortaleza reside en la quietud. El Señor limpiará al calumniado. Si velamos por su honor, él velará por el nuestro. Es maravilloso cómo, cuando la fe aprende a soportar la calumnia con serenidad, la inmundicia no la contamina, sino que se desprende como bolas de nieve de un muro de granito. Incluso en los peores casos, donde un buen nombre se ve oscurecido por un tiempo, la Providencia enviará un claro como la luz del amanecer, que aumentará hasta que el hombre una vez censurado sea universalmente admirado. Y tu juicio como el mediodía. No quedará sombra de reproche. El hombre estará en su máximo esplendor. La oscuridad de su dolor y su mala reputación huirán.

Versículo 7. Descansa en el Señor. Este quinto precepto es divino y requiere mucha gracia para llevarlo a cabo. Aquietar el espíritu, guardar silencio ante el Señor, esperar con santa paciencia el tiempo para resolver las dificultades de la Providencia: eso es a lo que todo corazón piadoso debería aspirar. «Aarón guardó silencio»: «No abrí mi boca, porque tú lo hiciste». Una lengua callada, en muchos casos, no solo muestra sabiduría, sino también un corazón santo. Y espéralo con paciencia. El tiempo no es nada para él; que no sea nada para ti. Vale la pena esperar por Dios. «Nunca llega antes de tiempo, nunca llega demasiado tarde». En una historia, esperamos el final para aclarar la trama; no debemos prejuzgar el gran drama de la vida, sino quedarnos hasta la escena final y ver a qué final llega todo. No te inquietes por el que prospera en su camino, por el hombre que lleva a cabo planes malvados. No hay bien, sino mucho mal, en preocuparse por el éxito actual de los conspiradores sin escrúpulos: no se dejen llevar por juicios prematuros, pues deshonran a Dios y los agotan. Decidan, aunque los malvados triunfen, tratar el asunto con indiferencia y jamás permitir que se cuestione la justicia y la bondad del Señor. ¿Qué importa si los planes malvados triunfan y los suyos fracasan? Hay más amor de Dios en sus derrotas que en los éxitos de los malvados.

Versículo 8. Deja de enojarte y abandona la ira. Especialmente la ira contra los designios de la Providencia y los celos por los placeres pasajeros de aquellos que pronto serán desterrados de todo consuelo. La ira en cualquier lugar es locura, aquí agrava la demencia. Sin embargo, puesto que la ira intentará acompañarnos, debemos abandonarla resueltamente. No te inquietes de ninguna manera para hacer el mal. Bajo ninguna circunstancia ni por ningún motivo te dejes llevar por tal camino. La irritabilidad está al borde del gran pecado. Muchos que se han dejado llevar por la murmuración han llegado a pecar para obtener sus supuestos derechos. Cuidado con criticar a los demás, esfuérzate por ser hallado en el camino correcto; y así como temerías el pecado externo, tiembla ante la queja interna.

Versículo 9. Porque los malhechores serán exterminados. Su muerte será un castigo ejemplar; no un traslado a un estado mejor, sino una ejecución en la que se aplicará la justicia. Pero aquellos que esperan en el Señor —aquellos que con fe paciente esperan su porción en la otra vida— heredarán la tierra. Incluso en esta vida disfrutan plenamente, y en los siglos venideros serán suyos la gloria y el triunfo. La pasión, según la parábola de Bunyan, obtiene sus bienes primero, y estos se acaban pronto; la paciencia obtiene sus bienes al final, y estos duran para siempre.

Versículo 10. Porque dentro de poco, el impío ya no existirá. Cuando los malvados alcanzan la grandeza, los juicios de Dios a menudo los arrasan; sus riquezas se derriten, su poder se desvanece, su felicidad se convierte en miseria; ellos mismos dejan de ser contados entre los vivos. La brevedad de la vida nos hace ver que el brillo de los grandes impíos no es oro verdadero. Oh, por qué, creyente probado, ¿envidias a aquel que dentro de poco yacerá más bajo que el polvo? Sí, debes considerar diligentemente su lugar, y no existirá. Su casa estará vacía, su cargo vacante, su propiedad sin dueño; será completamente borrado, tal vez aniquilado por su propia depravación, o llevado a un lecho de muerte de penuria por su propia extravagancia. Desaparecido como una nube pasajera, olvidado como un sueño, ¿dónde están sus jactancias y prepotencias, y dónde la pompa que hacía que los pobres mortales pensaran que el pecador era bienaventurado?

Versículo 11. Pero los mansos heredarán la tierra. Por encima de todos los demás, disfrutarán de la vida. Aunque sufran, sus consuelos superarán sus tribulaciones. Heredar la tierra significa obtener los privilegios del pacto y la salvación de Dios. Quienes sean verdaderamente humildes tomarán su lugar con el resto de los herederos de la gracia, a quienes les corresponde todo bien por derecho de nacimiento. Y se deleitarán en la abundancia de paz. La paz aman y la paz tendrán. Si no encuentran abundancia de oro, la abundancia de paz les será mucho más útil. Otros encuentran alegría en la discordia, y de ahí surge su miseria a su debido tiempo; pero la paz conduce a la paz, y cuanto más la ame un hombre, más le llegará. En el período de paz de los últimos días, cuando la paz universal alegre la tierra, el significado profético completo de palabras como estas se hará evidente.

Versículos 12-15. He aquí el retrato de un opresor orgulloso, armado hasta los dientes.

Versículo 12. El impío trama contra el justo. ¿Por qué no puede dejar en paz al hombre bueno? Porque hay enemistad entre la descendencia de la serpiente y la descendencia de la mujer. ¿Por qué no atacarlo con justicia? ¿Por qué conspirar y maquinar? Porque es propio de la naturaleza de la serpiente ser muy astuta. La navegación tranquila no les conviene a quienes están a bordo del "Apolión". Y rechinaba los dientes contra él. Los impíos muestran con sus gestos lo que harían si pudieran; si no pueden roer, rechinarán los dientes; si no pueden morder, al menos ladrarán. Esto es precisamente lo que el mundo sin gracia hizo con "aquel justo", el Príncipe de Paz. Sin embargo, él no se vengó de ellos, sino que, como un cordero silencioso, recibió las ofensas con paciencia.

Versículo 13. El Señor se reirá de él. El hombre piadoso no necesita preocuparse, sino dejar que el Señor se encargue de la merecida venganza, pues se burlará por completo de la malicia de los enemigos del hombre bueno. Que el orgulloso burlón rechinara los dientes y echara espuma por la boca; tendrá que enfrentarse a alguien que lo mirará con sereno desdén, a él y a sus delirios. Porque ve que su día se acerca. El hombre malvado no ve cuán cerca está su destrucción; se jacta de aplastar a otros cuando el pie de la justicia ya se alza para pisotearlo como el fango de las calles. ¡Pecadores, en manos de un Dios airado, y aun así conspirando contra sus hijos! ¡Pobres almas, que corren así hacia la punta de la lanza de Jehová!

Versículo 14. Los malvados han desenvainado la espada. Extienden su arma fuera de la vaina y esperan el momento oportuno para usarla. Y han tensado su arco. Un arma no les basta, llevan otra lista para la acción. Llevan un arco tan fuerte que lo han pisoteado para tensarlo; no perderán nada por falta de fuerza o preparación. Para derribar a los pobres y necesitados. Estos son su presa, los objetos de su maldita malicia. Estos cobardes no atacan a sus iguales, sino que buscan a aquellos excelentes que, por la gentileza de sus espíritus y la pobreza de sus bienes, no pueden defenderse. Observen cómo nuestro manso y humilde Señor fue asediado por crueles enemigos, armados con toda clase de armas para matarlo. Y para matar a aquellos de conducta recta. Nada menos que el derrocamiento y la muerte de los justos contentará a los malvados. Los sinceros y honestos son odiados por los astutos intrigantes que se deleitan en la injusticia. Contemplad, pues, a los enemigos de los piadosos, doblemente armados, y aprended cuán ciertas eran las palabras de nuestro Señor: «Si fuerais del mundo, el mundo amaría lo suyo; pero como no sois de este mundo, sino que yo os he escogido de entre el mundo, por eso el mundo os odia».

Versículo 15. Su espada entrará en su propio corazón. Como Amán, serán colgados en la horca que ellos mismos construyeron para Mardoqueo. Cientos de veces ha sucedido esto. Saúl, que intentó matar a David, cayó sobre su propia espada; y el arco, su arma predilecta, cuyo uso enseñó a los hijos de Israel, no pudo salvarlo en Gilboa. Y sus arcos se romperán. Sus invenciones malvadas quedarán inservibles. La malicia se engaña a sí misma. Bebe la copa envenenada que preparó para otro, y se quema en el fuego que encendió para su prójimo. ¿Por qué debemos preocuparnos por la prosperidad de los impíos cuando se arruinan con tanta diligencia mientras creen que perjudican a los santos? Los siguientes nueve versículos describen principalmente el carácter y la bienaventuranza de los piadosos, y la luz se revela con algunos toques oscuros que describen a los impíos y su condena.

Versículo 16. Lo poco que tiene un hombre justo es mejor que las riquezas de muchos impíos. Este es un buen proverbio. Lo poco de un hombre bueno se contrasta con las riquezas de muchos impíos, y así la expresión se vuelve más contundente. Hay más felicidad en la cena piadosa de hierbas que en el buey estancado de los alborotadores profanos. En el original hay una alusión al ruido de una multitud, como para insinuar el tumulto y el bullicio de la riqueza desenfrenada, y para contrastarlo con la tranquilidad de la porción más humilde de los piadosos. Preferiríamos pasar hambre con Juan que festejar con Herodes; mejor alimentarnos con escasos alimentos con los profetas en la cueva de Abdías que alocarnos con los sacerdotes de Baal. La felicidad de un hombre no consiste en los montones de oro que tiene almacenados. El contentamiento encuentra multum en parvo, mientras que para un corazón perverso el mundo entero es demasiado poco.

Versículo 17. Porque los brazos de los impíos serán quebrados. Su poder para hacer el mal será efectivamente anulado, pues los brazos que alzaron contra Dios serán aplastados hasta el hueso. Dios a menudo hace que los hombres implacables sean incapaces. ¡Qué espectáculo más despreciable que la malicia desdentada, la malevolencia sin armas! Pero el Señor sostiene a los justos. Su causa y su camino estarán seguros, pues están bien protegidos. La espada de dos filos hiere a los impíos y defiende a los justos.

Versículo 18. El Señor conoce los días de los justos. Su presciencia lo hizo reír de los orgullosos, pero en el caso de los justos ve un futuro más brillante y los trata como herederos de la salvación. Este es siempre nuestro consuelo: que Dios conoce todos los acontecimientos y que nada en nuestro futuro puede tomarlo por sorpresa. Ninguna flecha puede herirnos por accidente, ningún peligro puede atacarnos sigilosamente; ni en el tiempo ni en la eternidad puede ocurrirnos ningún mal imprevisto. El futuro será solo un desarrollo continuo de las cosas buenas que el Señor ha reservado para nosotros. Y su herencia será para siempre. Su herencia no se desvanece. Está garantizada, de modo que nadie puede privarlos de ella, y preservada, de modo que nadie la destruirá. La eternidad es el atributo peculiar de la porción del creyente: lo que tienen en la tierra está bastante seguro, pero lo que tendrán en el cielo es suyo sin fin.

Versículo 19. No se avergonzarán en tiempos difíciles. Vendrán calamidades, pero también liberaciones. Como los justos nunca contaron con inmunidad ante las dificultades, no se decepcionarán cuando les toque afrontarlas, sino que se encomendarán de nuevo a su Dios y demostrarán una vez más su fidelidad y amor. Dios no es amigo solo en los buenos tiempos, sino un amigo de verdad y un amigo en la necesidad. Y en los días de hambre serán saciados. Su tinaja de harina y su vasija de aceite les durarán el día de la angustia, y si los cuervos no les traen pan y carne, su sustento llegará de otra manera, pues su pan les será dado. Nuestro Señor se apoyó en esto cuando tuvo hambre en el desierto, y por la fe rechazó al tentador; nosotros también podemos ser capacitados para no inquietarnos de ninguna manera para hacer el mal por la misma consideración. Si la providencia de Dios es nuestra herencia, no necesitamos preocuparnos por el precio del trigo. El moho, el tizón y la podredumbre están en manos del Señor. La incredulidad no puede salvar ni una sola espiga de ser quemada, pero la fe, si bien no puede preservar la cosecha, puede hacer algo mejor: preservar nuestra alegría en el Señor.

Versículo 20. Pero los impíos perecerán. Cualquiera que sea la luz fantasmal que pueda burlarse de su presente, su futuro es negro con una noche oscura y densa. Se ha dictado sentencia contra ellos, están reservados para la ejecución. Que hagan alarde de su escarlata y lino fino, y que se den banquetes suntuosos cada día; la espada de Damocles está sobre sus cabezas, y si su ingenio estuviera un poco más despierto, su alegría se convertiría en miseria. Los enemigos del Señor serán como la grasa de los corderos. Así como la grasa del sacrificio se consumió por completo en el altar, así los impíos desaparecerán por completo del lugar de su honor y orgullo. ¿Cómo puede ser de otra manera? Si la paja se atreve a competir con la llama, ¿qué fin puede esperar? Se consumirán. Como leña seca, como montones de hojas, como brasas ardientes, pronto desaparecerán, y desaparecerán por completo, porque se consumirán en humo. Sic transit gloria mundi. Una bocanada es el fin de toda su fanfarronería. Su furia se desvanece en humo. Se engordaron y perecieron en su propia grasa. Intentaron ser consumidores del bien, y serán consumidos.

Versículo 21. El impío pide prestado y no paga. En parte porque no quiere, pero principalmente porque no puede. La necesidad sigue al derroche, y la deuda queda impaga. A menudo, los impíos se empobrecen así en esta vida. Su extravagancia desenfrenada los lleva a la puerta del usurero y al pleito del deudor. Pero el justo muestra misericordia y da; la misericordia le ha sido concedida, y por lo tanto da con misericordia. Es generoso y próspero. No es un deudor, sino un dador. En la medida en que el hombre bueno puede hacerlo, escucha las peticiones de necesidad, y en lugar de empobrecerse por lo que da, se enriquece y puede hacer más. No da para fomentar la ociosidad, sino por verdadera misericordia, que presupone una necesidad real. El texto nos sugiere que, en general, es mucho mejor dar que prestar. Por lo general, prestar termina por dar, y conviene anticiparse a ello y, con un poco de generosidad, evitar lo inevitable. Si estas dos frases describen a los malvados y a los justos, el autor de estas líneas tiene motivos para saber que en Londres y sus alrededores los malvados son muy numerosos.

Versículo 22. Porque los que son bendecidos por él heredarán la tierra. La bendición de Dios es, después de todo, verdadera riqueza. La verdadera felicidad, la que el pacto asegura a todos los elegidos del cielo, reside en el favor divino. Y los que son maldecidos por él serán exterminados. Su ceño fruncido es muerte; más aún, es el infierno.

Versículo 23. Los pasos del hombre bueno son guiados por el Señor. Toda su vida está ordenada con gracia, y en amorosa bondad todo es fijado, establecido y sostenido. Ningún destino imprudente ni azar voluble nos gobierna; cada uno de nuestros pasos está sujeto al decreto divino. Él se deleita en su camino. Así como los padres se complacen con los primeros pasos vacilantes de sus bebés, todo lo que concierne a un santo interesa a su Padre celestial. Dios ama contemplar los santos esfuerzos de un alma que se eleva hacia el cielo. En las pruebas y las alegrías de los fieles, Jesús tiene comunión con ellos y se deleita en ser su compañero compasivo.

Versículo 24. Aunque caiga. Los desastres y los reveses pueden derribarlo; puede, como Job, ser despojado de todo; como José, ser encarcelado; como Jonás, ser arrojado al abismo. No será completamente derribado. No estará totalmente postrado. Será puesto de rodillas, pero no sobre su rostro; o, si queda tendido por un momento, se levantará de nuevo en poco tiempo. Ningún santo caerá de forma definitiva o fatal. El dolor puede llevarnos a la tierra, y la muerte puede llevarnos a la tumba, pero no podemos caer más bajo, y de lo más bajo de todo nos elevaremos a lo más alto de todo. Porque el Señor lo sostiene con su mano. Con condescendencia, con su propia mano, Dios sostiene a sus santos; no los deja a mera voluntad delegada, sino que les brinda asistencia personal. Incluso en nuestras caídas, el Señor nos da una medida de sostén. Donde la gracia no impide caer, nos libra de mantenernos caídos. Job finalmente tuvo el doble de riqueza, José reinó sobre Egipto y Jonás llegó a salvo a su destino. No es que los santos sean fuertes, sabios o meritorios, por lo que se levantan después de cada caída, sino porque Dios es su ayudador y, por lo tanto, nadie puede vencerlos.

Versículo 25. Esta fue la observación de David: « He sido joven, y ahora soy viejo; sin embargo, no he visto al justo desamparado, ni a su descendencia mendigando pan». No es una observación que yo mismo haya hecho, pues he ayudado a los hijos de hombres indudablemente buenos, que me han pedido limosna como mendigos comunes. Pero esto no pone en duda la observación de David. Él vivía bajo una doctrina más externa y más mundana que la actual regla de la fe personal. Jamás se desampara al justo; esa es una regla sin excepción. Rara vez, en efecto, su descendencia mendiga pan; y aunque ocurre ocasionalmente, por disipación, ociosidad u otras causas por parte de sus hijos, sin duda es algo tan raro que hay muchos vivos que nunca lo han visto. Vayan a la iglesia y vean cuán pocos son los hijos de padres piadosos; entren a la cárcel y vean cuán aún más raro es el caso. Los hijos de pastores pobres a menudo se enriquecen. No soy viejo, pero he visto a familias de pobres piadosos enriquecerse y he visto al Señor recompensar la fidelidad del padre con el éxito del hijo, por lo que a menudo he pensado que la mejor manera de dotar de riqueza a la descendencia es empobrecerse por amor a Cristo. En la misión india de la Sociedad Misionera Bautista, esto se ilustra abundantemente.

Versículo 26. Él es siempre misericordioso y presta. Los justos están constantemente bajo impulsos generosos; no prosperan por la tacañería, sino por la generosidad. Como el generoso dador de todo bien, de quien son hijos amados, se deleitan en hacer el bien. Cómo los tacaños y codiciosos pueden esperar la salvación es una maravilla para quienes leen versículos como este en la Biblia. Y su descendencia es bendita. Dios recompensa con creces en la siguiente generación. Si los hijos de los justos no son piadosos, debe haber alguna razón para ello en la negligencia de los padres o alguna otra causa culpable. El amigo del padre es el amigo de la familia. El Dios de Abraham es el Dios de Isaac y de Jacob.

Versículos 27-29. Aquí tenemos el séptimo precepto, que toma una forma negativa y positiva, y es la quintaesencia de todo el Salmo.

Versículo 27. Apártate del mal y haz el bien. No debemos envidiar a los malhechores, sino apartarnos por completo de su espíritu y ejemplo. Así como Lot abandonó Sodoma sin mirar atrás, así debemos abandonar el pecado. No hay tregua ni tregua con el pecado; debemos apartarnos de él sin vacilar y ponernos a trabajar en la dirección opuesta. Quien descuida hacer el bien pronto caerá en el mal y morará en él para siempre. Obtendrás una herencia duradera y tranquila. Las ganancias y los placeres del mal son efímeros, pero las recompensas de la gracia son eternas.

Versículo 28. Porque el Señor ama la justicia. Otorgar honor a quien honor se debe es el deleite de Dios, especialmente cuando el hombre justo ha sido calumniado por sus semejantes. Debe ser un placer divino corregir las injusticias y frustrar las maquinaciones de los injustos. El gran Árbitro de los destinos humanos seguramente impartirá justicia tanto a ricos como a pobres, a buenos y malos, porque tal juicio es su deleite. Y no abandona a sus santos. Esto no sería correcto y, por lo tanto, jamás se hará. Dios es tan fiel a los objetos de su amor como justo con toda la humanidad. Ellos son preservados para siempre. Mediante los compromisos del pacto se asegura su seguridad, y mediante el cumplimiento de las garantías se logra esa seguridad; pase lo que pase, los santos son preservados en Cristo Jesús, y porque él vive, ellos también vivirán. Un rey no perderá sus joyas, ni Jehová perderá a su pueblo. Así como el maná en la olla de oro, que de otro modo se habría derretido, se conservó en el arca del pacto bajo el propiciatorio, así los fieles serán preservados en el pacto por el poder de Jesús, su propiciación. Pero la descendencia de los impíos será exterminada. Como la casa de Jeroboam y Acab, de la cual no quedó ni un perro. El honor y la riqueza mal habida rara vez llegan a la tercera generación; la maldición madura antes de que pasen muchos años y cae sobre la casa malvada. Entre los legados de los impíos, el más seguro es el juicio sobre su familia.

Versículo 29. Los justos heredarán la tierra. Como herederos con Jesucristo, la Canaán celestial, que es el antitipo de «la tierra», será suya con toda la bendición del pacto. Y morarán en ella para siempre. Las posesiones varían, pero ninguna se compara con la posesión que los creyentes tienen del cielo. El paraíso les pertenece para siempre por herencia, y vivirán eternamente para disfrutarlo. ¿Quién no sería santo en tales condiciones? ¿Quién se preocuparía por los tesoros efímeros de los impíos?

Versículo 30. La boca del justo habla sabiduría. Dado que todo el Salmo está dedicado a describir los diferentes destinos de los justos y los impíos, era apropiado ofrecer una prueba para conocerlos. La lengua de un hombre no es un mal indicador de su carácter. La boca delata el corazón. Los hombres buenos, por regla general, hablan lo que es edificante, un lenguaje sano, una conversación religiosa, coherente con la iluminación divina que han recibido. La justicia es sabiduría en acción; por lo tanto, todos los hombres buenos son prácticamente sabios, y bien puede ser sabia su palabra. Su lengua habla de juicio. Aboga por la justicia, da un veredicto honesto sobre las cosas y los hombres, y predice que los juicios de Dios caerán sobre los impíos, como en los días pasados. Su conversación no es ni necia ni obscena, ni insustancial ni profana. Nuestra conversación tiene mucha más importancia de la que algunos imaginan.

Versículo 31. La ley de su Dios está en su corazón; ninguno de sus pasos resbalará. Lo mejor en el mejor lugar, produciendo los mejores resultados. Bien podía ser admirable la palabra de aquel hombre cuando su corazón estaba tan lleno de rectitud. Amar la santidad, tener los motivos y deseos santificados, ser obediente al Señor en lo más profundo de nuestro ser: este es el método más seguro para que toda nuestra vida sea eficiente para sus grandes propósitos, e incluso para asegurar los detalles, evitando cualquier error grave. Mantener la constancia en el propio camino, en tiempos como estos, solo se concede a aquellos cuyos corazones son íntegros con Dios, quienes pueden, como en el texto, llamar a Dios su Dios. La política se resbala y tropieza, se desvía y cambia de rumbo, y al final sale perdiendo, pero la sinceridad persevera en su camino recto y alcanza la meta.

Versículo 32. El impío acecha al justo y busca matarlo. Si no fuera por las leyes del país, pronto veríamos una masacre de justos. Jesús era acechado por sus enemigos, sedientos de su sangre; sus discípulos no debían buscar favor donde su Maestro encontró odio y muerte.

Versículo 33. El Señor no lo dejará en sus manos. Dios a menudo se manifiesta para liberar a sus siervos, y cuando no lo hace en esta vida respecto a sus cuerpos, les da a sus almas tal gozo y paz que se elevan triunfantes más allá del poder de sus verdugos. Podemos estar en manos del enemigo por un tiempo, como Job, pero no podemos ser abandonados allí. Ni condenarlo cuando sea juzgado. El tiempo revertirá el veredicto de la prisa, o bien la eternidad eliminará la condenación del tiempo. A su debido tiempo, los justos serán justificados. Las injusticias temporales se toleran, en el orden de la Providencia, para propósitos muy sabios; pero lo amargo no siempre será llamado dulce, ni la luz será para siempre calumniada como oscuridad; lo correcto aparecerá a su debido tiempo; lo ficticio y lo pretencioso serán desenmascarados, y lo real y verdadero será revelado. Si hemos obrado con fidelidad, podemos apelar desde las pequeñas sesiones de la sociedad hasta el solemne juicio del gran día.

Versículo 34. Espera en el Señor. Aquí tenemos el octavo precepto, y es una eminencia elevada a la que aspirar. Espera el tiempo del Señor. Espera en obediencia como un siervo, en esperanza como un heredero, en expectativa como un creyente. Esta pequeña palabra, "espera", es fácil de decir, pero difícil de llevar a cabo, sin embargo, la fe debe hacerlo. Y sigue su camino. Continúa por el camino angosto; que ninguna prisa por riquezas o comodidad cause acciones impías. Que tu lema sea: "Sigue, sigue, sigue". Nunca desfallezcas, ni sueñes con desviarte. "El que persevere hasta el fin, ese será salvo". Y él te exaltará para heredar la tierra. Tendrás todo el bien terrenal que es verdaderamente bueno, y del bien celestial no habrá escasez. La exaltación será la suerte de los excelentes. Cuando los impíos sean exterminados, lo verás. ¡ Qué visión tan terrible y tan instructiva! ¡Qué reprensión para la irritabilidad! ¡Qué incentivo para la gratitud! Alma mía, quédate quieta, mientras prevés el final, el terrible final de los enemigos del Señor.

Versículo 35. Por segunda vez, David recurre a su diario y, esta vez, con imágenes poéticas, nos cuenta lo que había observado. Sería bueno que nosotros también tomáramos nota de las providencias divinas. He visto al impío en gran poder. El hombre era terrible para los demás, gobernaba con mucha autoridad y manejaba las cosas con mano dura, un César en poder, un Creso en riqueza. Y se extendía como un laurel verde. Añadiendo casa a casa y campo a campo, elevándose cada vez más en el estado. Parecía siempre verde como un laurel, crecía como un árbol en su propia tierra natal, de la que nunca había sido trasplantado. No se refiere aquí a ningún árbol en particular, un haya extendida o un roble ancho y frondoso pueden servirnos para comprender la imagen; es algo de la tierra, cuyas raíces están en el barro; sus honores son hojas que se marchitan; y aunque su sombra empequeñece a las plantas que están condenadas a languidecer bajo ella, sin embargo, es en sí mismo algo moribundo, como lo demostrará el hacha del leñador. En el noble árbol, que se proclama rey del bosque, contempla hoy la grandeza de lo impío; espera un momento y maravíllate ante el cambio, mientras la madera es llevada y la raíz misma arrancada de la tierra.

Versículo 36. Sin embargo, falleció. El árbol y el hombre se fueron, el hijo del hombre tan seguro como el hijo del bosque. ¡Qué barrido hace la muerte! Y he aquí que no estaba. Para sorpresa de todos, el gran hombre se había ido, sus propiedades vendidas, su negocio en quiebra, su casa enajenada, su nombre olvidado, y todo en unos pocos meses. Sí, lo busqué, pero no pude encontrarlo. Movidos por la curiosidad, si preguntamos por los impíos, no han dejado rastro; como aves de mal agüero, nadie desea recordarlos. Algunos de los más humildes de los piadosos son inmortalizados, sus nombres son imperecederamente fragantes en la iglesia, mientras que de los más capaces de infieles y blasfemos apenas se recuerdan sus nombres más allá de unos pocos años. Los hombres que estaban en boca de todos ayer son olvidados mañana, pues solo la virtud es inmortal.

Versículo 37. Fíjense en el hombre perfecto y contemplen al justo. Después de haber visto con asombro la caída de los impíos, presten atención al hombre sinceramente piadoso y observen el bendito contraste. Los hombres buenos son dignos de admiración y merecen nuestro estudio. Los hombres justos son maravillas de gracia y merecen ser contemplados. Porque el fin de ese hombre es la paz. El hombre de paz tiene un fin de paz. La paz sin fin llega al final para el hombre de Dios. Su camino puede ser arduo, pero conduce a casa. Con los creyentes puede llover por la mañana, truenar al mediodía y diluviar por la tarde, pero debe despejarse antes de que se ponga el sol. La guerra puede durar hasta nuestra última hora, pero entonces oiremos lo último de ella.

Versículo 38. Pero los transgresores serán destruidos juntos. Una ruina común aguarda a los que se unen en una misma rebelión. El fin de los impíos será truncado. Su tiempo será acortado, su felicidad se acabará, sus esperanzas se desvanecerán para siempre, su ejecución se apresurará. Su presente se acorta por sus pecados; no vivirán ni la mitad de sus días. No tienen futuro que valga la pena, mientras que los justos consideran su futuro como su verdadera herencia.

Versículo 39. Pero la salvación de los justos es del Señor. Esta es una sana doctrina. La esencia misma del evangelio de la gracia gratuita. Por salvación se entiende liberación de todo tipo; no solo la salvación que finalmente nos lleva a la gloria, sino también todos los rescates menores del camino; todos estos se deben atribuir al Señor, y solo a él. Que la gloria sea para él por medio de aquellos a quienes concede la salvación. Él es su fortaleza en tiempos de tribulación. Mientras que la tribulación derriba a los impíos, solo impulsa a los justos hacia su poderoso Ayudador, quien se regocija al sostenerlos.

Versículo 40. Y el Señor los ayudará. En todo tiempo futuro, Jehová defenderá a sus escogidos. Nuestro Gran Aliado desplegará sus fuerzas en el fragor de la batalla. Los librará de los impíos. Así como rescató a Daniel de los leones, así preservará a sus amados de sus enemigos; por lo tanto, no deben preocuparse ni desanimarse. Y los salvará, porque confían en él. La fe les asegurará la seguridad de los elegidos. Es la marca de las ovejas por la cual serán separadas de las cabras. No su mérito, sino su fe, los distinguirá. ¿Quién no querría probar el camino de la fe? Quien verdaderamente cree en Dios ya no se inquietará por las aparentes irregularidades de esta vida presente, sino que descansará seguro de que lo misterioso es, sin embargo, justo, y lo que parece difícil, sin duda, está ordenado por la misericordia. Así termina el Salmo con una nota que es el toque de difuntos de la impía inquietud con la que comenzó el Salmo. Dichosos aquellos que pueden así cantar para salir de malas condiciones y alcanzar condiciones de gracia.`;

const ESPADA = `LA ESPADA DEL ESPÍRITU

Charles H. Spurgeon
Sermón n.º 2201 | Púlpito del Tabernáculo Metropolitano | Volumen 37

Predicado la mañana del día del Señor, 19 de abril de 1891,
en el Tabernáculo Metropolitano, Newington.

«Tomad la espada del Espíritu, que es la palabra de Dios».
Efesios 6:17.

Ser cristiano es ser guerrero. El buen soldado de Jesucristo no debe esperar encontrar comodidad en este mundo: es un campo de batalla. Tampoco debe contar con la amistad del mundo, porque eso sería enemistad contra Dios. Su ocupación es la guerra. Mientras se reviste, pieza por pieza, de la armadura que se le ha provisto, bien puede decirse: «Esto me advierte del peligro; esto me prepara para la guerra; esto anuncia oposición».

Encontramos dificultades incluso para mantenernos firmes, pues el apóstol, dos o tres veces, nos manda: «Estad firmes». En el ímpetu de la lucha, los hombres pueden perder fácilmente el equilibrio. Si logran mantenerse en pie, saldrán victoriosos; pero si el empuje de sus adversarios los derriba, todo estará perdido. Debéis revestiros de la armadura celestial para poder estar firmes, y la necesitaréis para conservar la posición en la que vuestro Capitán os ha colocado. Si aun mantenerse firme exige tanto cuidado, ¡juzgad cómo será la guerra! El apóstol habla también de resistir, además de estar firmes. No hemos de limitarnos a defendernos; también debemos atacar. No basta con que no seáis vencidos: tenéis que vencer. Por eso vemos que debemos tomar no solo un yelmo que proteja la cabeza, sino también una espada con la cual hostigar al enemigo. El nuestro es, por tanto, un duro conflicto: mantenernos firmes y resistir. Necesitaremos toda la armadura del arsenal divino y toda la fuerza del poderoso Dios de Jacob.

Nuestro texto deja claro que nuestra defensa y nuestra victoria deben obtenerse combatiendo de verdad. Muchos intentan llegar a un acuerdo, pero si eres un verdadero cristiano, nunca podrás desempeñar bien ese oficio. El lenguaje del engaño no conviene a una lengua santa. El adversario es el padre de la mentira, y quienes están con él entienden el arte de las ambigüedades; pero los santos lo aborrecen. Si discutimos condiciones de paz e intentamos ganar algo mediante maniobras diplomáticas, habremos emprendido un camino del cual volveremos avergonzados. Nuestro Capitán no nos ha ordenado improvisar una tregua y conseguir las mejores condiciones posibles. No hemos sido enviados a ofrecer concesiones. Se dice que, si cedemos un poco, quizá el mundo también ceda un poco y de ello resulte algún bien. Si no somos demasiado estrictos y estrechos, quizá el pecado acceda amablemente a ser más decoroso. Nuestra asociación con él impediría que fuera tan descarado y atroz. Si no somos de mente estrecha, nuestra doctrina amplia sería aceptada por el mundo, y los del otro bando no estarían tan ávidos de error como ahora. ¡Nada de eso! Ciertamente, esa no es la orden que ha dado nuestro Capitán. Cuando haya que hacer la paz, Él mismo la hará, o nos indicará cómo proceder para ese fin; pero, por ahora, nuestras órdenes son muy diferentes.

Tampoco podemos esperar ganar algo permaneciendo neutrales o concediendo alguna tregua ocasional. No hemos de abandonar el conflicto e intentar ser lo más agradables posible con los enemigos de nuestro Señor, frecuentando sus reuniones y probando sus manjares. Aquí no están escritas tales órdenes. Debéis empuñar vuestra arma y salir a combatir.

Tampoco debéis soñar siquiera con ganar la batalla por accidente. Nadie llegó jamás a ser santo por una afortunada casualidad. El descuido puede causar un daño inmenso, pero nadie ganó por él la batalla de la vida. Dejar que las cosas sigan su curso es permitir que nos arrastren al infierno. No tenemos órdenes de quedarnos quietos y tomar las cosas con calma. No: debemos orar siempre y velar constantemente. La única nota que resuena en el texto es esta: ¡TOMAD LA ESPADA! ¡TOMAD LA ESPADA! Ya no se trata de hablar y debatir. Ya no se trata de parlamentar y transigir. La orden que retumba como un trueno es: «Tomad la espada». La voz del Capitán suena clara como una trompeta: ¡Tomad la espada! Ningún cristiano aquí habrá obedecido nuestro texto a menos que tome la espada con firmeza clara, resuelta y decisiva, con valor y determinación. Debemos ir al cielo con la espada en la mano durante todo el camino. «TOMAD LA ESPADA». Quisiera detenerme en este mandamiento. ¡Que el Espíritu Santo me ayude!

Es digno de notarse que solo se nos proporciona un arma ofensiva, aunque hay varias piezas de armadura. El soldado romano solía llevar una lanza además de una espada. Hemos visto frecuentes representaciones del legionario haciendo guardia como centinela, y casi siempre aparece con una lanza en la mano derecha, mientras la espada cuelga a su costado. Pero Pablo, por excelentes razones, reúne nuestro armamento ofensivo en una sola arma, porque sirve para todo. Hemos de usar la espada, y únicamente la espada. Por tanto, si vais a entrar en esta lucha, prestad mucha atención a vuestra única arma. Si no habéis de tener otra, aseguraos de llevarla siempre en la mano. Que la voz del Capitán resuene en vuestros oídos: «¡Tomad la espada! ¡Tomad la espada!», y salid así al campo de batalla.

Observad, primero, que la espada que debéis tomar es la espada del Espíritu, que es la Palabra de Dios. Ese es nuestro primer punto. El segundo se encuentra igualmente a simple vista en el texto: esta espada ha de ser nuestra. Se nos ordena tomar la espada del Espíritu y, de ese modo, hacerla nuestra propia espada.

I. ES «LA ESPADA DEL ESPÍRITU»

En primer lugar, la Palabra de Dios, que ha de ser nuestra única arma, tiene un origen noble, porque ES «LA ESPADA DEL ESPÍRITU». Posee las propiedades de una espada, y esas propiedades le fueron dadas por el Espíritu de Dios.

Aquí observamos que el Espíritu Santo tiene una espada. Es silencioso como el rocío, tierno como el aceite de la unción, suave como la brisa del atardecer y pacífico como una paloma; y, sin embargo, bajo otro aspecto, empuña un arma mortal. Es el Espíritu de juicio y el Espíritu de ardor, y no lleva la espada en vano. De Él puede decirse: «El Señor es varón de guerra; Jehová es su nombre».

La Palabra de Dios en la mano del Espíritu hiere de manera terrible y hace sangrar el corazón humano. ¿No recordáis algunos de vosotros cuando esta espada os abría heridas domingo tras domingo? ¿No os hería el corazón hasta haceros enojar contra ella? Casi llegasteis a decidir que no volveríais a escuchar el evangelio. Esa espada os perseguía, penetraba en los rincones secretos de vuestra alma y os hacía sangrar por mil heridas. Finalmente, fuisteis «compungidos de corazón», lo cual es mucho mejor que sentirse «heridos en el corazón» de indignación; y entonces, verdaderamente, se llevó a cabo la ejecución. Aquella herida era mortal, y nadie sino Aquel que os había dado muerte podía haceros vivir. ¿Recordáis cómo, después de esto, vuestros pecados fueron ejecutados uno tras otro? Sus cuellos fueron puestos sobre el tajo, y el Espíritu actuó como verdugo con su espada. Después, bendito sea Dios, vuestros temores, dudas, desesperación e incredulidad también fueron despedazados por esa misma espada. La Palabra os dio vida, pero al principio fue una gran ejecutora. Bajo las primeras operaciones del Espíritu divino, cuya espada no vuelve vacía del conflicto, vuestra alma era como un campo de batalla después de una gran lucha.

Amados, el Espíritu de Dios mantiene, de generación en generación, una guerra contra el Amalec del mal y del error. No perdonará ninguno de los males que ahora contaminan a las naciones; su espada jamás reposará hasta que todos estos cananeos sean destruidos. El Espíritu Santo glorifica a Cristo no solo por lo que revela, sino también por lo que derriba. La lucha puede ser agotadora, pero continuará de siglo en siglo hasta que aparezca el Señor Jesús. El Espíritu de Dios defenderá siempre la causa del amor contra el odio, de la verdad contra el error, de la santidad contra el pecado y de Cristo contra Satanás. Ganará la batalla, y quienes estén con Él serán, por su poder, más que vencedores. El Espíritu Santo ha declarado la guerra y empuña una espada de dos filos.

El Espíritu Santo no empuña otra espada que la Palabra de Dios. Este Libro maravilloso, que contiene lo que ha salido de la boca de Dios, es la única arma que el Espíritu Santo escoge para sus propósitos de guerra. Es un arma espiritual y, por ello, apropiada para el Espíritu Santo. Las armas de su milicia no son carnales: jamás utiliza la persecución ni el patrocinio interesado, la fuerza ni el soborno, el brillo de la grandeza ni el terror del poder. Obra en los hombres mediante la Palabra, que es adecuada a su propia naturaleza espiritual y a la obra espiritual que debe realizarse. Aunque es espiritual, esta arma es «poderosa en Dios». Un golpe de la Palabra de Dios partirá el espíritu de un hombre de la cabeza a los pies: tan afilada es esta espada. Aunque, por una larga práctica del pecado, un hombre se haya revestido de una armadura aparentemente impenetrable, la Palabra del Señor cortará el hierro del norte y el acero. El Espíritu Santo puede hacer que un hombre sienta el poder divino de la Palabra sagrada en el centro mismo de su ser. Para luchar contra los espíritus humanos o contra espíritus de naturaleza infernal, no hay arma tan afilada, tan penetrante, tan capaz de dividir las coyunturas y los tuétanos, y de llegar hasta los pensamientos y las intenciones del corazón. La Palabra, en la mano del Espíritu, no produce una herida superficial: penetra en el corazón del hombre y lo hiere de tal modo que no hay curación sino por un poder sobrenatural. La conciencia herida sangrará; sus dolores la acompañarán de día y de noche. Y aunque busque mil remedios, no hay sino un bálsamo que pueda curar una herida hecha por esta terrible espada. Esta arma tiene dos filos; en realidad, todo en ella es filo, y, cualquiera que sea la dirección en que golpee, hiere y mata. La espada del Espíritu no tiene parte plana: por todas partes tiene filo de navaja. Tened cuidado de cómo la manejáis, vosotros los críticos: podría heriros aun a vosotros. Un día os cortará para vuestra destrucción, a menos que os convirtáis. Quien utiliza la Palabra en las batallas del Señor puede emplearla contra las esperanzas carnales y, acto seguido, golpear con ella los temores incrédulos. Puede herir con un filo el amor al pecado y con el otro el orgullo de la justicia propia. Esta maravillosa espada del Espíritu de Dios es, en todos los sentidos, un arma victoriosa.

La Palabra, decimos, es la única espada que utiliza el Espíritu. Sé que el Espíritu Santo utiliza sermones llenos de gracia, pero solo en la medida en que contienen la Palabra de Dios. Sé que el Espíritu Santo utiliza libros religiosos, pero únicamente en cuanto expresan la Palabra de Dios en otro lenguaje. La convicción de pecado, la conversión y el consuelo siguen siendo obrados, y únicamente, mediante la Palabra de Dios. Aprended, pues, la sabiduría de utilizar la Palabra de Dios para propósitos santos. El Espíritu tiene plena capacidad para hablar por sí mismo, aparte de la Palabra escrita. El Espíritu Santo es Dios y, por tanto, es el Espíritu supremo del universo. Toda sabiduría habita en Él. Concibió las leyes que gobiernan la naturaleza y dirigen la providencia. El Espíritu Santo es el gran maestro de los espíritus humanos: enseñó a Bezaleel y a los artesanos del desierto a trabajar el lino fino, el oro y las tallas para el tabernáculo. Todas las artes y las ciencias le son perfectamente conocidas, e infinitamente más de lo que los hombres podrán descubrir jamás. Sin embargo, no empleará estas cosas en esta santa contienda. En la defensa de su pacto no utiliza la filosofía, ni la ciencia, ni la retórica. Al luchar contra las potestades de las tinieblas, «la espada del Espíritu es la Palabra de Dios». «Escrito está» es su golpe maestro. Las palabras que Dios pronunció por medio de los santos hombres de la antigüedad e hizo registrar en las páginas sagradas son el hacha de combate y las armas de guerra de su Espíritu. Este Libro contiene la Palabra de Dios y es la Palabra de Dios; y el Espíritu Santo la considera un arma tan eficaz contra el mal que la utiliza a ella, y solo a ella, como su espada en el gran conflicto con las potestades de las tinieblas.

La Palabra es la espada del Espíritu porque Él mismo la ha hecho. No utilizará un arma de fabricación humana, para que la espada no se gloríe contra la mano que la empuña. El Espíritu Santo reveló el pensamiento de Dios a la mente de hombres santos; habló la palabra en sus corazones y, de ese modo, los hizo pensar como Él quería que pensaran y escribir lo que Él quería que escribieran, de manera que lo que dijeron y escribieron fue dicho y escrito al ser movidos por el Espíritu Santo. Bendito sea el Espíritu Santo por haberse dignado utilizar a tantos escritores y, sin embargo, seguir siendo Él mismo el verdadero Autor de esta colección de libros santos. Estamos agradecidos por Moisés, por David, por Isaías, por Pablo, por Pedro y por Juan; pero, sobre todo, por aquel Editor que lo supervisa todo, aquel Autor que está en lo más íntimo de todo el volumen sagrado: el Espíritu Santo. Bien puede un guerrero prestar atención a cómo ha sido fabricada su espada. Si un hombre hubiera hecho su propia espada, hubiera templado el metal, hubiera pasado él mismo la hoja por muchos fuegos y la hubiera trabajado hasta perfeccionarla, entonces, si fuera un artesano hábil, confiaría en su espada. Hoy en día, por regla general, el trabajo que se hace está mal hecho. El trabajo realizado por contrato suele resultar deficiente en una u otra parte; pero cuando un hombre hace una obra para sí mismo, probablemente la hará a conciencia y producirá un artículo en el que pueda confiar. El Espíritu Santo ha hecho Él mismo este Libro; cada parte lleva su inicial y su sello. Por eso posee una espada digna de su propia mano, una verdadera hoja de Jerusalén de fabricación celestial. Se deleita en utilizar un arma tan divinamente hecha, y la utiliza de manera verdaderamente gloriosa.

La Palabra de Dios también es la espada del Espíritu porque Él le da el filo. Es tan aguda y cortante porque Él está en ella. Creo en la inspiración de la Sagrada Escritura, no solo en el día en que fue escrita, sino también desde entonces y hasta el día de hoy. Sigue siendo inspirada; el Espíritu Santo sigue soplando a través de las palabras escogidas. Os dije que la espada era todo filo, pero quisiera añadir que el Espíritu Santo la hace así. No tendría filo alguno si no fuera por su presencia en ella y por su obra constante mediante ella. ¡Cuántas personas leen su Biblia y, sin embargo, no obtienen más provecho que si hubieran leído un viejo almanaque! De hecho, les resultaría más fácil mantenerse despiertos leyendo una antigua guía ferroviaria Bradshaw que un capítulo de la Escritura. Los ministros del evangelio pueden predicar la Palabra de Dios con toda sinceridad y pureza y, sin embargo, si el Espíritu de Dios no está presente, lo mismo habría dado predicar meros ensayos morales, pues ningún bien puede resultar de nuestro testimonio. El Espíritu Santo viaja en el carro de la Escritura, no en la carreta del pensamiento moderno. La Escritura es aquella arca del pacto que contiene la urna de oro con el maná y sobre la cual resplandece también la luz divina de Dios. El Espíritu de Dios obra en la Palabra, por ella, a través de ella y junto con ella; y, si nos mantenemos fieles a esa Palabra, podemos estar seguros de que el Espíritu Santo permanecerá con nosotros y hará de nuestro testimonio algo poderoso. Roguemos al bendito Espíritu que dé filo a nuestra predicación, para que no digamos mucho y logremos poco. ¡Escúchanos en esto, oh Bendito!

Es «la espada del Espíritu» porque solo Él puede enseñarnos a usarla. Joven, piensas que puedes tomar tu Biblia e ir inmediatamente a predicar de ella de manera correcta y fructífera. Has cometido un error presuntuoso. Una espada es un arma que puede herir al hombre que la blande por mera ostentación y orgullo. Nadie puede manejar correctamente la espada del Espíritu sino aquel escogido a quien Dios ordenó desde antes de la fundación del mundo y adiestró en las artes de la guerra. En esto se conoce a los elegidos de Dios: aman la Palabra de Dios, la reverencian y distinguen entre ella y las palabras humanas. Observad ahora a los corderos en el campo: puede haber mil ovejas y corderos, pero cada cordero encuentra a su propia madre. Del mismo modo, un verdadero hijo de Dios sabe adónde ir en busca de la leche que ha de alimentar su alma. Las ovejas de Cristo conocen la voz del Pastor en la Palabra, y no seguirán a un extraño, porque no conocen la voz de los extraños. El pueblo de Dios tiene discernimiento para reconocer y saborear la propia Palabra de Dios. No será extraviado por la astucia engañosa de las invenciones humanas. Los santos conocen las Escrituras por un instinto interior. La vida santa que Dios ha infundido en los creyentes por su Espíritu ama las Escrituras y aprende a utilizarlas para propósitos santos. Joven soldado, debes acudir al campo de instrucción del Espíritu Santo para convertirte en un espadachín diestro. En vano acudirás al metafísico o al lógico, porque ninguno de ellos sabe manejar un arma espiritual. En otras artes podrán ser maestros, pero en el uso sagrado de la teología divina son meros necios. En las cosas de la Palabra somos torpes hasta que ingresamos en la escuela del Espíritu Santo. Él debe tomar de las cosas de Cristo y mostrárnoslas. Debe enseñarnos a empuñar esta espada por la fe y a sostenerla mediante la vigilancia, para desviar la estocada del adversario y llevar la guerra al territorio enemigo. Bien instruido está quien puede blandir de un lado a otro esta gran espada de dos manos, abrirse paso por en medio de sus adversarios y salir vencedor al final. Aprender este arte puede llevar mucho tiempo, pero tenemos un Maestro sumamente hábil. Quienes llevamos treinta o cuarenta años en esta guerra sentimos que todavía no hemos llegado a dominar plenamente el uso de esta espada. Yo, por mi parte, sé que necesito que se me enseñe diariamente a usar esta arma misteriosa, capaz de muchísimo más de lo que hasta ahora he imaginado. Es la espada del Espíritu, adaptada al uso de un brazo todopoderoso y, por tanto, capaz de realizar mucho más de lo que pensamos. ¡Espíritu Santo, enséñanos nuevas proezas de combate con esta espada tuya!

Pero, sobre todo, es la espada del Espíritu porque Él es el gran Maestro en su uso. ¡Ojalá viniera esta mañana a mostrarnos cómo puede dar estocadas y hendir con ella! En esta casa de oración lo hemos visto obrar a menudo. Aquí han sido muchos los muertos por el Señor. Hemos visto cómo esta espada cortaba la cabeza de muchas dudas semejantes a Goliat y aniquilaba una multitud de preocupaciones e incredulidades. Hemos visto al Espíritu amontonar a los caídos cuando ha salido la Palabra que convence de pecado, y los hombres han reconocido el pecado como pecado y han caído como muertos ante el Señor y su ley. También sabemos lo que significa que el Espíritu de Dios use la espada, porque dentro de nuestro propio ser ha dejado las señales de su destreza. Ha matado nuestras dudas y nuestros temores, sin dejar desconfianzas que nos atormenten. Había un hombre de Dios que frecuentemente era asaltado por dudas, incluso acerca de los fundamentos de la religión. Aborrecía aquel estado de ánimo, pero no lograba librarse de la costumbre de cuestionarlo todo de manera pecaminosa. En respuesta a la oración, vino el Espíritu y lo convenció del orgullo de su intelecto y de la maldad de oponer su propio juicio a la Palabra del Señor; y, desde aquel día, nunca volvió a sufrir otro acceso de incredulidad. Vio las cosas claramente a la luz del Espíritu Santo, y eso es verlas de verdad. El gran gigante de la duda es herido gravemente por la espada del Espíritu; sí, muere por completo, porque el Espíritu obra en el creyente una convicción tal de la verdad que la certeza expulsa toda sospecha. Cuando el Espíritu Santo se enfrenta a los deseos de la carne, a los deseos de los ojos y a la soberbia de la vida, también estos quedan tendidos a sus pies como trofeos del poder de su arma formidable: ¡la Palabra de Dios! El Espíritu Santo es glorioso en el uso de esta espada. Encuentra que esta arma se adapta a su mano y no busca ninguna otra. Utilicémosla también nosotros, y hagámoslo con alegría. Aunque sea la espada del Espíritu, nuestra débil mano puede empuñarla; sí, y al hacerlo descubrir que algo del poder divino llega a nuestro brazo.

Queridos hermanos, ¿no es un altísimo honor para vosotros, como soldados de la cruz, que se os permita, más aún, que se os ordene tomar la espada del Espíritu? Al recluta inexperto no se le confía la espada del general; pero aquí vosotros sois armados con el arma de Dios el Espíritu Santo y llamados a llevar esa espada sagrada que el propio Señor Dios empuña con tanta gloria. Esta es la que debemos llevar, y ninguna otra. ¿Pregunta el corazón tímido: «Maestro mío, cómo enfrentaré a mis adversarios»? «Aquí», dice el Espíritu Santo, «¡toma esto! Esta es mi propia espada; he realizado grandes maravillas con ella. Tómala, y nada podrá resistirte». Cuando recordéis el poder de esta espada, cuando el Espíritu la pruebe en vosotros mismos, podréis tomarla con confianza y utilizarla en vuestra guerra santa con plena seguridad. Esa Palabra de Dios que pudo convertiros a vosotros puede convertir a cualquiera; si pudo matar vuestra desesperación, puede quitar el desaliento de otro; si ha vencido vuestro orgullo y vuestra obstinación, puede someter esas mismas cosas en vuestros hijos y vecinos. Después de haber hecho lo que indudablemente ha hecho por vosotros, podéis estar plenamente persuadidos de que, ante su poder, ningún caso carece de esperanza. Por tanto, aseguraos de no utilizar, desde este día en adelante, otra arma que la espada del Espíritu, que es la Palabra de Dios.

II. TAMBIÉN HA DE SER NUESTRA ESPADA

Esto me conduce directamente a la segunda parte de mi discurso. La Palabra de Dios es la espada del Espíritu, pero TAMBIÉN HA DE SER NUESTRA ESPADA.

Aquí debo comenzar de nuevo y recorrer buena parte del mismo terreno. Necesitaremos una espada. Nuestra guerra no es un juego de niños: hablamos en serio. Tenemos que enfrentarnos a enemigos feroces, a quienes solo se puede hacer frente con armas afiladas. En esta contienda no bastarán los puñetazos: tendremos que llegar a los golpes de espada. Quizá seáis de espíritu muy apacible, pero vuestros adversarios no lo son. Si vosotros pretendéis jugar a la guerra cristiana, ellos no lo harán. Enfrentarse a las potestades de las tinieblas no es una batalla simulada. Su intención es hacer daño. Nada sino vuestra condenación eterna satisfará los corazones diabólicos de Satanás y su séquito. Lo que debéis tomar no es tanto una bandera para desplegar o un tambor para tocar, sino una espada que usar, y una espada especialmente afilada. En este combate tendréis que emplear una espada que incluso los espíritus malignos puedan sentir, capaz de separar el alma y el espíritu, las coyunturas y los tuétanos. Si habéis de sobrevivir a esta lucha y salir victoriosos, no bastará ninguna forma de combate menos aguda y cortante que la lucha con espada. Tened por seguro que, en esta contienda, os veréis obligados a combatir de cerca. El enemigo apunta a vuestro corazón y acomete a fondo. No servirán una lanza ni un arco con flechas: el enemigo está demasiado cerca para cualquier cosa que no sea el combate cuerpo a cuerpo. Hermanos, nuestros enemigos no están solo en nuestra casa, sino en nuestro corazón. Encuentro dentro de mí un enemigo que siempre está cerca, y no puedo alejarme de él. Descubro que mi antagonista me agarrará de la garganta si puede. Si nuestros enemigos estuvieran lejos y pudiéramos bombardearlos con artillería capaz de matar a seis o siete millas de distancia, podríamos llevar una vida bastante cómoda. Pero no: ¡están aquí! ¡A nuestras puertas! Sí, dentro de nosotros, más cerca que nuestras manos y nuestros pies. Ahora necesitamos la espada corta, la claymore de la Sagrada Escritura, para dar estocadas y cortar, aquí cerca y ahora mismo. Ni la honda ni la piedra nos servirán aquí: debemos tomar la espada. Tienes que matar a tu enemigo, o tu enemigo te matará a ti. A nosotros, los cristianos, nos sucede como a los montañeses escoceses en la batalla, cuando su jefe les gritaba: «¡Muchachos, ahí están! Si no los matáis, ellos os matarán». No hay lugar para la paz: es una guerra a cuchillo, no solo ahora, sino hasta el fin de la vida.

El uso de la espada es necesario para atacar. Ya os he recordado varias veces que al cristiano no le basta con guardarse del pecado y apartar de sí la tentación: tiene que atacar a las potestades del mal. En nuestro caso, el mejor método de defensa es el ataque. He oído de alguien que entablaba un pleito para conseguir sus fines, pues consideraba que eso era mejor que ser el demandado. Esto podrá ser discutible, pero en la guerra a menudo es más seguro atacar que defenderse. Llevad la guerra al territorio del enemigo. Procurad ganar terreno al adversario, y él no os ganará tanto a vosotros. No os limitéis a ser sobrios: combatid la embriaguez. No os contentéis con estar personalmente libres de superstición: desenmascaradla dondequiera que aparezca. No seáis devotos únicamente cuando os sintáis obligados a ello: orad por el crecimiento del reino; orad siempre. No os limitéis a decir: «Mantendré a Satanás fuera de mi familia educando correctamente a mis hijos». Id también a la escuela dominical y enseñad a otros niños; así llevaréis la guerra más allá de la frontera. ¡Dios no permita que lleguemos jamás a la guerra como nación! Pero si estuviéramos en guerra con alguna nación del continente, ciertamente diría: «Que los continentales tengan las batallas en su propio territorio; no queremos una campaña aquí». Es sabio mantener la guerra en las propias regiones del enemigo. Si hubiéramos combatido más al diablo en el mundo, quizá nunca habría podido invadir la iglesia de una manera tan terrible como lo ha hecho. Atacad con la espada, porque ese es vuestro llamamiento, y así os defenderéis mejor.

Necesitamos la espada para un combate real. ¿Pensáis que podéis llegar al cielo soñando? ¿O viajar hasta allí en el carro de la comodidad? ¿O volar en las alas de la música de una banda de metales? Os equivocáis gravemente si lo imagináis. Se libra una guerra verdadera; vuestros adversarios hablan mortalmente en serio, y debéis tomar vuestra espada.

Y, además, necesitamos esta espada, esta espada del Espíritu, que es la Palabra de Dios. Decimos con David: «Ninguna hay como ella; dámela». Ha obrado tales maravillas que la preferimos a todas las demás. Ninguna otra estará a la altura del arma del enemigo. Si combatimos al diablo con la razón humana, la primera vez que nuestra espada de madera choque con una tentación satánica quedará hecha pedazos. Si no empuñáis una verdadera hoja de Jerusalén, corréis un grave peligro: vuestra arma se quebrará junto a la empuñadura, ¿y qué será de vosotros? Indefensos, sin otra cosa que el mango de una espada rota en la mano, seréis objeto de la burla de vuestro adversario. Debéis tener esta espada, porque ninguna otra atravesará al enemigo, y ninguna otra resistirá durante toda la batalla. Después de veinte años, ¿qué ha sido de las piadosas resoluciones de vuestra juventud? ¿Cuánto perdura vuestra consagración hecha en una hora de entusiasmo? ¡Ay, cuán poco se puede confiar en ella! ¿Qué sería de nosotros después de treinta años de lucha si no tuviéramos la Palabra de Dios en la que apoyarnos? La Palabra del Señor permanece para siempre, pero ninguna otra cosa permanece. Podemos marchar bien en los primeros años, pero fracasaremos en la vejez si no tenemos verdades eternas en las cuales apoyarnos.

Puedo recomendaros esta espada a todos, hermanos míos, aunque vuestros caracteres sean tan diferentes. Esta espada se adapta a cualquier mano. Jóvenes y ancianos pueden utilizar por igual esta arma. Estas queridas niñas del orfanato y aquellos muchachos de la clase bíblica pueden librar la batalla de su juventud con la Palabra de Dios, porque la Sagrada Escritura puede imprimir su sello en nuestra vida más temprana y guiarla. Vosotros que habéis encanecido, vosotros que habéis pasado de los setenta o los ochenta años, apreciaréis la Biblia más que nunca y descubriréis que esta espada es la mejor para los guerreros veteranos. Jóvenes de ambos sexos, aquí tenéis una espada apropiada para todos vosotros, que sienta bien en la mano del más débil y del más apacible. En la Palabra sagrada, el Espíritu Santo ha preparado un instrumento de guerra adecuado para las mentes grandes y pequeñas, para los instruidos y para quienes carecen de educación. Esta es una espada maravillosa que, en la mano de la fe, revela una capacidad de adaptación extraordinaria.
