<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lector Sereno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&display=swap">

<style>
/* ── Tokens: tema Claro (base) ───────────────────────────────── */
:root{
  --bg:#EDEAE4; --surface:#FCFBF8; --surface-2:#F4F1EB;
  --text:#23201C; --dim:#6B655C; --border:#DCD6CC;
  --accent:#14574E; --accent-ink:#FFFFFF; --accent-soft:#DDEBE7;
  --mark:#F7DFA6; --mark-text:#2A2318;
  --shadow:0 1px 2px rgba(35,32,28,.07), 0 10px 30px rgba(35,32,28,.10);
  --fs:20px; --lh:1.68;
}
:root[data-theme="papel"]{
  --bg:#E3D7BF; --surface:#F3E9D6; --surface-2:#EADEC6;
  --text:#37301F; --dim:#7B6C52; --border:#D5C5A5;
  --accent:#7A4A1E; --accent-ink:#FBF3E4; --accent-soft:#E4D2B2;
  --mark:#D9B96A; --mark-text:#2E2612;
  --shadow:0 1px 2px rgba(55,48,31,.08), 0 10px 30px rgba(55,48,31,.14);
}
:root[data-theme="penumbra"]{
  --bg:#2A2D30; --surface:#33373B; --surface-2:#3B4045;
  --text:#D5D1C9; --dim:#9B968D; --border:#464B50;
  --accent:#84C3B7; --accent-ink:#16211F; --accent-soft:#3E4F4C;
  --mark:#6D5A2C; --mark-text:#F6EEDC;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
}
:root[data-theme="nocturno"]{
  --bg:#0E1012; --surface:#15181B; --surface-2:#1D2125;
  --text:#C7C4BE; --dim:#8A857D; --border:#272B30;
  --accent:#6FBFB4; --accent-ink:#0C1413; --accent-soft:#1E3330;
  --mark:#4C3D18; --mark-text:#F1E7CF;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.5);
}
:root[data-theme="contraste"]{
  --bg:#000000; --surface:#000000; --surface-2:#111111;
  --text:#FFFFFF; --dim:#DDDDDD; --border:#FFFFFF;
  --accent:#FFE14D; --accent-ink:#000000; --accent-soft:#3A3200;
  --mark:#FFE14D; --mark-text:#000000;
  --shadow:0 0 0 1px #FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){
    --bg:#0E1012; --surface:#15181B; --surface-2:#1D2125;
    --text:#C7C4BE; --dim:#8A857D; --border:#272B30;
    --accent:#6FBFB4; --accent-ink:#0C1413; --accent-soft:#1E3330;
    --mark:#4C3D18; --mark-text:#F1E7CF;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.5);
  }
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%;
}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:5px}
button{font:inherit; color:inherit; cursor:pointer}

/* ── Barra superior: mínima ──────────────────────────────────── */
.bar{
  position:sticky; top:0; z-index:30;
  background:var(--surface); border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:10px; padding:0 12px; height:46px;
}
.brand{display:flex; align-items:baseline; gap:7px; flex:none}
.brand .glyph{color:var(--accent); font-size:14px}
.brand b{font-size:14px; font-weight:700; letter-spacing:-.01em}
#docName{
  flex:1; min-width:0; font-size:12px; color:var(--dim);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.btn{
  background:var(--surface-2); border:1px solid var(--border); color:var(--text);
  border-radius:8px; padding:6px 11px; font-size:13px; font-weight:500;
  display:inline-flex; align-items:center; gap:6px; flex:none;
}
.btn:hover{border-color:var(--accent); color:var(--accent)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.primary:hover{color:var(--accent-ink); filter:brightness(1.08)}
.btn .caret{font-size:9px; opacity:.7}
#ajustesBtn[aria-expanded="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}

/* ── Panel de ajustes ────────────────────────────────────────── */
.panel{
  position:fixed; z-index:40; top:54px; right:10px;
  width:min(380px, calc(100vw - 20px));
  max-height:calc(100vh - 120px); overflow:auto;
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  box-shadow:var(--shadow); padding:4px 16px 16px;
}
.panel[hidden]{display:none}
.panel section{display:grid; gap:9px; padding:14px 0; border-top:1px solid var(--border)}
.panel section:first-of-type{border-top:0}
.lbl{
  font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
  color:var(--dim); white-space:nowrap;
}
.fila{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.stats{font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums}

.stepper{display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden}
.stepper button{background:var(--surface-2); border:0; padding:7px 14px; line-height:1; font-size:15px; font-weight:600}
.stepper button:hover:not(:disabled){background:var(--accent); color:var(--accent-ink)}
.stepper button:disabled{opacity:.35; cursor:default}
.stepper .val{
  flex:1; display:grid; place-items:center; font-size:12px; font-weight:600; color:var(--dim);
  background:var(--surface); border-inline:1px solid var(--border); font-variant-numeric:tabular-nums;
}

.temas{display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
.chip{
  background:transparent; border:1px solid var(--border); border-radius:999px;
  padding:6px 8px; font-size:12px; display:flex; align-items:center; gap:6px; justify-content:center;
}
.chip .sw{width:13px; height:13px; border-radius:50%; border:1px solid rgba(128,128,128,.45); flex:none}
.chip[aria-pressed="true"]{border-color:var(--accent); color:var(--accent); font-weight:600; box-shadow:inset 0 0 0 1px var(--accent)}

.sel, .area{
  width:100%; font:inherit; font-size:13px; color:var(--text);
  background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:8px;
}
.area{min-height:130px; line-height:1.5; resize:vertical}
.deslizador{display:grid; gap:5px}
.deslizador .top{display:flex; justify-content:space-between; align-items:baseline}
.deslizador .num{font-size:12px; font-weight:600; font-variant-numeric:tabular-nums}
input[type=range]{width:100%; accent-color:var(--accent); margin:0}
.atajos{font-size:11.5px; color:var(--dim); line-height:1.7}
.atajos kbd{
  font:inherit; font-size:10.5px; font-weight:600; border:1px solid var(--border);
  background:var(--surface-2); border-radius:4px; padding:1px 5px;
}
#pegar[hidden]{display:none}

/* ── Aviso ───────────────────────────────────────────────────── */
.aviso{
  background:var(--accent-soft); color:var(--text); border-bottom:1px solid var(--border);
  font-size:12px; line-height:1.5; padding:9px 12px; display:flex; gap:10px; align-items:flex-start;
}
.aviso[hidden]{display:none}
.aviso p{margin:0; flex:1}
.aviso button{background:none; border:0; color:var(--dim); font-size:15px; line-height:1; padding:0 2px}

/* ── Lectura: el área grande ─────────────────────────────────── */
main{padding:30px 18px 96px}
#article{
  max-width:34em; margin:0 auto;
  font-family:"Literata",Georgia,"Times New Roman",serif;
  font-size:var(--fs); line-height:var(--lh); text-wrap:pretty;
}
#article .h{font-size:1.15em; font-weight:600; margin:0 0 1.1em; letter-spacing:-.01em; text-wrap:balance}
#article p{margin:0 0 1.05em}
.sent{border-radius:4px; transition:background .12s ease}
.sent:hover{background:var(--accent-soft); cursor:pointer}
.sent.on{
  background:var(--mark); color:var(--mark-text);
  box-decoration-break:clone; -webkit-box-decoration-break:clone;
  padding:.06em .1em; margin:0 -.1em;
}

/* ── Reproductor: una sola fila ──────────────────────────────── */
.player{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  background:var(--surface); border-top:1px solid var(--border);
  padding:7px 12px calc(7px + env(safe-area-inset-bottom));
  display:flex; align-items:center; gap:12px;
}
.transport{display:flex; align-items:center; gap:7px; flex:none}
.tbtn{
  width:34px; height:34px; border-radius:50%; border:1px solid var(--border);
  background:var(--surface-2); display:grid; place-items:center; padding:0;
}
.tbtn:hover{border-color:var(--accent); color:var(--accent)}
.tbtn svg{width:14px; height:14px; fill:currentColor}
#play{width:42px; height:42px; background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
#play:hover{color:var(--accent-ink); filter:brightness(1.08)}
#play svg{width:17px; height:17px}
.prog{flex:1; min-width:0; display:flex; flex-direction:column; gap:5px}
.prog .row{display:flex; justify-content:space-between; gap:10px; font-size:11px; color:var(--dim); font-variant-numeric:tabular-nums}
.prog .row span:first-child{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.prog .row span:last-child{flex:none}
.track{height:3px; border-radius:99px; background:var(--surface-2); border:1px solid var(--border); overflow:hidden}
.track i{display:block; height:100%; width:0; background:var(--accent); transition:width .18s linear}

/* ── Soltar archivo ──────────────────────────────────────────── */
.drop{
  position:fixed; inset:0; z-index:60; display:none; place-items:center;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  font-size:16px; font-weight:600;
}
.drop.on{display:grid}
.drop div{border:2px dashed var(--accent); color:var(--accent); border-radius:16px; padding:44px 60px; text-align:center}

@media (max-width:520px){
  .panel{right:8px; left:8px; width:auto; top:52px}
  .brand b{display:none}
  main{padding:24px 16px 92px}
  .tbtn{width:36px; height:36px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important; scroll-behavior:auto !important}
}
</style>

<header class="bar">
  <span class="brand"><span class="glyph">❧</span><b>Lector Sereno</b></span>
  <span id="docName">Texto de ejemplo</span>
  <button class="btn primary" id="openBtn">Abrir</button>
  <button class="btn" id="ajustesBtn" aria-expanded="false" aria-controls="panel">Ajustes <span class="caret">▼</span></button>
  <input type="file" id="file" accept=".txt,.md,.markdown,text/plain,text/markdown" hidden>
</header>

<div class="aviso" id="aviso" hidden>
  <p id="avisoTexto"></p>
  <button id="avisoCerrar" aria-label="Cerrar el aviso">×</button>
</div>

<div class="panel" id="panel" hidden>
  <section>
    <span class="lbl">Texto</span>
    <div class="fila">
      <button class="btn primary" id="openBtn2">Abrir archivo .txt</button>
      <button class="btn" id="pegarBtn">Pegar texto</button>
    </div>
    <p class="stats" id="stats"></p>
    <div id="pegar" hidden>
      <textarea class="area" id="pegarArea" placeholder="Pega o escribe aquí el texto que quieras leer…"></textarea>
      <div class="fila" style="margin-top:8px">
        <button class="btn primary" id="usarTexto">Usar este texto</button>
        <button class="btn" id="cancelarPegar">Cancelar</button>
      </div>
    </div>
  </section>

  <section>
    <span class="lbl">Tamaño de la letra</span>
    <div class="stepper">
      <button id="minus" title="Reducir (tecla −)" aria-label="Reducir el tamaño del texto">A−</button>
      <span class="val" id="fsVal">20 px</span>
      <button id="plus" title="Aumentar (tecla +)" aria-label="Aumentar el tamaño del texto">A+</button>
    </div>
  </section>

  <section>
    <span class="lbl">Tema</span>
    <div class="temas" id="temas" role="group" aria-label="Tema de lectura"></div>
  </section>

  <section>
    <span class="lbl">Voz</span>
    <select class="sel" id="voice" aria-label="Voz de lectura"></select>
    <div class="deslizador">
      <div class="top"><label class="lbl" for="rate">Velocidad</label><span class="num" id="rateVal">1.0×</span></div>
      <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">
    </div>
    <div class="deslizador">
      <div class="top"><label class="lbl" for="vol">Volumen</label><span class="num" id="volVal">100 %</span></div>
      <input type="range" id="vol" min="0" max="1" step="0.05" value="1">
    </div>
  </section>

  <section>
    <p class="atajos">
      Toca cualquier frase para leer desde ahí.<br>
      <kbd>espacio</kbd> reproducir o pausar · <kbd>←</kbd> <kbd>→</kbd> frase anterior o siguiente ·
      <kbd>+</kbd> <kbd>−</kbd> tamaño · <kbd>esc</kbd> cerrar este panel
    </p>
  </section>
</div>

<main><article id="article"></article></main>

<footer class="player">
  <div class="transport">
    <button class="tbtn" id="prev" title="Frase anterior" aria-label="Frase anterior"><svg viewBox="0 0 24 24"><path d="M7 5h2.5v14H7zm11 0v14l-9-7z"/></svg></button>
    <button class="tbtn" id="play" title="Leer en voz alta (espacio)" aria-label="Leer en voz alta"><svg id="playIcon" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg></button>
    <button class="tbtn" id="next" title="Frase siguiente" aria-label="Frase siguiente"><svg viewBox="0 0 24 24"><path d="M14.5 5H17v14h-2.5zM6 5l9 7-9 7z"/></svg></button>
    <button class="tbtn" id="stop" title="Detener" aria-label="Detener la lectura"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg></button>
  </div>
  <div class="prog">
    <div class="row"><span id="progText">Listo para leer</span><span id="progPct">0 %</span></div>
    <div class="track"><i id="progBar"></i></div>
  </div>
</footer>

<div class="drop" id="drop"><div>Suelta aquí tu archivo de texto</div></div>

<script>
(function(){
"use strict";

const $ = s => document.querySelector(s);
const synth = window.speechSynthesis;
const store = {
  get(k, d){ try{ const v = localStorage.getItem("lector."+k); return v===null?d:v; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("lector."+k, v); }catch(e){} }
};
function esc(t){ return String(t).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

const DEMO = `Cómo usar este lector

Este es un texto de ejemplo. Abre un archivo de texto con el botón de arriba, o arrástralo sobre esta página, y el contenido aparecerá aquí listo para leer.

Todos los ajustes viven en el panel Ajustes, para dejarle a la lectura el resto de la pantalla. Ahí eliges el tema, el tamaño de la letra, la voz, la velocidad y el volumen.

Para escuchar el texto, presiona el botón de reproducción. La frase que se está leyendo queda resaltada y la página la sigue sola. Si quieres empezar en otro punto, toca directamente la frase.

Los temas Claro y Papel descansan la vista de día; Penumbra y Nocturno sirven de noche; Contraste está pensado para quien necesita el máximo de legibilidad.

Todo ocurre dentro de tu navegador. El archivo que abres no se envía a ningún servidor.`;

const S = { chunks:[], i:0, playing:false, paused:false, gen:0, words:0 };

/* ── Panel de ajustes ────────────────────────────────────────── */
const panel = $("#panel"), ajustesBtn = $("#ajustesBtn");
function abrirPanel(abrir){
  panel.hidden = !abrir;
  ajustesBtn.setAttribute("aria-expanded", String(abrir));
}
ajustesBtn.addEventListener("click", e => { e.stopPropagation(); abrirPanel(panel.hidden); });
panel.addEventListener("click", e => e.stopPropagation());
document.addEventListener("click", () => { if(!panel.hidden) abrirPanel(false); });

function aviso(html){
  $("#avisoTexto").innerHTML = html || "";
  $("#aviso").hidden = !html;
}
$("#avisoCerrar").addEventListener("click", () => aviso(""));

/* ── Temas ───────────────────────────────────────────────────── */
const TEMAS = [
  {id:"auto",      label:"Auto",      sw:"linear-gradient(135deg,#FCFBF8 50%,#15181B 50%)"},
  {id:"claro",     label:"Claro",     sw:"#FCFBF8"},
  {id:"papel",     label:"Papel",     sw:"#F3E9D6"},
  {id:"penumbra",  label:"Penumbra",  sw:"#33373B"},
  {id:"nocturno",  label:"Nocturno",  sw:"#0E1012"},
  {id:"contraste", label:"Contraste", sw:"linear-gradient(135deg,#000 50%,#FFE14D 50%)"}
];
const cajaTemas = $("#temas");
TEMAS.forEach(t => {
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.dataset.id = t.id;
  const sw = document.createElement("span"); sw.className = "sw"; sw.style.background = t.sw;
  b.append(sw, document.createTextNode(t.label));
  b.addEventListener("click", () => setTema(t.id));
  cajaTemas.appendChild(b);
});
function setTema(id){
  store.set("tema", id);
  if(id === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", id);
  cajaTemas.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c.dataset.id === id)));
}
const temaGuardado = store.get("tema", "auto");
setTema(TEMAS.some(t => t.id === temaGuardado) ? temaGuardado : "auto");

/* ── Tamaño de letra ─────────────────────────────────────────── */
const TAMANOS = [16,17,18,19,20,22,24,26,28,31,34,38];
let ti = TAMANOS.indexOf(parseInt(store.get("tam","20"),10));
if(ti < 0) ti = 4;
function setTamano(n){
  ti = Math.max(0, Math.min(TAMANOS.length-1, n));
  document.documentElement.style.setProperty("--fs", TAMANOS[ti]+"px");
  $("#fsVal").textContent = TAMANOS[ti]+" px";
  $("#minus").disabled = ti === 0;
  $("#plus").disabled = ti === TAMANOS.length-1;
  store.set("tam", TAMANOS[ti]);
}
$("#minus").addEventListener("click", () => setTamano(ti-1));
$("#plus").addEventListener("click", () => setTamano(ti+1));
setTamano(ti);

/* ── Partir el texto en frases ───────────────────────────────── */
const MAX = 170;
const ABBR = /^(sr|sra|srta|dr|dra|lic|ing|prof|ud|uds|etc|ej|p|pág|pag|núm|num|fig|vol|av|aprox|máx|mín|min|max|ss|art|cap|ed|tel|dept|depto)\.$/i;
/* Un punto solo cierra la frase si le sigue un espacio y no viene de una abreviatura. */
function cortes(p){
  const out = []; let start = 0;
  for(let i = 0; i < p.length; i++){
    if(".!?…".indexOf(p[i]) < 0) continue;
    let j = i;
    while(j+1 < p.length && ".!?…\"'”’»)]".indexOf(p[j+1]) >= 0) j++;
    const next = p[j+1];
    if(next !== undefined && !/\s/.test(next)){ i = j; continue; }        /* .txt, 3.14, ejemplo.com */
    const piece = p.slice(start, j+1);
    const last = piece.trim().split(/\s+/).pop() || "";
    if(p[j] === "." && (ABBR.test(last) || /^[\wÁÉÍÓÚÑ]\.$/.test(last))){ i = j; continue; }
    const t = piece.trim(); if(t) out.push(t);
    start = j+1; i = j;
  }
  const tail = p.slice(start).trim();
  if(tail) out.push(tail);
  return out.length ? out : [p];
}
function frases(p){
  const out = [];
  cortes(p).forEach(raw => {
    const s = raw.trim();
    if(!s) return;
    if(s.length < 26 && out.length){ out[out.length-1] += " " + s; return; }
    if(s.length <= MAX){ out.push(s); return; }
    let rest = s;
    while(rest.length > MAX){
      let cut = rest.lastIndexOf(",", MAX);
      if(cut < MAX*0.5) cut = rest.lastIndexOf(" ", MAX);
      if(cut < MAX*0.4) cut = MAX;
      out.push(rest.slice(0, cut+1).trim());
      rest = rest.slice(cut+1).trim();
    }
    if(rest) out.push(rest);
  });
  return out.length ? out : [p];
}

/* ── Pintar el texto ─────────────────────────────────────────── */
const article = $("#article");
function render(raw, nombre){
  stop();
  const limpio = String(raw).replace(/\r\n?/g, "\n").replace(/ /g, " ").trim();
  let parrafos = limpio.split(/\n{2,}/).map(t => t.trim()).filter(Boolean);
  if(parrafos.length < 2) parrafos = limpio.split(/\n/).map(t => t.trim()).filter(Boolean);

  S.chunks = [];
  article.textContent = "";
  parrafos.forEach((p, pi) => {
    const el = document.createElement("p");
    if(pi === 0 && p.length < 90 && !/[.!?]$/.test(p)) el.className = "h";
    frases(p.replace(/\n/g, " ")).forEach(f => {
      const sp = document.createElement("span");
      sp.className = "sent"; sp.textContent = f;
      sp.dataset.i = S.chunks.length; sp.title = "Leer desde aquí";
      el.append(sp, document.createTextNode(" "));
      S.chunks.push({ text:f, el:sp });
    });
    article.appendChild(el);
  });

  S.words = (limpio.match(/[\wÀ-ÿ'’-]+/g) || []).length;
  $("#docName").textContent = nombre;
  stats(); progress();
  window.scrollTo({ top:0, behavior:"auto" });
}
function stats(){
  const wpm = 165 * Number($("#rate").value);
  const min = Math.max(1, Math.round(S.words / wpm));
  $("#stats").textContent =
    S.words.toLocaleString("es") + " palabras · " + S.chunks.length.toLocaleString("es") +
    " frases · ≈ " + min + " min en voz a " + Number($("#rate").value).toFixed(1) + "×";
}

/* ── Abrir archivos ──────────────────────────────────────────── */
function cargarArchivo(f){
  if(!f) return;
  const ok = /\.(txt|md|markdown|text|log|csv)$/i.test(f.name) || /^text\//.test(f.type) || f.type === "";
  if(!ok){ aviso("Ese archivo no es de texto. Usa un archivo <b>.txt</b> (o .md); para un PDF o un Word, guarda antes el contenido como texto plano."); return; }
  const r = new FileReader();
  r.onload = () => {
    render(r.result, f.name);
    store.set("txt", String(r.result).slice(0, 300000));
    store.set("nom", f.name);
    aviso(""); abrirPanel(false);
  };
  r.onerror = () => aviso("No se pudo leer el archivo. Intenta abrirlo de nuevo.");
  r.readAsText(f, "utf-8");
}
$("#openBtn").addEventListener("click", () => $("#file").click());
$("#openBtn2").addEventListener("click", () => $("#file").click());
$("#file").addEventListener("change", e => { cargarArchivo(e.target.files[0]); e.target.value = ""; });

const drop = $("#drop");
let arrastres = 0;
window.addEventListener("dragenter", e => { e.preventDefault(); if(++arrastres) drop.classList.add("on"); });
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("dragleave", () => { if(--arrastres <= 0){ arrastres = 0; drop.classList.remove("on"); } });
window.addEventListener("drop", e => {
  e.preventDefault(); arrastres = 0; drop.classList.remove("on");
  if(e.dataTransfer.files && e.dataTransfer.files[0]) cargarArchivo(e.dataTransfer.files[0]);
});

$("#pegarBtn").addEventListener("click", () => {
  const caja = $("#pegar");
  caja.hidden = !caja.hidden;
  if(!caja.hidden) $("#pegarArea").focus();
});
$("#cancelarPegar").addEventListener("click", () => { $("#pegar").hidden = true; });
$("#usarTexto").addEventListener("click", () => {
  const t = $("#pegarArea").value.trim();
  if(!t){ aviso("Escribe o pega algún texto antes de continuar."); return; }
  render(t, "Texto pegado");
  store.set("txt", t.slice(0, 300000)); store.set("nom", "Texto pegado");
  $("#pegar").hidden = true; aviso(""); abrirPanel(false);
});

/* ── Voces del sistema ───────────────────────────────────────── */
const PREF = ["es-MX","es-US","es-419","es-CO","es-AR","es-CL","es-PE","es-VE","es-EC","es-GT","es-CR","es-PA","es-DO","es-BO","es-UY","es-PY","es-HN","es-NI","es-SV","es-PR","es-CU"];
/* Equivalentes más cercanos a Paulina en cada plataforma, de mejor a peor. */
const BUENAS = [
  "paulina", "angélica", "angelica", "dalia", "sabina",
  "google español de estados unidos", "jorge", "raúl", "raul",
  "juan", "francisca", "diego", "google español"
];
/* Voces de fantasía que traen macOS e iOS: sirven para jugar, no para leer. */
const NOVEDAD = ["eddy","flo","grandma","grandpa","reed","rocko","sandy","shelley","superstar",
  "bells","boing","bubbles","jester","organ","trinoids","whisper","wobble","zarvox","albert","cellos"];
const voiceSel = $("#voice");
let voices = [], voice = null;

function novedad(v){ return NOVEDAD.indexOf((v.name || "").toLowerCase().split(" (")[0].trim()) >= 0; }
function esLatina(v){ return PREF.indexOf((v.lang || "").replace("_", "-")) >= 0; }
function conocida(v){
  const n = (v.name || "").toLowerCase();
  return BUENAS.findIndex(b => n.indexOf(b) >= 0);
}
function rank(v){
  const lang = (v.lang || "").replace("_", "-");
  const c = conocida(v), lat = PREF.indexOf(lang);
  if(novedad(v)) return 700 + (lat >= 0 ? 0 : 10);
  if(c >= 0 && lat >= 0) return c;
  if(lat >= 0) return 50 + lat;
  if(c >= 0) return 250;
  if(/^es-ES/i.test(lang)) return 320;
  if(/^es/i.test(lang)) return 300;
  return 900;
}
const GRUPOS = [
  ["Recomendadas · español latino", r => r < 50],
  ["Otras voces en español latino", r => r >= 50 && r < 250],
  ["Voces en español de España",    r => r >= 250 && r < 700],
  ["Voces de fantasía del sistema", r => r >= 700 && r < 900],
  ["Otras voces",                   r => r >= 900]
];
function loadVoices(definitivo){
  if(!synth) return;
  const todas = synth.getVoices() || [];
  if(!todas.length && !definitivo) return;      /* la lista todavía no llega */
  const es = todas.filter(v => /^es/i.test(v.lang || ""));
  voices = (es.length ? es : todas).sort((a,b) => rank(a)-rank(b) || a.name.localeCompare(b.name));

  voiceSel.textContent = "";
  GRUPOS.forEach(g => {
    const lista = voices.map((v, i) => [v, i]).filter(par => g[1](rank(par[0])));
    if(!lista.length) return;
    const og = document.createElement("optgroup");
    og.label = g[0];
    lista.forEach(par => {
      const o = document.createElement("option");
      o.value = par[1];
      o.textContent = (par[1] === 0 ? "★ " : "") + par[0].name + " · " + par[0].lang;
      og.appendChild(o);
    });
    voiceSel.appendChild(og);
  });

  const guardada = store.get("voz", "");
  let idx = -1;
  if(guardada){
    idx = voices.findIndex(v => v.name + "|" + v.lang === guardada);
    if(idx < 0){
      const nom = guardada.split("|")[0].toLowerCase();
      idx = voices.findIndex(v => v.name.toLowerCase() === nom);
    }
  }
  if(idx < 0) idx = voices.length ? 0 : -1;
  if(idx >= 0){ voiceSel.value = idx; voice = voices[idx]; }

  if(!voices.length){
    if(definitivo) aviso("Tu navegador no tiene voces instaladas para leer en voz alta. En Windows y Android puedes agregar una voz en español desde los ajustes del sistema.");
  }else if(!es.length){
    aviso("No hay voces en español instaladas en este equipo; se usará la voz disponible. Puedes agregar una voz en español desde los ajustes del sistema.");
  }else if(conocida(voices[idx]) < 0 || !esLatina(voices[idx])){
    aviso("En este equipo no está Paulina ni otra voz latina de las recomendadas. Se eligió <b>" + esc(voices[idx].name) + "</b>, la mejor disponible aquí; puedes cambiarla en Ajustes.");
  }
}
voiceSel.addEventListener("change", () => {
  voice = voices[voiceSel.value] || null;
  if(voice){ store.set("voz", voice.name + "|" + voice.lang); aviso(""); }
  if(S.playing) restart();
});
if(synth){
  loadVoices();
  const alCambiar = () => loadVoices();
  synth.addEventListener ? synth.addEventListener("voiceschanged", alCambiar) : (synth.onvoiceschanged = alCambiar);
  setTimeout(alCambiar, 400);
  setTimeout(() => loadVoices(true), 1600);     /* recién aquí damos por cerrada la lista */
}else{
  aviso("Este navegador no admite la lectura en voz alta. El texto, los temas y el tamaño de letra funcionan igual.");
  ["play","prev","next","stop","rate","vol","voice"].forEach(id => { $("#"+id).disabled = true; });
}

/* ── Lectura en voz alta ─────────────────────────────────────── */
const isChromium = /Chrome|Chromium|Edg|OPR/.test(navigator.userAgent) && !/CriOS|FxiOS/.test(navigator.userAgent);
let keepAlive = null;
function rate(){ return Number($("#rate").value); }
function volume(){ return Number($("#vol").value); }

function speakCurrent(){
  if(!synth || !S.chunks[S.i]) return;
  const u = new SpeechSynthesisUtterance(S.chunks[S.i].text);
  const g = ++S.gen;
  if(voice) u.voice = voice;
  u.lang = (voice && voice.lang) || "es-MX";
  u.rate = rate(); u.volume = volume(); u.pitch = 1;
  u.onend = () => {
    if(g !== S.gen || !S.playing) return;
    if(S.i < S.chunks.length - 1){ S.i++; highlight(); speakCurrent(); }
    else { stop(); $("#progText").textContent = "Lectura terminada"; }
  };
  u.onerror = ev => {
    if(g !== S.gen) return;
    if(ev.error === "interrupted" || ev.error === "canceled") return;
    stop(); aviso("La lectura se interrumpió. Presiona reproducir para continuar.");
  };
  highlight();
  synth.speak(u);
  guard();
}
/* Chrome corta las frases largas pasados ~15 s: lo evitamos con un pulso. */
function guard(){
  clearInterval(keepAlive);
  if(!isChromium || rate() >= 1) return;
  keepAlive = setInterval(() => {
    if(S.playing && !S.paused && synth.speaking && !synth.paused){ synth.pause(); synth.resume(); }
  }, 9000);
}
function playFrom(i){
  if(!synth || !S.chunks.length) return;
  synth.cancel(); S.gen++;
  S.i = Math.max(0, Math.min(S.chunks.length-1, i));
  S.playing = true; S.paused = false; icon();
  setTimeout(() => { if(S.playing) speakCurrent(); }, 80);
}
function restart(){ if(S.playing) playFrom(S.i); }
function toggle(){
  if(!synth || !S.chunks.length) return;
  if(!S.playing){ playFrom(S.i); return; }
  if(S.paused){
    synth.resume();
    if(!synth.speaking) speakCurrent();   /* algunos navegadores olvidan la frase */
    S.paused = false;
  }else{
    synth.pause(); S.paused = true;
  }
  icon(); progress();
}
function stop(){
  S.playing = false; S.paused = false; S.gen++;
  clearInterval(keepAlive);
  if(synth) synth.cancel();
  icon(); progress();
}
function step(d){
  const n = Math.max(0, Math.min(S.chunks.length-1, S.i + d));
  if(S.playing) playFrom(n);
  else { S.i = n; highlight(); progress(); }
}
function highlight(){
  S.chunks.forEach((c, n) => c.el.classList.toggle("on", n === S.i));
  const el = S.chunks[S.i] && S.chunks[S.i].el;
  if(el){
    const r = el.getBoundingClientRect();
    if(r.top < 80 || r.bottom > window.innerHeight - 90){
      const suave = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      el.scrollIntoView({ block:"center", behavior: suave ? "smooth" : "auto" });
    }
  }
  progress();
}
function icon(){
  $("#playIcon").innerHTML = (S.playing && !S.paused)
    ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>'
    : '<path d="M7 4l13 8-13 8z"/>';
  $("#play").title = (S.playing && !S.paused) ? "Pausar (espacio)" : "Leer en voz alta (espacio)";
}
function progress(){
  const total = S.chunks.length || 1;
  const pct = S.playing || S.i > 0 ? Math.round((S.i + (S.playing ? 1 : 0)) / total * 100) : 0;
  $("#progBar").style.width = pct + "%";
  $("#progPct").textContent = pct + " %";
  $("#progText").textContent = S.playing
    ? (S.paused ? "En pausa · frase " : "Leyendo · frase ") + (S.i+1) + " de " + total
    : (S.i > 0 ? "Detenido en la frase " + (S.i+1) : "Listo para leer");
}

$("#play").addEventListener("click", toggle);
$("#stop").addEventListener("click", () => { stop(); S.i = 0; highlight(); });
$("#prev").addEventListener("click", () => step(-1));
$("#next").addEventListener("click", () => step(1));
article.addEventListener("click", e => {
  const s = e.target.closest(".sent");
  if(s) playFrom(Number(s.dataset.i));
});

$("#rate").addEventListener("input", () => { $("#rateVal").textContent = rate().toFixed(1) + "×"; stats(); });
$("#rate").addEventListener("change", () => { store.set("vel", rate()); restart(); });
$("#vol").addEventListener("input", () => { $("#volVal").textContent = Math.round(volume()*100) + " %"; });
$("#vol").addEventListener("change", () => { store.set("vol", volume()); restart(); });

document.addEventListener("keydown", e => {
  const t = e.target;
  if(e.key === "Escape" && !panel.hidden){ abrirPanel(false); return; }
  if(t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT" || t.tagName === "SELECT")) return;
  if(e.key === " "){ e.preventDefault(); toggle(); }
  else if(e.key === "ArrowRight"){ e.preventDefault(); step(1); }
  else if(e.key === "ArrowLeft"){ e.preventDefault(); step(-1); }
  else if(e.key === "+" || e.key === "="){ setTamano(ti+1); }
  else if(e.key === "-" || e.key === "_"){ setTamano(ti-1); }
});
window.addEventListener("beforeunload", () => { if(synth) synth.cancel(); });

/* ── Arranque ────────────────────────────────────────────────── */
$("#rate").value = store.get("vel","1");
$("#vol").value = store.get("vol","1");
$("#rateVal").textContent = rate().toFixed(1) + "×";
$("#volVal").textContent = Math.round(volume()*100) + " %";
const guardado = store.get("txt", "");
render(guardado || DEMO, guardado ? store.get("nom","Tu texto") : "Texto de ejemplo");
})();
</script>
